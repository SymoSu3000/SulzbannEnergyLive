@media (

* {

}


html,
body {

    width: 100%;
    height: 100%;

}


#wrap {

}


#energySvg {

}


/* =========================================================
   LINIEN
   ========================================================= */

.flow-line {

    stroke:
        var(--line);

    stroke-width: 4;

    stroke-linecap:

    fill:

}


/* =========================================================
   KREISE
   ========================================================= */

.node-ring {

    fill:

    stroke-width: 4;
}


.house-fill {

    fill:

            var(--house) 32%,

/* =========================================================
   ICONS
   ========================================================= */

    stroke-width: 4;

    stroke-linecap:
        round;

    stroke-linejoin:

}


/* =========================================================
   TEXTE
   ========================================================= */

.value {

.label {

}


.sub {

}


/* =========================================================
   ENERGIEPUNKTE
   ========================================================= */

.dot {

}

<script>


const SVG_NS =
    'http://www.w3.org/2000/svg';


const $ =
    id =>
        document.getElementById(
            id
        );


let lastPayload =
    null;


/* =========================================================
   LEISTUNG -> ANIMATIONSGESCHWINDIGKEIT

   wenig Leistung = langsam
   viel Leistung = maximal etwa bisheriges Tempo
   ========================================================= */

function flowDuration(
    powerKW
)
{
    const power =
        Math.max(
            0,
            Number(
                powerKW || 0
            )
        );


    /*
     * 0 kW     -> 6.0 Sekunden
     * 1 kW     -> ca. 4.7 Sekunden
     * 3 kW     -> ca. 3.0 Sekunden
     * 6 kW+    -> ca. 1.9 Sekunden
     */

    const normalized =
        Math.min(
            power / 6,
            1
        );


    const shaped =
        Math.sqrt(
            normalized
        );


    return (
        6.0
        -
        shaped
        *
        4.1
    );
}


/* =========================================================
   PUNKT ERSTELLEN
   ========================================================= */

function makeDot(
    groupID,
    pathID,
    color,
    delay,
    duration
)
{
    const group =
        $(groupID);


    const circle =
        document.createElementNS(
            SVG_NS,
            'circle'
        );


    circle.setAttribute(
        'r',
        '7'
    );


    circle.setAttribute(
        'fill',
        color
    );


    circle.setAttribute(
        'class',
        'dot'
    );


    circle.style.color =
        color;


    const motion =
        document.createElementNS(
            SVG_NS,
            'animateMotion'
        );


    motion.setAttribute(
        'dur',
        duration + 's'
    );


    motion.setAttribute(
        'begin',
        delay + 's'
    );


    motion.setAttribute(
        'repeatCount',
        'indefinite'
    );


    motion.setAttribute(
        'calcMode',
        'linear'
    );


    const motionPath =
        document.createElementNS(
            SVG_NS,
            'mpath'
        );


    motionPath.setAttribute(
        'href',
        '#' + pathID
    );


    motion.appendChild(
        motionPath
    );


    circle.appendChild(
        motion
    );


    group.appendChild(
        circle
    );
}


/* =========================================================
   GRUPPE LEEREN
   ========================================================= */

function clearGroup(
    id
)
{
    const group =
        $(id);


    while (
        group.firstChild
    ) {

        group.removeChild(
            group.firstChild
        );
    }
}


/* =========================================================
   PUNKT-FARBVERTEILUNG
   ========================================================= */

function allocateDots(
    weights,
    amount = 6
)
{
    const entries =
        Object
        .entries(
            weights
        )
        .filter(
            ([, value]) =>
                Number(value) > 0.0001
        );


    if (
        entries.length === 0
    ) {
        return [];
    }


    const total =
        entries.reduce(
            (
                sum,
                [, value]
            ) =>
                sum
                +
                Number(value),
            0
        );


    const result = [];


    let distributed = 0;


    const calculated =
        entries.map(
            (
                [key, value]
            ) => {

                const raw =
                    Number(value)
                    /
                    total
                    *
                    amount;


                const count =
                    Math.floor(
                        raw
                    );


                distributed +=
                    count;


                return {
                    key,
                    raw,
                    count
                };
            }
        );


    while (
        distributed < amount
    ) {

        calculated.sort(
            (
                a,
                b
            ) =>
                (
                    b.raw
                    -
                    b.count
                )
                -
                (
                    a.raw
                    -
                    a.count
                )
        );


        calculated[0].count++;

        distributed++;
    }


    let remaining =
        calculated.reduce(
            (
                sum,
                item
            ) =>
                sum
                +
                item.count,
            0
        );


    while (
        remaining > 0
    ) {

        for (
            const item
            of calculated
        ) {

            if (
                item.count > 0
            ) {

                result.push(
                    item.key
                );

                item.count--;

                remaining--;
            }
        }
    }


    return result.slice(
        0,
        amount
    );
}


/* =========================================================
   WETTERSYMBOL
   ========================================================= */

const weatherIDs = [

    'weatherSun',
    'weatherPartlyCloudy',
    'weatherCloud',
    'weatherRain',
    'weatherStorm',
    'weatherSnow',
    'weatherFog',
    'weatherMoon'

];


function hideWeatherIcons()
{
    weatherIDs.forEach(
        id => {

            const element =
                $(id);

            if (
                element
            ) {

                element.setAttribute(
                    'display',
                    'none'
                );
            }
        }
    );
}


function showWeatherIcon(
    id
)
{
    hideWeatherIcons();


    const element =
        $(id);


    if (
        element
    ) {

        element.setAttribute(
            'display',
            ''
        );
    }
}


/* =========================================================
   WETTER AUSWERTEN
   ========================================================= */

function updateWeather(
    conditionID,
    weatherIcon,
    rainDetected
)
{
    /*
     * Realer Regensensor hat Vorrang.
     */

    if (
        rainDetected
    ) {

        showWeatherIcon(
            'weatherRain'
        );

        return;
    }


    const condition =
        Number(
            conditionID || 0
        );


    const icon =
        String(
            weatherIcon || ''
        );


    const night =
        icon.endsWith(
            'n'
        );


    /*
     * Gewitter
     */

    if (
        condition >= 200
        &&
        condition < 300
    ) {

        showWeatherIcon(
            'weatherStorm'
        );

        return;
    }


    /*
     * Niesel / Regen
     */

    if (
        (
            condition >= 300
            &&
            condition < 400
        )
        ||
        (
            condition >= 500
            &&
            condition < 600
        )
    ) {

        showWeatherIcon(
            'weatherRain'
        );

        return;
    }


    /*
     * Schnee
     */

    if (
        condition >= 600
        &&
        condition < 700
    ) {

        showWeatherIcon(
            'weatherSnow'
        );

        return;
    }


    /*
     * Nebel / Dunst
     */

    if (
        condition >= 700
        &&
        condition < 800
    ) {

        showWeatherIcon(
            'weatherFog'
        );

        return;
    }


    /*
     * Klar
     */

    if (
        condition === 800
    ) {

        showWeatherIcon(
            night
            ? 'weatherMoon'
            : 'weatherSun'
        );

        return;
    }


    /*
     * leicht bewölkt
     */

    if (
        condition === 801
        ||
        condition === 802
    ) {

        showWeatherIcon(
            night
            ? 'weatherCloud'
            : 'weatherPartlyCloudy'
        );

        return;
    }


    /*
     * stark bewölkt
     */

    if (
        condition === 803
        ||
        condition === 804
    ) {

        showWeatherIcon(
            'weatherCloud'
        );

        return;
    }


    /*
     * Fallback
     */

    showWeatherIcon(
        night
        ? 'weatherMoon'
        : 'weatherCloud'
    );
}


/* =========================================================
   LEISTUNG FORMATIEREN
   ========================================================= */

function powerText(
    value
)
{
    const number =
        Math.max(
            0,
            Number(
                value || 0
            )
        );


    if (
        number < 1
    ) {

        return (
            number
            *
            1000
        ).toFixed(0)
        +
        ' W';
    }


    return (
        number.toFixed(2)
        +
        ' kW'
    );
}


/* =========================================================
   ENERGIEFLÜSSE
   ========================================================= */

function renderFlows(
    data
)
{
    const pv =
        Number(
            data.pv || 0
        );


    const load =
        Number(
            data.house || 0
        );


    const gridImport =
        Number(
            data.gridImport || 0
        );


    const gridExport =
        Number(
            data.gridExport || 0
        );


    const batteryCharge =
        Number(
            data.batteryCharge || 0
        );


    const batteryDischarge =
        Number(
            data.batteryDischarge || 0
        );


    clearGroup(
        'pvDots'
    );

    clearGroup(
        'gridDots'
    );

    clearGroup(
        'loadDots'
    );

    clearGroup(
        'batteryDots'
    );


    /*
     * PV -> Haus
     */

    if (
        pv > 0.03
    ) {

        const duration =
            flowDuration(
                pv
            );


        for (
            let i = 0;
            i < 4;
            i++
        ) {

            makeDot(

                'pvDots',

                'pathPvToHouse',

                'var(--pv)',

                -i
                *
                duration
                /
                4,

                duration

            );
        }
    }


    /*
     * Netz
     */

    if (
        gridImport > 0.03
    ) {

        const duration =
            flowDuration(
                gridImport
            );


        for (
            let i = 0;
            i < 3;
            i++
        ) {

            makeDot(

                'gridDots',

                'pathGridToHouse',

                'var(--grid)',

                -i
                *
                duration
                /
                3,

                duration

            );
        }

    } else if (
        gridExport > 0.03
    ) {

        const duration =
            flowDuration(
                gridExport
            );


        for (
            let i = 0;
            i < 3;
            i++
        ) {

            makeDot(

                'gridDots',

                'pathHouseToGrid',

                'var(--pv)',

                -i
                *
                duration
                /
                3,

                duration

            );
        }
    }


    /*
     * Batterie
     */

    if (
        batteryDischarge > 0.03
    ) {

        const duration =
            flowDuration(
                batteryDischarge
            );


        for (
            let i = 0;
            i < 3;
            i++
        ) {

            makeDot(

                'batteryDots',

                'pathBatteryToHouse',

                'var(--battery)',

                -i
                *
                duration
                /
                3,

                duration

            );
        }

    } else if (
        batteryCharge > 0.03
    ) {

        const duration =
            flowDuration(
                batteryCharge
            );


        /*
         * Batterie-Ladung kann aus PV
         * und ggf. Netz bestehen.
         */

        const mix =
            allocateDots(

                {
                    pv:
                        pv,

                    grid:
                        gridImport
                },

                4
            );


        mix.forEach(
            (
                source,
                index
            ) => {

                let color =
                    'var(--pv)';


                if (
                    source ===
                    'grid'
                ) {

                    color =
                        'var(--grid)';
                }


                makeDot(

                    'batteryDots',

                    'pathHouseToBattery',

                    color,

                    -index
                    *
                    duration
                    /
                    mix.length,

                    duration

                );
            }
        );
    }


    /*
     * Verbraucher
     *
     * Quelle proportional darstellen.
     */

    if (
        load > 0.03
    ) {

        const duration =
            flowDuration(
                load
            );


        const mix =
            allocateDots(

                {
                    pv:
                        pv,

                    grid:
                        gridImport,

                    battery:
                        batteryDischarge
                },

                6
            );


        mix.forEach(
            (
                source,
                index
            ) => {

                let color =
                    'var(--pv)';


                if (
                    source ===
                    'grid'
                ) {

                    color =
                        'var(--grid)';
                }


                if (
                    source ===
                    'battery'
                ) {

                    color =
                        'var(--battery)';
                }


                makeDot(

                    'loadDots',

                    'pathHouseToLoad',

                    color,

                    -index
                    *
                    duration
                    /
                    mix.length,

                    duration

                );
            }
        );
    }
}


/* =========================================================
   LIVE-DATEN
   ========================================================= */

function handleMessage(
    data
)
{
    if (
        !data
    ) {
        return;
    }


    if (
        typeof data ===
        'string'
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (
            error
        ) {

            return;
        }
    }


    lastPayload =
        data;


    const pv =
        Number(
            data.pv || 0
        );


    const load =
        Number(
            data.house || 0
        );


    const gridImport =
        Number(
            data.gridImport || 0
        );


    const gridExport =
        Number(
            data.gridExport || 0
        );


    const batteryCharge =
        Number(
            data.batteryCharge || 0
        );


    const batteryDischarge =
        Number(
            data.batteryDischarge || 0
        );


    const soc =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    data.soc || 0
                )
            )
        );


    const tempWR =
        Number(
            data.tempWR || 0
        );


    const tempBattery =
        Number(
            data.tempBattery || 0
        );


    const voltage =
        Number(
            data.gridVoltage || 0
        );


    const frequency =
        Number(
            data.gridFrequency || 0
        );


    /*
     * PV
     */

    $('pvValue').textContent =
        powerText(
            pv
        );


    $('pvTemp').textContent =
        `WR ${tempWR.toFixed(1)} °C`;


    /*
     * Netz
     */

    $('gridValue').textContent =
        powerText(

            gridImport > 0.03

            ? gridImport

            : gridExport

        );


    $('gridStatus').textContent =
        `${voltage.toFixed(1)} V · ${frequency.toFixed(1)} Hz`;


    /*
     * Verbrauch
     */

    $('loadValue').textContent =
        powerText(
            load
        );


    /*
     * Batterie
     */

    const batteryPower =
        batteryDischarge > 0.03

        ? batteryDischarge

        : batteryCharge;


    $('batteryValue').textContent =
        powerText(
            batteryPower
        );


    $('batteryInfo').textContent =
        `${soc.toFixed(0)} % · ${tempBattery.toFixed(1)} °C`;


    /*
     * Batterie-Füllstand
     */

    const fillWidth =
        56
        *
        (
            soc
            /
            100
        );


    $('batteryFill').setAttribute(
        'width',
        fillWidth
    );


    /*
     * Wetter
     */

    updateWeather(

        data.weatherConditionID,

        data.weatherIcon,

        Boolean(
            data.rainDetected
        )

    );


    /*
     * Energiepunkte
     */

    renderFlows(
        data
    );
}

        ) {

            requestAction(

            );

    }

);
