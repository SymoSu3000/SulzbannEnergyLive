    --muted: rgba(32, 32, 32, 0.68);
    --line: rgba(110, 110, 110, 0.44);
    --surface: rgba(255,255,255,0.02);
}

@media (prefers-color-scheme: dark) {

        --muted: rgba(244,244,244,0.72);
        --line: rgba(220,220,220,0.48);

}

* {

}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;

}

.house-fill {

        var(--house) 32%,

}

    stroke: var(--text);

}

}

.label {

}

    font-size: 16px;

}

<script>

const SVG_NS =
    'http://www.w3.org/2000/svg';

const $ =
    id =>
        document.getElementById(id);


/* =========================================================
   LEISTUNG -> GESCHWINDIGKEIT
   ========================================================= */

function flowDuration(powerKW)
{
    const power =
        Math.max(
            0,
            Number(powerKW || 0)
        );

    const normalized =
        Math.min(
            power / 6,
            1
        );

    const shaped =
        Math.sqrt(
            normalized
        );

    return (
        6.0
        -
        shaped * 4.1
    );
}


/* =========================================================
   PUNKT ERSTELLEN
   ========================================================= */

function makeDot(
    groupID,
    pathID,
    color,
    delay,
    duration
)
{
    const group =
        $(groupID);

    const circle =
        document.createElementNS(
            SVG_NS,
            'circle'
        );

    circle.setAttribute(
        'r',
        '7'
    );

    circle.setAttribute(
        'fill',
        color
    );

    circle.setAttribute(
        'class',
        'dot'
    );

    circle.style.color =
        color;

    const motion =
        document.createElementNS(
            SVG_NS,
            'animateMotion'
        );

    motion.setAttribute(
        'dur',
        duration + 's'
    );

    motion.setAttribute(
        'begin',
        delay + 's'
    );

    motion.setAttribute(
        'repeatCount',
        'indefinite'
    );

    motion.setAttribute(
        'calcMode',
        'linear'
    );

    const motionPath =
        document.createElementNS(
            SVG_NS,
            'mpath'
        );

    motionPath.setAttribute(
        'href',
        '#' + pathID
    );

    motion.appendChild(
        motionPath
    );

    circle.appendChild(
        motion
    );

    group.appendChild(
        circle
    );
}


/* =========================================================
   GRUPPE LEEREN
   ========================================================= */

function clearGroup(id)
{
    const group =
        $(id);

    while (group.firstChild) {
        group.removeChild(
            group.firstChild
        );
    }
}


/* =========================================================
   PUNKTVERTEILUNG
   ========================================================= */

function allocateDots(
    weights,
    amount = 6
)
{
    const entries =
        Object
        .entries(weights)
        .filter(
            ([, value]) =>
                Number(value) > 0.0001
        );

    if (!entries.length) {
        return [];
    }

    const total =
        entries.reduce(
            (
                sum,
                [, value]
            ) =>
                sum + Number(value),
            0
        );

    const result = [];

    const allocation =
        entries.map(
            ([key, value]) => ({
                key,
                raw:
                    Number(value)
                    /
                    total
                    *
                    amount,
                count: 0
            })
        );

    let assigned = 0;

    allocation.forEach(
        item => {

            item.count =
                Math.floor(
                    item.raw
                );

            assigned +=
                item.count;
        }
    );

    while (assigned < amount) {

        allocation.sort(
            (
                a,
                b
            ) =>
                (
                    b.raw - b.count
                )
                -
                (
                    a.raw - a.count
                )
        );

        allocation[0].count++;

        assigned++;
    }

    let remaining = amount;

    while (remaining > 0) {

        for (
            const item
            of allocation
        ) {

            if (item.count > 0) {

                result.push(
                    item.key
                );

                item.count--;

                remaining--;
            }
        }
    }

    return result;
}


/* =========================================================
   WETTER
   ========================================================= */

const weatherIDs = [
    'weatherSun',
    'weatherPartlyCloudy',
    'weatherCloud',
    'weatherRain',
    'weatherStorm',
    'weatherSnow',
    'weatherFog',
    'weatherMoon'
];


function showWeatherIcon(id)
{
    weatherIDs.forEach(
        item => {

            $(item).setAttribute(
                'display',
                item === id
                ? ''
                : 'none'
            );
        }
    );
}


function updateWeather(
    conditionID,
    weatherIcon,
    rainDetected
)
{
    if (rainDetected) {

        showWeatherIcon(
            'weatherRain'
        );

        return;
    }


    const condition =
        Number(
            conditionID || 0
        );


    const icon =
        String(
            weatherIcon || ''
        );


    const night =
        icon.endsWith('n');


    if (
        condition >= 200
        &&
        condition < 300
    ) {

        showWeatherIcon(
            'weatherStorm'
        );

        return;
    }


    if (
        (
            condition >= 300
            &&
            condition < 400
        )
        ||
        (
            condition >= 500
            &&
            condition < 600
        )
    ) {

        showWeatherIcon(
            'weatherRain'
        );

        return;
    }


    if (
        condition >= 600
        &&
        condition < 700
    ) {

        showWeatherIcon(
            'weatherSnow'
        );

        return;
    }


    if (
        condition >= 700
        &&
        condition < 800
    ) {

        showWeatherIcon(
            'weatherFog'
        );

        return;
    }


    if (
        condition === 800
    ) {

        showWeatherIcon(
            night
            ? 'weatherMoon'
            : 'weatherSun'
        );

        return;
    }


    if (
        condition === 801
        ||
        condition === 802
    ) {

        showWeatherIcon(
            night
            ? 'weatherCloud'
            : 'weatherPartlyCloudy'
        );

        return;
    }


    if (
        condition === 803
        ||
        condition === 804
    ) {

        showWeatherIcon(
            'weatherCloud'
        );

        return;
    }


    showWeatherIcon(
        night
        ? 'weatherMoon'
        : 'weatherCloud'
    );
}


/* =========================================================
   LEISTUNGSFORMAT
   ========================================================= */

function powerText(value)
{
    const number =
        Math.max(
            0,
            Number(value || 0)
        );

    if (number < 1) {

        return (
            number * 1000
        ).toFixed(0)
        +
        ' W';
    }

    return (
        number.toFixed(2)
        +
        ' kW'
    );
}


/* =========================================================
   FLOWS
   ========================================================= */

function renderFlows(data)
{
    const pv =
        Number(data.pv || 0);

    const load =
        Number(data.house || 0);

    const gridImport =
        Number(data.gridImport || 0);

    const gridExport =
        Number(data.gridExport || 0);

    const batteryCharge =
        Number(data.batteryCharge || 0);

    const batteryDischarge =
        Number(data.batteryDischarge || 0);


    clearGroup('pvDots');
    clearGroup('gridDots');
    clearGroup('loadDots');
    clearGroup('batteryDots');


    if (pv > 0.03) {

        const duration =
            flowDuration(pv);

        for (let i = 0; i < 4; i++) {

            makeDot(
                'pvDots',
                'pathPvToHouse',
                'var(--pv)',
                -i * duration / 4,
                duration
            );
        }
    }


    if (gridImport > 0.03) {

        const duration =
            flowDuration(gridImport);

        for (let i = 0; i < 3; i++) {

            makeDot(
                'gridDots',
                'pathGridToHouse',
                'var(--grid)',
                -i * duration / 3,
                duration
            );
        }

    } else if (gridExport > 0.03) {

        const duration =
            flowDuration(gridExport);

        for (let i = 0; i < 3; i++) {

            makeDot(
                'gridDots',
                'pathHouseToGrid',
                'var(--pv)',
                -i * duration / 3,
                duration
            );
        }
    }


    if (batteryDischarge > 0.03) {

        const duration =
            flowDuration(
                batteryDischarge
            );

        for (let i = 0; i < 3; i++) {

            makeDot(
                'batteryDots',
                'pathBatteryToHouse',
                'var(--battery)',
                -i * duration / 3,
                duration
            );
        }

    } else if (batteryCharge > 0.03) {

        const duration =
            flowDuration(
                batteryCharge
            );

        const mix =
            allocateDots(
                {
                    pv,
                    grid:
                        gridImport
                },
                4
            );

        mix.forEach(
            (
                source,
                index
            ) => {

                const color =
                    source === 'grid'
                    ? 'var(--grid)'
                    : 'var(--pv)';

                makeDot(
                    'batteryDots',
                    'pathHouseToBattery',
                    color,
                    -index
                    *
                    duration
                    /
                    mix.length,
                    duration
                );
            }
        );
    }


    if (load > 0.03) {

        const duration =
            flowDuration(load);

        const mix =
            allocateDots(
                {
                    pv,
                    grid:
                        gridImport,
                    battery:
                        batteryDischarge
                },
                6
            );

        mix.forEach(
            (
                source,
                index
            ) => {

                let color =
                    'var(--pv)';

                if (source === 'grid') {
                    color =
                        'var(--grid)';
                }

                if (source === 'battery') {
                    color =
                        'var(--battery)';
                }

                makeDot(
                    'loadDots',
                    'pathHouseToLoad',
                    color,
                    -index
                    *
                    duration
                    /
                    mix.length,
                    duration
                );
            }
        );
    }
}


/* =========================================================
   LIVE-DATEN
   ========================================================= */

function handleMessage(data)
{
    if (!data) {
        return;
    }

    if (typeof data === 'string') {

        try {

            data =
                JSON.parse(data);

        } catch (error) {

            return;
        }
    }


    const pv =
        Number(data.pv || 0);

    const load =
        Number(data.house || 0);

    const gridImport =
        Number(data.gridImport || 0);

    const gridExport =
        Number(data.gridExport || 0);

    const batteryCharge =
        Number(data.batteryCharge || 0);

    const batteryDischarge =
        Number(data.batteryDischarge || 0);

    const soc =
        Math.max(
            0,
            Math.min(
                100,
                Number(data.soc || 0)
            )
        );

    const tempWR =
        Number(
            data.tempWR || 0
        );

    const tempBattery =
        Number(
            data.tempBattery || 0
        );

    const voltage =
        Number(
            data.gridVoltage || 0
        );

    const frequency =
        Number(
            data.gridFrequency || 0
        );


    $('pvValue').textContent =
        powerText(pv);

    $('pvTemp').textContent =
        `WR ${tempWR.toFixed(1)} °C`;


    $('gridValue').textContent =
        powerText(
            gridImport > 0.03
            ? gridImport
            : gridExport
        );

    $('gridStatus').textContent =
        `${voltage.toFixed(1)} V · ${frequency.toFixed(1)} Hz`;


    $('loadValue').textContent =
        powerText(load);


    const batteryPower =
        batteryDischarge > 0.03
        ? batteryDischarge
        : batteryCharge;

    $('batteryValue').textContent =
        powerText(
            batteryPower
        );

    $('batteryInfo').textContent =
        `${soc.toFixed(0)} % · ${tempBattery.toFixed(1)} °C`;


    const fillWidth =
        48
        *
        soc
        /
        100;

    $('batteryFill').setAttribute(
        'width',
        fillWidth
    );


    updateWeather(
        data.weatherConditionID,
        data.weatherIcon,
        Boolean(
            data.rainDetected
        )
    );


    renderFlows(data);
}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
    'load',
    () => {

        if (
            typeof requestAction
            ===
            'function'
        ) {

            requestAction(
                'Refresh',
                true
            );
        }
    }
);

</script>

</body>
</html>
