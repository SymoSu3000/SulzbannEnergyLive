<style>

:root {
    --pv: #35b657;

    --house: #10c7b1;

    --text: #202020;

    --muted:

            32,
            32,
            32,
            0.74
        );

    --line:
        rgba(
            110,
            110,
            110,
            0.44
        );

    --surface:
        rgba(
            255,
            255,
            255,
            0.02
        );
}


@media (
    prefers-color-scheme: dark
) {

    :root {
        --text: #f4f4f4;

        --muted:
            rgba(
                244,
                244,
                244,
                0.82

        --line:

            );

        --surface:
            rgba(
                255,
                255,
                255,
                0.025
            );
    }
}


* {
    box-sizing: border-box;
}


html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    color:
        var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


#wrap {
    width: 100%;
    height: 100%;

    overflow: hidden;
}


#energySvg {
    display: block;

    width: 100%;
    height: 100%;
}


.flow-line {
    stroke:
        var(--line);

    stroke-width:
        4;

    stroke-linecap:
        round;

    fill:
        none;
}


.node-ring {
    fill:
        var(--surface);

    stroke-width:
        4;
}


.house-fill {
    fill:
        color-mix(
            in srgb,
            var(--house) 32%,
            transparent
        );

    stroke:
        var(--house);

    stroke-width:
        5;
}


.node-icon {
    fill:
        none;

    stroke:
        var(--text);

    stroke-width:
        4;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;
}


/*
 * Große Leistungswerte
 */
.value {
    fill:
        var(--text);

    font-size:
        31px;

    font-weight:
        700;
}


/*
 * PV-Anlage / Stromnetz /
 * Verbrauch / Batterie
 *
 * bewusst nochmals größer
 */
.label {
    fill:
        var(--muted);

    font-size:
        25px;

    font-weight:
        500;
}


/*
 * Temperaturen / Spannung /
 * Frequenz / SOC
 */
.sub {
    fill:
        var(--muted);

    font-size:
        21px;

    font-weight:
        500;
}


.dot {
    filter:
        drop-shadow(
            0 0 5px
            currentColor
        );
}

</style>

<script>


const SVG_NS =
    'http://www.w3.org/2000/svg';


const $ =
    id =>
        document.getElementById(
            id
        );


/* =========================================================
   PUNKTANZAHL NACH LEISTUNG
   ========================================================= */

function flowDotCount(
    powerKW
)
{
    const power =
        Math.max(
            0,
            Number(
                powerKW || 0
            )
        );


    if (power < 0.03) {
        return 0;
    }


    if (power < 0.15) {
        return 1;
    }


    if (power < 0.75) {
        return 2;
    }


    if (power < 1.50) {
        return 3;
    }


    if (power < 3.00) {
        return 4;
    }


    if (power < 5.00) {
        return 5;
    }


    return 6;
}


/* =========================================================
   GESCHWINDIGKEIT NACH LEISTUNG
   ========================================================= */

function flowDuration(
    powerKW
)
{
    const power =
        Math.max(
            0,
            Number(
                powerKW || 0
            )
        );


    const normalized =
        Math.min(
            power / 6,
            1
        );


    const shaped =
        Math.sqrt(
            normalized
        );


    return (
        6.0
        -
        shaped
        *
        4.1
    );
}


/* =========================================================
   ANIMIERTER PUNKT
   ========================================================= */

function makeDot(
    groupID,
    pathID,
    color,
    delay,
    duration
)
{
    const group =
        $(groupID);


    const circle =
        document.createElementNS(
            SVG_NS,
            'circle'
        );


    circle.setAttribute(
        'r',
        '7'
    );


    circle.setAttribute(
        'fill',
        color
    );


    circle.setAttribute(
        'class',
        'dot'
    );


    circle.style.color =
        color;


    const motion =
        document.createElementNS(
            SVG_NS,
            'animateMotion'
        );


    motion.setAttribute(
        'dur',
        duration + 's'
    );


    motion.setAttribute(
        'begin',
        delay + 's'
    );


    motion.setAttribute(
        'repeatCount',
        'indefinite'
    );


    motion.setAttribute(
        'calcMode',
        'linear'
    );


    const motionPath =
        document.createElementNS(
            SVG_NS,
            'mpath'
        );


    motionPath.setAttribute(
        'href',
        '#' + pathID
    );


    motion.appendChild(
        motionPath
    );


    circle.appendChild(
        motion
    );


    group.appendChild(
        circle
    );
}


/* =========================================================
   GRUPPE LEEREN
   ========================================================= */

function clearGroup(
    id
)
{
    const group =
        $(id);


    while (
        group.firstChild
    ) {

        group.removeChild(
            group.firstChild
        );
    }
}


/* =========================================================
   NORMALER FLUSS
   ========================================================= */

function createFlowDots(
    groupID,
    pathID,
    color,
    powerKW
)
{
    const count =
        flowDotCount(
            powerKW
        );


    if (
        count <= 0
    ) {
        return;
    }


    const duration =
        flowDuration(
            powerKW
        );


    for (
        let index = 0;
        index < count;
        index++
    ) {

        const delay =
            -duration
            *
            index
            /
            count;


        makeDot(
            groupID,
            pathID,
            color,
            delay,
            duration
        );
    }
}


/* =========================================================
   QUELLEN AUF PUNKTE VERTEILEN
   ========================================================= */

function allocateDots(
    weights,
    amount
)
{
    if (
        amount <= 0
    ) {
        return [];
    }


    const entries =
        Object
        .entries(
            weights
        )
        .map(
            (
                [key, value]
            ) => ({
                key,

                value:
                    Math.max(
                        0,
                        Number(
                            value || 0
                        )
                    )
            })
        )
        .filter(
            item =>
                item.value
                >
                0.0001
        );


    if (
        !entries.length
    ) {
        return [];
    }


    const total =
        entries.reduce(
            (
                sum,
                item
            ) =>
                sum
                +
                item.value,
            0
        );


    const allocation =
        entries.map(
            item => {

                const raw =
                    item.value
                    /
                    total
                    *
                    amount;


                return {

                    key:
                        item.key,

                    raw:
                        raw,

                    count:
                        Math.floor(
                            raw
                        )
                };
            }
        );


    let assigned =
        allocation.reduce(
            (
                sum,
                item
            ) =>
                sum
                +
                item.count,
            0
        );


    while (
        assigned < amount
    ) {

        let bestIndex =
            0;


        let bestFraction =
            -1;


        allocation.forEach(
            (
                item,
                index
            ) => {

                const fraction =
                    item.raw
                    -
                    item.count;


                if (
                    fraction >
                    bestFraction
                ) {

                    bestFraction =
                        fraction;


                    bestIndex =
                        index;
                }
            }
        );


        allocation[
            bestIndex
        ].count++;


        assigned++;
    }


    const result = [];


    let remaining =
        amount;


    while (
        remaining > 0
    ) {

        for (
            const item
            of allocation
        ) {

            if (
                item.count > 0
            ) {

                result.push(
                    item.key
                );


                item.count--;


                remaining--;


                if (
                    remaining <= 0
                ) {
                    break;
                }
            }
        }
    }


    return result;
}


/* =========================================================
   GEMISCHTER FLUSS
   ========================================================= */

function createMixedFlow(
    groupID,
    pathID,
    totalPowerKW,
    sourceWeights
)
{
    const count =
        flowDotCount(
            totalPowerKW
        );


    if (
        count <= 0
    ) {
        return;
    }


    const duration =
        flowDuration(
            totalPowerKW
        );


    const mix =
        allocateDots(
            sourceWeights,
            count
        );


    if (
        !mix.length
    ) {
        return;
    }


    mix.forEach(
        (
            source,
            index
        ) => {

            let color =
                'var(--pv)';


            if (
                source ===
                'grid'
            ) {

                color =
                    'var(--grid)';
            }


            if (
                source ===
                'battery'
            ) {

                color =
                    'var(--battery)';
            }


            const delay =
                -duration
                *
                index
                /
                mix.length;


            makeDot(
                groupID,
                pathID,
                color,
                delay,
                duration
            );
        }
    );
}


/* =========================================================
   WETTER
   ========================================================= */

const weatherIDs = [
    'weatherSun',
    'weatherPartlyCloudy',
    'weatherCloud',
    'weatherRain',
    'weatherStorm',
    'weatherSnow',
    'weatherFog',
    'weatherMoon'
];


function showWeatherIcon(
    id
)
{
    weatherIDs.forEach(
        item => {

            const element =
                $(item);


            if (!element) {
                return;
            }


            element.setAttribute(
                'display',

                item === id

                ? ''

                : 'none'
            );
        }
    );
}


/* =========================================================
   WETTERLOGIK
   ========================================================= */

function updateWeather(
    conditionID,
    weatherIcon,
    rainDetected
)
{
    if (
        rainDetected
    ) {

        showWeatherIcon(
            'weatherRain'
        );

        return;
    }


    const condition =
        Number(
            conditionID || 0
        );


    const icon =
        String(
            weatherIcon || ''
        );


    const night =
        icon.endsWith(
            'n'
        );


    if (
        condition >= 200
        &&
        condition < 300
    ) {

        showWeatherIcon(
            'weatherStorm'
        );

        return;
    }


    if (
        (
            condition >= 300
            &&
            condition < 400
        )
        ||
        (
            condition >= 500
            &&
            condition < 600
        )
    ) {

        showWeatherIcon(
            'weatherRain'
        );

        return;
    }


    if (
        condition >= 600
        &&
        condition < 700
    ) {

        showWeatherIcon(
            'weatherSnow'
        );

        return;
    }


    if (
        condition >= 700
        &&
        condition < 800
    ) {

        showWeatherIcon(
            'weatherFog'
        );

        return;
    }


    if (
        condition === 800
    ) {

        showWeatherIcon(

            night

            ? 'weatherMoon'

            : 'weatherSun'

        );

        return;
    }


    if (
        condition === 801
        ||
        condition === 802
    ) {

        showWeatherIcon(

            night

            ? 'weatherCloud'

            : 'weatherPartlyCloudy'

        );

        return;
    }


    if (
        condition === 803
        ||
        condition === 804
    ) {

        showWeatherIcon(
            'weatherCloud'
        );

        return;
    }


    showWeatherIcon(

        night

        ? 'weatherMoon'

        : 'weatherCloud'

    );
}


/* =========================================================
   LEISTUNG FORMATIEREN
   ========================================================= */

function powerText(
    value
)
{
    const number =
        Math.max(
            0,
            Number(
                value || 0
            )
        );


    if (
        number < 1
    ) {

        return (
            number
            *
            1000
        ).toFixed(0)
        +
        ' W';
    }


    return (
        number.toFixed(2)
        +
        ' kW'
    );
}


/* =========================================================
   ENERGIEFLÜSSE
   ========================================================= */

function renderFlows(
    data
)
{
    const pv =
        Number(
            data.pv || 0
        );


    const load =
        Number(
            data.house || 0
        );


    const gridImport =
        Number(
            data.gridImport || 0
        );


    const gridExport =
        Number(
            data.gridExport || 0
        );


    const batteryCharge =
        Number(
            data.batteryCharge || 0
        );


    const batteryDischarge =
        Number(
            data.batteryDischarge || 0
        );


    clearGroup(
        'pvDots'
    );


    clearGroup(
        'gridDots'
    );


    clearGroup(
        'loadDots'
    );


    clearGroup(
        'batteryDots'
    );


    /*
     * PV
     */

    createFlowDots(

        'pvDots',

        'pathPvToHouse',

        'var(--pv)',

        pv

    );


    /*
     * Netz
     */

    if (
        gridImport > 0.03
    ) {

        createFlowDots(

            'gridDots',

            'pathGridToHouse',

            'var(--grid)',

            gridImport

        );

    } else if (
        gridExport > 0.03
    ) {

        createFlowDots(

            'gridDots',

            'pathHouseToGrid',

            'var(--pv)',

            gridExport

        );
    }


    /*
     * Batterie
     */

    if (
        batteryDischarge > 0.03
    ) {

        createFlowDots(

            'batteryDots',

            'pathBatteryToHouse',

            'var(--battery)',

            batteryDischarge

        );

    } else if (
        batteryCharge > 0.03
    ) {

        createMixedFlow(

            'batteryDots',

            'pathHouseToBattery',

            batteryCharge,

            {
                pv:
                    pv,

                grid:
                    gridImport
            }

        );
    }


    /*
     * Verbrauch
     */

    if (
        load > 0.03
    ) {

        createMixedFlow(

            'loadDots',

            'pathHouseToLoad',

            load,

            {
                pv:
                    pv,

                grid:
                    gridImport,

                battery:
                    batteryDischarge
            }

        );
    }
}


/* =========================================================
   LIVE-WERTE
   ========================================================= */

function handleMessage(
    data
)
{
    if (
        !data
    ) {
        return;
    }


    if (
        typeof data ===
        'string'
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (
            error
        ) {

            return;
        }
    }


    const pv =
        Number(
            data.pv || 0
        );


    const load =
        Number(
            data.house || 0
        );


    const gridImport =
        Number(
            data.gridImport || 0
        );


    const gridExport =
        Number(
            data.gridExport || 0
        );


    const batteryCharge =
        Number(
            data.batteryCharge || 0
        );


    const batteryDischarge =
        Number(
            data.batteryDischarge || 0
        );


    const soc =
        Math.max(
            0,
            Math.min(
                100,
                Number(
                    data.soc || 0
                )
            )
        );


    const tempWR =
        Number(
            data.tempWR || 0
        );


    const tempBattery =
        Number(
            data.tempBattery || 0
        );


    const voltage =
        Number(
            data.gridVoltage || 0
        );


    const frequency =
        Number(
            data.gridFrequency || 0
        );


    /*
     * PV
     */

    $('pvValue').textContent =
        powerText(
            pv
        );


    $('pvTemp').textContent =
        `WR ${tempWR.toFixed(1)} °C`;


    /*
     * Netz
     */

    $('gridValue').textContent =
        powerText(

            gridImport > 0.03

            ? gridImport

            : gridExport

        );


    $('gridStatus').textContent =
        `${voltage.toFixed(1)} V · ${frequency.toFixed(1)} Hz`;


    /*
     * Verbrauch
     */

    $('loadValue').textContent =
        powerText(
            load
        );


    /*
     * Batterie
     */

    const batteryPower =
        batteryDischarge > 0.03

        ? batteryDischarge

        : batteryCharge;


    $('batteryValue').textContent =
        powerText(
            batteryPower
        );


    $('batteryInfo').textContent =
        `${soc.toFixed(0)} % · ${tempBattery.toFixed(1)} °C`;


    /*
     * SOC-Füllung
     */

    const fillWidth =
        48
        *
        soc
        /
        100;


    $('batteryFill').setAttribute(
        'width',
        fillWidth
    );


    /*
     * Wetter
     */

    updateWeather(

        data.weatherConditionID,

        data.weatherIcon,

        Boolean(
            data.rainDetected
        )

    );


    /*
     * Energieflüsse
     */

    renderFlows(
        data
    );
}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
    'load',
    () => {

        if (
            typeof requestAction
            ===
            'function'
        ) {

            requestAction(
                'Refresh',
                true
            );
        }
    }
);

</script>
