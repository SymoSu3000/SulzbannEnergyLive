<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">

<style>

    :root {
        color-scheme: light dark;

        --text: currentColor;
        --muted: rgba(128,128,128,.90);

        --line: rgba(128,128,128,.46);

        --pv: #42cf63;
        --grid: #f5aa2a;
        --consumer: #ff596d;
        --battery: #36a7ff;
        --house: #16c4c9;
    }


    * {
        box-sizing: border-box;
    }


    html,
    body {
        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        background: transparent;

        overflow: hidden;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Arial,
            sans-serif;

        color: inherit;
    }


    body {
        display: flex;
        align-items: center;
        justify-content: center;
    }


    #energyWrap {
        position: relative;

        width: 100%;
        height: 100%;

        color: inherit;
    }


    svg {
        display: block;

        width: 100%;
        height: 100%;

        color: inherit;
    }


    .base-line {
        fill: none;
        stroke: var(--line);
        stroke-width: 2.4;
        stroke-linecap: round;
    }


    .node-circle {
        fill: rgba(128,128,128,.035);
        stroke-width: 3;
    }


    .pv-circle {
        stroke: var(--pv);
    }

    .grid-circle {
        stroke: var(--grid);
    }

    .consumer-circle {
        stroke: var(--consumer);
    }

    .battery-circle {
        stroke: var(--battery);
    }

    .house-circle {
        stroke: var(--house);
    }


    .node-title {
        font-size: 26px;
        font-weight: 650;

        fill: currentColor;
    }


    .node-value {
        font-size: 35px;
        font-weight: 760;
    }


    .node-sub {
        font-size: 20px;

        fill: currentColor;

        opacity: .67;
    }


    .node-sub-small {
        font-size: 17px;

        fill: currentColor;

        opacity: .62;
    }


    .pv-text {
        fill: var(--pv);
    }


    .grid-text {
        fill: var(--grid);
    }


    .consumer-text {
        fill: var(--consumer);
    }


    .battery-text {
        fill: var(--battery);
    }


    .icon-line {
        fill: none;

        stroke: currentColor;

        stroke-width: 5;

        stroke-linecap: round;
        stroke-linejoin: round;

        opacity: .92;
    }


    .flow-dot {
        r: 6;

        pointer-events: none;
    }


    .flow-dot.pv {
        fill: var(--pv);
    }


    .flow-dot.grid {
        fill: var(--grid);
    }


    .flow-dot.consumer {
        fill: var(--consumer);
    }


    .flow-dot.battery {
        fill: var(--battery);
    }


    .battery-fill-bg {
        fill: rgba(128,128,128,.18);
    }


    .battery-fill {
        fill: var(--battery);
    }


    .weather-main {
        font-size: 36px;
        text-anchor: middle;

        dominant-baseline: middle;
    }


    .weather-text {
        font-size: 18px;

        fill: currentColor;

        opacity: .72;
    }


    @media (prefers-color-scheme: dark) {

        :root {
            --line: rgba(220,228,238,.45);
        }

    }


    @media (prefers-reduced-motion: reduce) {

        .flow-dot {
            display: none;
        }

    }

</style>

</head>

<script>

'use strict';


// ============================================================================
// Zustand
// ============================================================================

const state = {

    initialized: false,

    values: {
        pv: 0,

        gridImport: 0,
        gridExport: 0,
        gridState: 'idle',

        batteryCharge: 0,
        batteryDischarge: 0,
        batteryState: 'idle',

        house: 0,

        soc: 0,
        tempWR: 0,
        tempBattery: 0,

        voltage: 0,
        frequency: 0,

        weatherID: 0,
        weatherIcon: '',
        clouds: 0,
        rain: false
    }
};


// ============================================================================
// Flüsse
// ============================================================================

const flows = {

    pv: {
        path: null,
        dots: [],
        phase: 0,
        power: 0,
        direction: 1
    },

    grid: {
        path: null,
        dots: [],
        phase: 0,
        power: 0,
        direction: 1
    },

    consumer: {
        path: null,
        dots: [],
        phase: 0,
        power: 0,
        direction: 1
    },

    battery: {
        path: null,
        dots: [],
        phase: 0,
        power: 0,
        direction: 1
    }
};


const MAX_DOTS = 6;

let lastFrameTime = performance.now();


// ============================================================================
// Initialisierung
// ============================================================================

function init()
{
    flows.pv.path =
        document.getElementById(
            'pathPV'
        );

    flows.grid.path =
        document.getElementById(
            'pathGrid'
        );

    flows.consumer.path =
        document.getElementById(
            'pathConsumer'
        );

    flows.battery.path =
        document.getElementById(
            'pathBattery'
        );


    createDotPool(
        'pv',
        'pvDots'
    );

    createDotPool(
        'grid',
        'gridDots'
    );

    createDotPool(
        'consumer',
        'consumerDots'
    );

    createDotPool(
        'battery',
        'batteryDots'
    );


    state.initialized = true;


    // Initialwerte anfordern
    try {

        requestAction(
            'Refresh',
            true
        );

    } catch (e) {

        // In normalem Browser-Test ohne Symcon ignorieren
    }


    requestAnimationFrame(
        animate
    );
}


// ============================================================================
// Punkt-Pool
// ============================================================================

function createDotPool(
    flowName,
    containerID
)
{
    const ns =
        'http://www.w3.org/2000/svg';

    const container =
        document.getElementById(
            containerID
        );


    for (
        let i = 0;
        i < MAX_DOTS;
        i++
    ) {

        const dot =
            document.createElementNS(
                ns,
                'circle'
            );

        dot.setAttribute(
            'class',
            'flow-dot ' + flowName
        );

        dot.style.display =
            'none';

        container.appendChild(
            dot
        );

        flows[flowName].dots.push(
            dot
        );
    }
}


// ============================================================================
// Live Nachricht aus IP-Symcon
// ============================================================================

function handleMessage(message)
{
    let data =
        message;


    if (
        typeof message === 'string'
    ) {

        try {

            data =
                JSON.parse(
                    message
                );

        } catch (e) {

            return;
        }
    }


    if (
        !data
        ||
        data.type !== 'energy'
    ) {
        return;
    }


    Object.assign(
        state.values,
        data
    );


    updateTexts();

    updateFlowTargets();
}


// ============================================================================
// Werte / Texte
// ============================================================================

function updateTexts()
{
    const v =
        state.values;


    setText(
        'pvValue',
        formatPower(
            v.pv
        )
    );


    setText(
        'pvTemp',
        Number.isFinite(v.tempWR)
            ? '(' + v.tempWR.toFixed(1) + ' °C)'
            : '-'
    );


    const weather =
        getWeather(
            v.weatherID,
            v.weatherIcon,
            v.rain,
            v.clouds
        );


    setText(
        'weatherSymbol',
        weather.symbol
    );


    setText(
        'weatherText',
        weather.text
    );


    const gridPower =
        v.gridState === 'export'
            ? v.gridExport
            : v.gridImport;


    setText(
        'gridValue',
        formatPower(
            gridPower
        )
    );


    let gridMode =
        'Ruhe';


    if (
        v.gridState === 'import'
    ) {

        gridMode =
            'Netzbezug';

    } else if (
        v.gridState === 'export'
    ) {

        gridMode =
            'Einspeisung';
    }


    setText(
        'gridMode',
        gridMode
    );


    setText(
        'gridInfo',
        formatGridInfo(
            v.voltage,
            v.frequency
        )
    );


    setText(
        'consumerValue',
        formatPower(
            v.house
        )
    );


    let batteryPower =
        0;


    if (
        v.batteryState === 'charge'
    ) {

        batteryPower =
            v.batteryCharge;

    } else if (
        v.batteryState === 'discharge'
    ) {

        batteryPower =
            v.batteryDischarge;
    }


    setText(
        'batteryPower',
        formatPower(
            batteryPower
        )
    );


    let batteryMode =
        'Ruhe';


    if (
        v.batteryState === 'charge'
    ) {

        batteryMode =
            'Laden';

    } else if (
        v.batteryState === 'discharge'
    ) {

        batteryMode =
            'Entladen';
    }


    setText(
        'batteryMode',
        batteryMode
    );


    setText(
        'batteryInfo',
        'SOC: '
        +
        Math.round(v.soc)
        +
        ' %'
        +
        (
            Number.isFinite(v.tempBattery)
                ?
                ' · '
                +
                v.tempBattery.toFixed(1)
                +
                ' °C'
                :
                ''
        )
    );


    const fill =
        document.getElementById(
            'batteryFill'
        );


    const soc =
        Math.max(
            0,
            Math.min(
                100,
                Number(v.soc) || 0
            )
        );


    fill.setAttribute(
        'width',
        String(
            48
            *
            soc
            /
            100
        )
    );
}


// ============================================================================
// Zielwerte der Flüsse
// ============================================================================

function updateFlowTargets()
{
    const v =
        state.values;


    // PV -> Haus
    flows.pv.power =
        Math.abs(
            Number(v.pv) || 0
        );

    flows.pv.direction =
        1;


    // Netz:
    //
    // Pfad ist Netz -> Haus definiert.
    //
    // Import = vorwärts
    // Export = rückwärts
    //
    if (
        v.gridState === 'import'
    ) {

        flows.grid.power =
            Math.abs(
                Number(v.gridImport) || 0
            );

        flows.grid.direction =
            1;

    } else if (
        v.gridState === 'export'
    ) {

        flows.grid.power =
            Math.abs(
                Number(v.gridExport) || 0
            );

        flows.grid.direction =
            -1;

    } else {

        flows.grid.power =
            0;
    }


    // Haus -> Verbrauch
    flows.consumer.power =
        Math.abs(
            Number(v.house) || 0
        );

    flows.consumer.direction =
        1;


    // Batterie:
    //
    // Pfad ist Haus -> Batterie definiert.
    //
    // Laden = vorwärts
    // Entladen = rückwärts
    //
    if (
        v.batteryState === 'charge'
    ) {

        flows.battery.power =
            Math.abs(
                Number(v.batteryCharge) || 0
            );

        flows.battery.direction =
            1;

    } else if (
        v.batteryState === 'discharge'
    ) {

        flows.battery.power =
            Math.abs(
                Number(v.batteryDischarge) || 0
            );

        flows.battery.direction =
            -1;

    } else {

        flows.battery.power =
            0;
    }
}


// ============================================================================
// Permanente Animation
// ============================================================================

function animate(now)
{
    let delta =
        (
            now
            -
            lastFrameTime
        )
        /
        1000;


    lastFrameTime =
        now;


    // Nach Tab-Wechsel keinen riesigen Sprung
    delta =
        Math.min(
            delta,
            0.1
        );


    animateFlow(
        flows.pv,
        delta
    );


    animateFlow(
        flows.grid,
        delta
    );


    animateFlow(
        flows.consumer,
        delta
    );


    animateFlow(
        flows.battery,
        delta
    );


    requestAnimationFrame(
        animate
    );
}


// ============================================================================
// Einzelner Energiefluss
// ============================================================================

function animateFlow(
    flow,
    delta
)
{
    if (
        !flow.path
    ) {
        return;
    }


    const power =
        Math.abs(
            flow.power
        );


    const dotCount =
        getDotCount(
            power
        );


    if (
        dotCount === 0
    ) {

        for (
            const dot
            of
            flow.dots
        ) {

            dot.style.display =
                'none';
        }

        return;
    }


    const secondsPerPath =
        getSecondsPerPath(
            power
        );


    // Phase bleibt dauerhaft bestehen.
    //
    // Neue Messwerte ändern nur die Geschwindigkeit.
    // Es gibt KEINEN Neustart.
    //
    flow.phase +=
        (
            delta
            /
            secondsPerPath
        )
        *
        flow.direction;


    flow.phase =
        (
            (
                flow.phase
                %
                1
            )
            +
            1
        )
        %
        1;


    const pathLength =
        flow.path.getTotalLength();


    for (
        let i = 0;
        i < flow.dots.length;
        i++
    ) {

        const dot =
            flow.dots[i];


        if (
            i >= dotCount
        ) {

            dot.style.display =
                'none';

            continue;
        }


        dot.style.display =
            '';


        // Punkte gleichmäßig verteilen
        const offset =
            i
            /
            dotCount;


        let phase =
            flow.phase
            -
            offset;


        phase =
            (
                (
                    phase
                    %
                    1
                )
                +
                1
            )
            %
            1;


        const point =
            flow.path.getPointAtLength(
                pathLength
                *
                phase
            );


        dot.setAttribute(
            'cx',
            point.x.toFixed(2)
        );


        dot.setAttribute(
            'cy',
            point.y.toFixed(2)
        );
    }
}


// ============================================================================
// Punktanzahl
//
// Wichtig:
//
// 0 W      = kein Punkt
// >0 W     = mindestens EIN Punkt
//
// Kleine Leistungen bleiben sichtbar.
// ============================================================================

function getDotCount(powerW)
{
    if (
        powerW <= 0
    ) {
        return 0;
    }


    if (
        powerW <= 50
    ) {
        return 1;
    }


    if (
        powerW <= 250
    ) {
        return 2;
    }


    if (
        powerW <= 750
    ) {
        return 3;
    }


    if (
        powerW <= 1500
    ) {
        return 4;
    }


    if (
        powerW <= 3000
    ) {
        return 5;
    }


    return 6;
}


// ============================================================================
// Geschwindigkeit
//
// Sehr kleine Flüsse bewegen sich bewusst sehr langsam.
// ============================================================================

function getSecondsPerPath(powerW)
{
    if (
        powerW <= 0
    ) {
        return 999;
    }


    if (
        powerW <= 10
    ) {
        return 12.0;
    }


    if (
        powerW <= 50
    ) {
        return 9.0;
    }


    if (
        powerW <= 250
    ) {
        return 7.0;
    }


    if (
        powerW <= 500
    ) {
        return 5.5;
    }


    if (
        powerW <= 1000
    ) {
        return 4.3;
    }


    if (
        powerW <= 2000
    ) {
        return 3.4;
    }


    if (
        powerW <= 4000
    ) {
        return 2.6;
    }


    if (
        powerW <= 6000
    ) {
        return 2.1;
    }


    return 1.8;
}


// ============================================================================
// Wetter
// ============================================================================

function getWeather(
    conditionID,
    conditionIcon,
    rain,
    clouds
)
{
    const id =
        Number(
            conditionID
        )
        ||
        0;


    const icon =
        String(
            conditionIcon
            ||
            ''
        );


    const cloudValue =
        Number(
            clouds
        )
        ||
        0;


    // Reeller Regensensor hat Vorrang
    if (
        rain
    ) {

        return {
            symbol: '🌧️',
            text: 'Regen'
        };
    }


    if (
        id >= 200
        &&
        id < 300
    ) {

        return {
            symbol: '⛈️',
            text: 'Gewitter'
        };
    }


    if (
        id >= 300
        &&
        id < 600
    ) {

        return {
            symbol: '🌧️',
            text: 'Regen'
        };
    }


    if (
        id >= 600
        &&
        id < 700
    ) {

        return {
            symbol: '🌨️',
            text: 'Schnee'
        };
    }


    if (
        id >= 700
        &&
        id < 800
    ) {

        return {
            symbol: '🌫️',
            text: 'Nebel'
        };
    }


    if (
        id === 800
    ) {

        const night =
            icon.endsWith(
                'n'
            );


        return {
            symbol:
                night
                    ? '🌙'
                    : '☀️',

            text:
                night
                    ? 'Klar'
                    : 'Sonnig'
        };
    }


    if (
        id === 801
        ||
        id === 802
    ) {

        return {
            symbol: '🌤️',
            text:
                Math.round(
                    cloudValue
                )
                +
                ' % bewölkt'
        };
    }


    if (
        id === 803
        ||
        id === 804
    ) {

        return {
            symbol: '☁️',
            text:
                Math.round(
                    cloudValue
                )
                +
                ' % bewölkt'
        };
    }


    return {
        symbol: '🌤️',
        text:
            Math.round(
                cloudValue
            )
            +
            ' % bewölkt'
    };
}


// ============================================================================
// Formatierung
// ============================================================================

function formatPower(powerW)
{
    const value =
        Math.abs(
            Number(powerW)
            ||
            0
        );


    if (
        value >= 1000
    ) {

        return (
            value
            /
            1000
        ).toFixed(2)
        +
        ' kW';
    }


    if (
        value >= 100
    ) {

        return Math.round(
            value
        )
        +
        ' W';
    }


    return value.toFixed(1)
        +
        ' W';
}


function formatGridInfo(
    voltage,
    frequency
)
{
    const parts =
        [];


    const v =
        Number(
            voltage
        );


    const f =
        Number(
            frequency
        );


    if (
        Number.isFinite(v)
        &&
        v > 0
    ) {

        parts.push(
            v.toFixed(0)
            +
            ' V'
        );
    }


    if (
        Number.isFinite(f)
        &&
        f > 0
    ) {

        parts.push(
            f.toFixed(1)
            +
            ' Hz'
        );
    }


    return parts.length
        ?
        parts.join(
            ' · '
        )
        :
        '-';
}


function setText(
    id,
    text
)
{
    const element =
        document.getElementById(
            id
        );


    if (
        element
    ) {

        element.textContent =
            text;
    }
}


// ============================================================================
// Start
// ============================================================================

document.addEventListener(
    'DOMContentLoaded',
    init
);

</script>
