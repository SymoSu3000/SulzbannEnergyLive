<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

:root {
    --pv: #35b657;
    --grid: #f29a38;
    --battery: #23b8c7;

    --text: #202020;
    --text-muted: rgba(32, 32, 32, 0.68);

    --line: rgba(110, 110, 110, 0.30);
    --circle: rgba(110, 110, 110, 0.46);
    --halo: rgba(110, 110, 110, 0.04);

    --icon-size: 64px;
    --house-size: 70px;

    --pv-center-y: 145px;
    --main-center-y: 285px;

    --grid-x: 19%;
    --house-x: 50%;
    --battery-x: 81%;
}


/* =========================================================
   DARK MODE
   ========================================================= */

@media (prefers-color-scheme: dark) {

    :root {
        --text: #f2f2f2;
        --text-muted: rgba(242, 242, 242, 0.76);

        --line: rgba(220, 220, 220, 0.28);
        --circle: rgba(220, 220, 220, 0.48);
        --halo: rgba(255, 255, 255, 0.04);
    }
}


/* =========================================================
   BASIS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

.energy {
    position: relative;

    width: 100%;
    height: 100%;

    min-height: 350px;

    overflow: hidden;

    color: var(--text);
}


/* =========================================================
   KREISKNOTEN
   ========================================================= */

.circleNode {
    position: absolute;

    transform: translate(-50%, -50%);

    z-index: 10;
}

#pvCircleNode {
    left: var(--house-x);
    top: var(--pv-center-y);
}

#gridCircleNode {
    left: var(--grid-x);
    top: var(--main-center-y);
}

#houseCircleNode {
    left: var(--house-x);
    top: var(--main-center-y);
}

#batteryCircleNode {
    left: var(--battery-x);
    top: var(--main-center-y);
}


/* =========================================================
   BESCHRIFTUNGEN
   ========================================================= */

.labelBlock {
    position: absolute;

    width: 125px;

    transform: translateX(-50%);

    text-align: center;

    z-index: 10;
}


/* PV Text */

#pvText {
    position: absolute;

    left: 50%;
    top: 47px;

    width: 135px;

    transform: translateX(-50%);

    text-align: center;

    z-index: 20;
}


/* Untere Texte */

#gridText {
    left: var(--grid-x);

    top: calc(
        var(--main-center-y)
        +
        (var(--icon-size) / 2)
        +
        9px
    );
}

#houseText {
    left: var(--house-x);

    top: calc(
        var(--main-center-y)
        +
        (var(--house-size) / 2)
        +
        9px
    );
}

#batteryText {
    left: var(--battery-x);

    top: calc(
        var(--main-center-y)
        +
        (var(--icon-size) / 2)
        +
        9px
    );
}


/* =========================================================
   ICON-KREISE
   ========================================================= */

.iconCircle {
    width: var(--icon-size);
    height: var(--icon-size);

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 2px solid var(--circle);

    background: var(--halo);
}

.iconCircle svg {
    width: 28px;
    height: 28px;

    stroke: currentColor;

    stroke-width: 1.8;

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;
}

.iconPV {
    color: var(--pv);
    border-color: var(--pv);
}

.iconGrid {
    color: var(--grid);
    border-color: var(--grid);
}

.iconBattery {
    color: var(--battery);
    border-color: var(--battery);
}

.iconHouse {
    width: var(--house-size);
    height: var(--house-size);

    color: var(--text);

    border-color: var(--circle);

    background: var(--halo);
}


/* =========================================================
   TEXTE
   ========================================================= */

.nodeTitle {
    margin-top: 0;

    font-size: 12px;
    line-height: 1.2;

    font-weight: 500;

    color: var(--text-muted);
}

.nodeValue {
    margin-top: 2px;

    font-size: 19px;
    line-height: 1.15;

    font-weight: 650;

    white-space: nowrap;

    color: var(--text);
}

.nodeStatus {
    min-height: 15px;

    margin-top: 4px;

    font-size: 10px;
    line-height: 1.2;

    color: var(--text-muted);
}


/* =========================================================
   HAUS HALO
   ========================================================= */

.houseHalo {
    position: absolute;

    left: var(--house-x);
    top: var(--main-center-y);

    width: 88px;
    height: 88px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: var(--halo);

    z-index: 0;
}


/* =========================================================
   GRAUE LINIEN
   ========================================================= */

.flowLine {
    position: absolute;

    z-index: 1;

    border-radius: 20px;

    background: var(--line);
}


/* PV -> Haus */

#linePV {
    width: 4px;

    left: var(--house-x);

    top: calc(
        var(--pv-center-y)
        +
        (var(--icon-size) / 2)
    );

    height: calc(
        var(--main-center-y)
        -
        (var(--house-size) / 2)
        -
        var(--pv-center-y)
        -
        (var(--icon-size) / 2)
    );

    transform: translateX(-50%);
}


/* Netz -> Haus */

#lineGrid {
    height: 4px;

    top: calc(
        var(--main-center-y)
        -
        2px
    );

    left: calc(
        var(--grid-x)
        +
        (var(--icon-size) / 2)
    );

    right: calc(
        50%
        +
        (var(--house-size) / 2)
    );
}


/* Haus -> Batterie */

#lineBattery {
    height: 4px;

    top: calc(
        var(--main-center-y)
        -
        2px
    );

    left: calc(
        50%
        +
        (var(--house-size) / 2)
    );

    right: calc(
        100%
        -
        var(--battery-x)
        +
        (var(--icon-size) / 2)
    );
}


/* =========================================================
   ENERGIEPUNKTE
   ========================================================= */

.flowDot {
    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    opacity: 0;

    z-index: 4;

    pointer-events: none;

    box-shadow:
        0 0 6px currentColor,
        0 0 12px currentColor;
}

.flowDot.active {
    opacity: 1;
}


/* =========================================================
   PV-PUNKT
   ========================================================= */

#dotPV {
    left: calc(
        50%
        -
        5px
    );

    top: calc(
        var(--pv-center-y)
        +
        (var(--icon-size) / 2)
        -
        5px
    );

    color: var(--pv);
    background: var(--pv);
}

#dotPV.active {
    animation:
        pvFlow
        1.7s
        linear
        infinite;
}

@keyframes pvFlow {

    from {
        top: calc(
            var(--pv-center-y)
            +
            (var(--icon-size) / 2)
            -
            5px
        );
    }

    to {
        top: calc(
            var(--main-center-y)
            -
            (var(--house-size) / 2)
            -
            5px
        );
    }
}


/* =========================================================
   NETZ-PUNKT
   ========================================================= */

#dotGrid {
    top: calc(
        var(--main-center-y)
        -
        5px
    );
}

#dotGrid.import {
    animation:
        gridImport
        1.7s
        linear
        infinite;
}

#dotGrid.export {
    animation:
        gridExport
        1.7s
        linear
        infinite;
}

@keyframes gridImport {

    from {
        left: calc(
            var(--grid-x)
            +
            (var(--icon-size) / 2)
            -
            5px
        );
    }

    to {
        left: calc(
            50%
            -
            (var(--house-size) / 2)
            -
            5px
        );
    }
}

@keyframes gridExport {

    from {
        left: calc(
            50%
            -
            (var(--house-size) / 2)
            -
            5px
        );
    }

    to {
        left: calc(
            var(--grid-x)
            +
            (var(--icon-size) / 2)
            -
            5px
        );
    }
}


/* =========================================================
   BATTERIE-PUNKT
   ========================================================= */

#dotBattery {
    top: calc(
        var(--main-center-y)
        -
        5px
    );
}

#dotBattery.charge {
    animation:
        batteryCharge
        1.7s
        linear
        infinite;
}

#dotBattery.discharge {
    animation:
        batteryDischarge
        1.7s
        linear
        infinite;
}

@keyframes batteryCharge {

    from {
        left: calc(
            50%
            +
            (var(--house-size) / 2)
            -
            5px
        );
    }

    to {
        left: calc(
            var(--battery-x)
            -
            (var(--icon-size) / 2)
            -
            5px
        );
    }
}

@keyframes batteryDischarge {

    from {
        left: calc(
            var(--battery-x)
            -
            (var(--icon-size) / 2)
            -
            5px
        );
    }

    to {
        left: calc(
            50%
            +
            (var(--house-size) / 2)
            -
            5px
        );
    }
}


/* =========================================================
   BATTERIE SOC
   ========================================================= */

.socRow {
    width: 80px;

    margin: 6px auto 0;
}

.socTrack {
    width: 100%;
    height: 6px;

    overflow: hidden;

    border-radius: 20px;

    background: var(--line);
}

#batteryFill {
    width: 0;
    height: 100%;

    border-radius: 20px;

    background: var(--battery);

    transition: width 0.4s ease;
}

#socValue {
    margin-top: 4px;

    font-size: 10px;

    color: var(--text-muted);
}


/* =========================================================
   STATUSFARBEN
   ========================================================= */

.statusPV {
    color: var(--pv) !important;
}

.statusGrid {
    color: var(--grid) !important;
}

.statusBattery {
    color: var(--battery) !important;
}


/* =========================================================
   MITTLERE KACHEL
   ========================================================= */

@media (max-width: 700px) {

    :root {
        --icon-size: 58px;
        --house-size: 64px;

        --pv-center-y: 122px;
        --main-center-y: 248px;

        --grid-x: 19%;
        --battery-x: 81%;
    }

    .energy {
        min-height: 300px;
    }

    #pvText {
        top: 38px;
        width: 120px;
    }

    .labelBlock {
        width: 108px;
    }

    .iconCircle svg {
        width: 25px;
        height: 25px;
    }

    .nodeTitle {
        font-size: 11px;
    }

    .nodeValue {
        font-size: 18px;
    }

    .nodeStatus {
        font-size: 10px;
    }

    .houseHalo {
        width: 80px;
        height: 80px;
    }
}


/* =========================================================
   NATEL
   ========================================================= */

@media (max-width: 430px) {

    :root {
        --icon-size: 50px;
        --house-size: 56px;

        /*
         * Wesentlich kompakter:
         * damit die unteren Texte IN der Kachel bleiben.
         */
        --pv-center-y: 96px;
        --main-center-y: 194px;

        --grid-x: 19%;
        --battery-x: 81%;
    }

    .energy {
        min-height: 250px;
    }

    #pvText {
        top: 15px;
        width: 110px;
    }

    .labelBlock {
        width: 98px;
    }

    .iconCircle svg {
        width: 23px;
        height: 23px;
    }

    .nodeTitle {
        font-size: 11px;
        line-height: 1.15;
    }

    .nodeValue {
        margin-top: 2px;

        font-size: 17px;
    }

    .nodeStatus {
        margin-top: 3px;

        font-size: 10px;
        line-height: 1.15;
    }

    .socRow {
        width: 66px;
        margin-top: 5px;
    }

    #socValue {
        font-size: 10px;
    }

    .houseHalo {
        width: 68px;
        height: 68px;
    }
}


/* =========================================================
   SEHR SCHMALES NATEL
   ========================================================= */

@media (max-width: 350px) {

    :root {
        --icon-size: 46px;
        --house-size: 52px;

        --pv-center-y: 90px;
        --main-center-y: 184px;

        --grid-x: 20%;
        --battery-x: 80%;
    }

    .energy {
        min-height: 238px;
    }

    #pvText {
        top: 12px;
        width: 100px;
    }

    .labelBlock {
        width: 86px;
    }

    .nodeTitle {
        font-size: 10px;
    }

    .nodeValue {
        font-size: 16px;
    }

    .nodeStatus {
        font-size: 9px;
    }

    .iconCircle svg {
        width: 21px;
        height: 21px;
    }
}

</style>
</head>


<body>

<div class="energy">


    <!-- LINIEN -->

    <div class="flowLine" id="linePV"></div>
    <div class="flowLine" id="lineGrid"></div>
    <div class="flowLine" id="lineBattery"></div>


    <!-- PUNKTE -->

    <div class="flowDot" id="dotPV"></div>
    <div class="flowDot" id="dotGrid"></div>
    <div class="flowDot" id="dotBattery"></div>


    <div class="houseHalo"></div>


    <!-- PV TEXT -->

    <div id="pvText">

        <div class="nodeTitle">
            PV-Anlage
        </div>

        <div class="nodeValue" id="pvValue">
            -- kW
        </div>

        <div class="nodeStatus" id="pvStatus">
            -
        </div>

    </div>


    <!-- PV KREIS -->

    <div class="circleNode" id="pvCircleNode">

        <div class="iconCircle iconPV">

            <svg viewBox="0 0 24 24">

                <circle cx="12" cy="12" r="4"></circle>

                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>

                <path d="M4.93 4.93l1.41 1.41"></path>
                <path d="M17.66 17.66l1.41 1.41"></path>

                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>

                <path d="M4.93 19.07l1.41-1.41"></path>
                <path d="M17.66 6.34l1.41-1.41"></path>

            </svg>

        </div>

    </div>


    <!-- NETZ KREIS -->

    <div class="circleNode" id="gridCircleNode">

        <div class="iconCircle iconGrid">

            <svg viewBox="0 0 24 24">

                <path d="M4 9h16"></path>
                <path d="M4 15h16"></path>

                <path d="M7 6l-3 3 3 3"></path>
                <path d="M17 12l3 3-3 3"></path>

            </svg>

        </div>

    </div>


    <!-- NETZ TEXT -->

    <div class="labelBlock" id="gridText">

        <div class="nodeTitle">
            Stromnetz
        </div>

        <div class="nodeValue" id="gridValue">
            -- kW
        </div>

        <div class="nodeStatus" id="gridMode">
            -
        </div>

    </div>


    <!-- HAUS KREIS -->

    <div class="circleNode" id="houseCircleNode">

        <div class="iconCircle iconHouse">

            <svg viewBox="0 0 24 24">

                <path d="M3 11.5L12 4l9 7.5"></path>

                <path d="M5.5 10v9h13v-9"></path>

                <path d="M9.5 19v-5h5v5"></path>

            </svg>

        </div>

    </div>


    <!-- HAUS TEXT -->

    <div class="labelBlock" id="houseText">

        <div class="nodeTitle">
            Haus
        </div>

        <div class="nodeValue" id="houseValue">
            -- kW
        </div>

        <div class="nodeStatus">
            Verbrauch
        </div>

    </div>


    <!-- BATTERIE KREIS -->

    <div class="circleNode" id="batteryCircleNode">

        <div class="iconCircle iconBattery">

            <svg viewBox="0 0 24 24">

                <rect
                    x="4"
                    y="7"
                    width="15"
                    height="10"
                    rx="2"
                ></rect>

                <path d="M19 10h2v4h-2"></path>

                <path d="M8 12h7"></path>

            </svg>

        </div>

    </div>


    <!-- BATTERIE TEXT -->

    <div class="labelBlock" id="batteryText">

        <div class="nodeTitle">
            Batterie
        </div>

        <div class="nodeValue" id="batteryValue">
            -- kW
        </div>

        <div class="nodeStatus" id="batteryMode">
            -
        </div>

        <div class="socRow">

            <div class="socTrack">
                <div id="batteryFill"></div>
            </div>

            <div id="socValue">
                -- %
            </div>

        </div>

    </div>

</div>


<script>

function kw(value)
{
    return Number(value || 0).toFixed(1) + " kW";
}


function handleMessage(data)
{
    if (!data) {
        return;
    }


    if (typeof data === "string") {

        try {
            data = JSON.parse(data);
        } catch (error) {

            console.error(
                "EnergyFlowLive JSON Fehler:",
                error,
                data
            );

            return;
        }
    }


    const pv =
        Number(data.pv || 0);

    const house =
        Number(data.house || 0);

    const gridImport =
        Number(data.gridImport || 0);

    const gridExport =
        Number(data.gridExport || 0);

    const batteryCharge =
        Number(data.batteryCharge || 0);

    const batteryDischarge =
        Number(data.batteryDischarge || 0);

    const soc =
        Number(data.soc || 0);


    document
        .getElementById("pvValue")
        .textContent =
            kw(pv);


    document
        .getElementById("houseValue")
        .textContent =
            kw(house);


    document
        .getElementById("socValue")
        .textContent =
            soc.toFixed(0) + " %";


    document
        .getElementById("batteryFill")
        .style.width =
            Math.max(
                0,
                Math.min(
                    100,
                    soc
                )
            ) + "%";


    /* PV */

    const dotPV =
        document.getElementById("dotPV");

    const pvStatus =
        document.getElementById("pvStatus");


    if (pv > 0.05) {

        dotPV.style.background =
            "var(--pv)";

        dotPV.style.color =
            "var(--pv)";

        dotPV.className =
            "flowDot active";


        pvStatus.textContent =
            "Produktion";

        pvStatus.className =
            "nodeStatus statusPV";

    } else {

        dotPV.className =
            "flowDot";


        pvStatus.textContent =
            "kein Ertrag";

        pvStatus.className =
            "nodeStatus";
    }


    /* NETZ */

    const dotGrid =
        document.getElementById("dotGrid");

    const gridValue =
        document.getElementById("gridValue");

    const gridMode =
        document.getElementById("gridMode");


    if (gridImport > 0.05) {

        gridValue.textContent =
            kw(gridImport);


        gridMode.textContent =
            "Netzbezug";

        gridMode.className =
            "nodeStatus statusGrid";


        dotGrid.style.background =
            "var(--grid)";

        dotGrid.style.color =
            "var(--grid)";

        dotGrid.className =
            "flowDot active import";

    }

    else if (gridExport > 0.05) {

        gridValue.textContent =
            kw(gridExport);


        gridMode.textContent =
            "Einspeisung";

        gridMode.className =
            "nodeStatus statusPV";


        dotGrid.style.background =
            "var(--pv)";

        dotGrid.style.color =
            "var(--pv)";

        dotGrid.className =
            "flowDot active export";

    }

    else {

        gridValue.textContent =
            "0.0 kW";


        gridMode.textContent =
            "kein Austausch";

        gridMode.className =
            "nodeStatus";


        dotGrid.className =
            "flowDot";
    }


    /* BATTERIE */

    const dotBattery =
        document.getElementById("dotBattery");

    const batteryValue =
        document.getElementById("batteryValue");

    const batteryMode =
        document.getElementById("batteryMode");


    if (batteryCharge > 0.05) {

        batteryValue.textContent =
            kw(batteryCharge);


        batteryMode.textContent =
            "Laden";

        batteryMode.className =
            "nodeStatus statusPV";


        dotBattery.style.background =
            "var(--pv)";

        dotBattery.style.color =
            "var(--pv)";

        dotBattery.className =
            "flowDot active charge";

    }

    else if (batteryDischarge > 0.05) {

        batteryValue.textContent =
            kw(batteryDischarge);


        batteryMode.textContent =
            "Entladen";

        batteryMode.className =
            "nodeStatus statusBattery";


        dotBattery.style.background =
            "var(--battery)";

        dotBattery.style.color =
            "var(--battery)";

        dotBattery.className =
            "flowDot active discharge";

    }

    else {

        batteryValue.textContent =
            "0.0 kW";


        batteryMode.textContent =
            "Standby";

        batteryMode.className =
            "nodeStatus";


        dotBattery.className =
            "flowDot";
    }
}


window.addEventListener(
    "load",
    function ()
    {
        requestAction(
            "Refresh",
            true
        );
    }
);

</script>

</body>
</html>
