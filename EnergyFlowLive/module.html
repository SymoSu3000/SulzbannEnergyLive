<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

:root {
    --pv: #35b657;
    --grid: #f29a38;
    --battery: #23b8c7;

    --text: #202020;
    --text-muted: rgba(32, 32, 32, 0.72);

    --line: rgba(110, 110, 110, 0.30);
    --circle: rgba(110, 110, 110, 0.46);
    --halo: rgba(110, 110, 110, 0.04);
}


/* =========================================================
   DARK MODE
   ========================================================= */

@media (prefers-color-scheme: dark) {

    :root {
        --text: #f2f2f2;
        --text-muted: rgba(242, 242, 242, 0.80);

        --line: rgba(220, 220, 220, 0.30);
        --circle: rgba(220, 220, 220, 0.50);
        --halo: rgba(255, 255, 255, 0.045);
    }
}


/* =========================================================
   BASIS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =========================================================
   VIEWPORT
   ========================================================= */

#energyViewport {
    position: relative;

    width: 100%;
    height: 100%;

    min-width: 0;
    min-height: 250px;

    overflow: hidden;

    /*
     * DESKTOP STANDARD
     */

    --safe-top: 58px;
    --safe-bottom: 12px;
    --side-padding: 18px;

    --pv-y: 25%;
    --main-y: 62%;

    --grid-x: 18%;
    --house-x: 50%;
    --battery-x: 82%;

    --icon-size: 64px;
    --house-size: 70px;

    --label-width: 130px;

    --font-title: 11px;
    --font-value: 18px;
    --font-status: 10px;
    --font-soc: 14px;
}


/* =========================================================
   MOBILE LAYOUT
   Wird durch ResizeObserver gesetzt
   ========================================================= */

#energyViewport[data-layout="mobile"] {

    /*
     * Mehr Abstand nach oben,
     * damit der Symcon-Kacheltitel NICHT mit PV kollidiert.
     */

    --safe-top: 86px;

    --safe-bottom: 10px;
    --side-padding: 8px;

    /*
     * Vertikal kompakter,
     * damit unten alle Beschriftungen Platz haben.
     */

    --pv-y: 27%;
    --main-y: 58%;

    /*
     * Horizontal etwas weiter innen.
     */

    --grid-x: 20%;
    --battery-x: 80%;

    --icon-size: 58px;
    --house-size: 64px;

    --label-width: 118px;

    /*
     * Auf dem Natel bewusst GRÖSSER.
     */

    --font-title: 14px;
    --font-value: 22px;
    --font-status: 12px;
    --font-soc: 16px;
}


/* =========================================================
   SEHR SCHMALE KACHEL
   ========================================================= */

#energyViewport[data-layout="small"] {

    --safe-top: 84px;
    --safe-bottom: 8px;
    --side-padding: 4px;

    --pv-y: 27%;
    --main-y: 57%;

    --grid-x: 21%;
    --battery-x: 79%;

    --icon-size: 54px;
    --house-size: 60px;

    --label-width: 108px;

    --font-title: 14px;
    --font-value: 21px;
    --font-status: 12px;
    --font-soc: 16px;
}


/* =========================================================
   DIAGRAMMFLÄCHE
   ========================================================= */

#diagram {
    position: absolute;

    left: var(--side-padding);
    right: var(--side-padding);

    top: var(--safe-top);
    bottom: var(--safe-bottom);

    overflow: visible;
}


/* =========================================================
   KREISE
   ========================================================= */

.circleNode {
    position: absolute;

    transform: translate(-50%, -50%);

    z-index: 10;
}


#pvCircleNode {
    left: var(--house-x);
    top: var(--pv-y);
}


#gridCircleNode {
    left: var(--grid-x);
    top: var(--main-y);
}


#houseCircleNode {
    left: var(--house-x);
    top: var(--main-y);
}


#batteryCircleNode {
    left: var(--battery-x);
    top: var(--main-y);
}


/* =========================================================
   ICON-KREISE
   ========================================================= */

.iconCircle {
    width: var(--icon-size);
    height: var(--icon-size);

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 2px solid var(--circle);

    background: var(--halo);
}


.iconCircle svg {
    width: 44%;
    height: 44%;

    stroke: currentColor;

    stroke-width: 1.8;

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;
}


.iconPV {
    color: var(--pv);
    border-color: var(--pv);
}


.iconGrid {
    color: var(--grid);
    border-color: var(--grid);
}


.iconBattery {
    color: var(--battery);
    border-color: var(--battery);
}


.iconHouse {
    width: var(--house-size);
    height: var(--house-size);

    color: var(--text);

    border-color: var(--circle);

    background: var(--halo);
}


/* =========================================================
   HAUS HALO
   ========================================================= */

.houseHalo {
    position: absolute;

    left: var(--house-x);
    top: var(--main-y);

    width: calc(var(--house-size) + 20px);
    height: calc(var(--house-size) + 20px);

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: var(--halo);

    z-index: 0;
}


/* =========================================================
   TEXTE ALLGEMEIN
   ========================================================= */

.labelBlock {
    position: absolute;

    width: var(--label-width);

    transform: translateX(-50%);

    text-align: center;

    z-index: 20;
}


.nodeTitle {
    margin: 0;

    font-size: var(--font-title);
    line-height: 1.18;

    font-weight: 500;

    color: var(--text-muted);
}


.nodeValue {
    margin-top: 2px;

    font-size: var(--font-value);
    line-height: 1.08;

    font-weight: 650;

    white-space: nowrap;

    color: var(--text);
}


.nodeStatus {
    margin-top: 4px;

    min-height: 15px;

    font-size: var(--font-status);
    line-height: 1.15;

    color: var(--text-muted);
}


/* =========================================================
   PV TEXT
   ========================================================= */

/*
 * Komplett innerhalb der reservierten Diagrammfläche.
 * Dadurch keine Kollision mehr mit dem Symcon-Titel.
 */

#pvText {
    left: var(--house-x);

    top: 0;
}


/* =========================================================
   UNTERE TEXTE
   ========================================================= */

#gridText {
    left: var(--grid-x);

    top: calc(
        var(--main-y)
        +
        (var(--icon-size) / 2)
        +
        8px
    );
}


#houseText {
    left: var(--house-x);

    top: calc(
        var(--main-y)
        +
        (var(--house-size) / 2)
        +
        8px
    );
}


#batteryText {
    left: var(--battery-x);

    top: calc(
        var(--main-y)
        +
        (var(--icon-size) / 2)
        +
        8px
    );
}


/* =========================================================
   STATUSFARBEN
   ========================================================= */

.statusPV {
    color: var(--pv) !important;
}


.statusGrid {
    color: var(--grid) !important;
}


.statusBattery {
    color: var(--battery) !important;
}


/* =========================================================
   SOC
   ========================================================= */

.socRow {
    width: 88px;

    margin: 6px auto 0;
}


.socTrack {
    width: 100%;
    height: 7px;

    overflow: hidden;

    border-radius: 20px;

    background: var(--line);
}


#batteryFill {
    width: 0;
    height: 100%;

    border-radius: 20px;

    background: var(--battery);

    transition: width 0.4s ease;
}


#socValue {
    margin-top: 5px;

    font-size: var(--font-soc);
    line-height: 1.1;

    font-weight: 700;

    color: var(--text);
}


/* =========================================================
   LINIEN
   ========================================================= */

.flowLine {
    position: absolute;

    z-index: 1;

    border-radius: 20px;

    background: var(--line);
}


/*
 * PV -> Haus
 */

#linePV {
    left: var(--house-x);

    top: calc(
        var(--pv-y)
        +
        (var(--icon-size) / 2)
    );

    width: 4px;

    height: calc(
        var(--main-y)
        -
        (var(--house-size) / 2)
        -
        var(--pv-y)
        -
        (var(--icon-size) / 2)
    );

    transform: translateX(-50%);
}


/*
 * Netz -> Haus
 */

#lineGrid {
    top: calc(
        var(--main-y)
        -
        2px
    );

    left: calc(
        var(--grid-x)
        +
        (var(--icon-size) / 2)
    );

    right: calc(
        50%
        +
        (var(--house-size) / 2)
    );

    height: 4px;
}


/*
 * Haus -> Batterie
 */

#lineBattery {
    top: calc(
        var(--main-y)
        -
        2px
    );

    left: calc(
        50%
        +
        (var(--house-size) / 2)
    );

    right: calc(
        100%
        -
        var(--battery-x)
        +
        (var(--icon-size) / 2)
    );

    height: 4px;
}


/* =========================================================
   FLUSSPUNKTE
   ========================================================= */

.flowDot {
    position: absolute;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    opacity: 0;

    z-index: 5;

    pointer-events: none;

    box-shadow:
        0 0 7px currentColor,
        0 0 14px currentColor;
}


.flowDot.active {
    opacity: 1;
}


/* =========================================================
   PV PUNKT
   ========================================================= */

#dotPV {
    left: calc(
        50%
        -
        5.5px
    );

    top: calc(
        var(--pv-y)
        +
        (var(--icon-size) / 2)
        -
        5.5px
    );

    color: var(--pv);
    background: var(--pv);
}


#dotPV.active {
    animation:
        pvFlow
        1.7s
        linear
        infinite;
}


@keyframes pvFlow {

    from {
        top: calc(
            var(--pv-y)
            +
            (var(--icon-size) / 2)
            -
            5.5px
        );
    }

    to {
        top: calc(
            var(--main-y)
            -
            (var(--house-size) / 2)
            -
            5.5px
        );
    }
}


/* =========================================================
   NETZ PUNKT
   ========================================================= */

#dotGrid {
    top: calc(
        var(--main-y)
        -
        5.5px
    );
}


#dotGrid.import {
    animation:
        gridImport
        1.7s
        linear
        infinite;
}


#dotGrid.export {
    animation:
        gridExport
        1.7s
        linear
        infinite;
}


@keyframes gridImport {

    from {
        left: calc(
            var(--grid-x)
            +
            (var(--icon-size) / 2)
            -
            5.5px
        );
    }

    to {
        left: calc(
            50%
            -
            (var(--house-size) / 2)
            -
            5.5px
        );
    }
}


@keyframes gridExport {

    from {
        left: calc(
            50%
            -
            (var(--house-size) / 2)
            -
            5.5px
        );
    }

    to {
        left: calc(
            var(--grid-x)
            +
            (var(--icon-size) / 2)
            -
            5.5px
        );
    }
}


/* =========================================================
   BATTERIE PUNKT
   ========================================================= */

#dotBattery {
    top: calc(
        var(--main-y)
        -
        5.5px
    );
}


#dotBattery.charge {
    animation:
        batteryCharge
        1.7s
        linear
        infinite;
}


#dotBattery.discharge {
    animation:
        batteryDischarge
        1.7s
        linear
        infinite;
}


@keyframes batteryCharge {

    from {
        left: calc(
            50%
            +
            (var(--house-size) / 2)
            -
            5.5px
        );
    }

    to {
        left: calc(
            var(--battery-x)
            -
            (var(--icon-size) / 2)
            -
            5.5px
        );
    }
}


@keyframes batteryDischarge {

    from {
        left: calc(
            var(--battery-x)
            -
            (var(--icon-size) / 2)
            -
            5.5px
        );
    }

    to {
        left: calc(
            50%
            +
            (var(--house-size) / 2)
            -
            5.5px
        );
    }
}

</style>
</head>


<body>

<div id="energyViewport">

    <div id="diagram">


        <!-- LINIEN -->

        <div class="flowLine" id="linePV"></div>
        <div class="flowLine" id="lineGrid"></div>
        <div class="flowLine" id="lineBattery"></div>


        <!-- PUNKTE -->

        <div class="flowDot" id="dotPV"></div>
        <div class="flowDot" id="dotGrid"></div>
        <div class="flowDot" id="dotBattery"></div>


        <div class="houseHalo"></div>


        <!-- PV TEXT -->

        <div
            class="labelBlock"
            id="pvText"
        >

            <div class="nodeTitle">
                PV-Anlage
            </div>

            <div
                class="nodeValue"
                id="pvValue"
            >
                -- kW
            </div>

            <div
                class="nodeStatus"
                id="pvStatus"
            >
                -
            </div>

        </div>


        <!-- PV KREIS -->

        <div
            class="circleNode"
            id="pvCircleNode"
        >

            <div class="iconCircle iconPV">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                    ></circle>

                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>

                    <path d="M4.93 4.93l1.41 1.41"></path>
                    <path d="M17.66 17.66l1.41 1.41"></path>

                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>

                    <path d="M4.93 19.07l1.41-1.41"></path>
                    <path d="M17.66 6.34l1.41-1.41"></path>

                </svg>

            </div>

        </div>


        <!-- NETZ KREIS -->

        <div
            class="circleNode"
            id="gridCircleNode"
        >

            <div class="iconCircle iconGrid">

                <svg viewBox="0 0 24 24">

                    <path d="M4 9h16"></path>
                    <path d="M4 15h16"></path>

                    <path d="M7 6l-3 3 3 3"></path>
                    <path d="M17 12l3 3-3 3"></path>

                </svg>

            </div>

        </div>


        <!-- NETZ TEXT -->

        <div
            class="labelBlock"
            id="gridText"
        >

            <div class="nodeTitle">
                Stromnetz
            </div>

            <div
                class="nodeValue"
                id="gridValue"
            >
                -- kW
            </div>

            <div
                class="nodeStatus"
                id="gridMode"
            >
                -
            </div>

        </div>


        <!-- HAUS KREIS -->

        <div
            class="circleNode"
            id="houseCircleNode"
        >

            <div class="iconCircle iconHouse">

                <svg viewBox="0 0 24 24">

                    <path d="M3 11.5L12 4l9 7.5"></path>

                    <path d="M5.5 10v9h13v-9"></path>

                    <path d="M9.5 19v-5h5v5"></path>

                </svg>

            </div>

        </div>


        <!-- HAUS TEXT -->

        <div
            class="labelBlock"
            id="houseText"
        >

            <div class="nodeTitle">
                Haus
            </div>

            <div
                class="nodeValue"
                id="houseValue"
            >
                -- kW
            </div>

            <div class="nodeStatus">
                Verbrauch
            </div>

        </div>


        <!-- BATTERIE KREIS -->

        <div
            class="circleNode"
            id="batteryCircleNode"
        >

            <div class="iconCircle iconBattery">

                <svg viewBox="0 0 24 24">

                    <rect
                        x="4"
                        y="7"
                        width="15"
                        height="10"
                        rx="2"
                    ></rect>

                    <path d="M19 10h2v4h-2"></path>

                    <path d="M8 12h7"></path>

                </svg>

            </div>

        </div>


        <!-- BATTERIE TEXT -->

        <div
            class="labelBlock"
            id="batteryText"
        >

            <div class="nodeTitle">
                Batterie
            </div>

            <div
                class="nodeValue"
                id="batteryValue"
            >
                -- kW
            </div>

            <div
                class="nodeStatus"
                id="batteryMode"
            >
                -
            </div>


            <div class="socRow">

                <div class="socTrack">

                    <div
                        id="batteryFill"
                    ></div>

                </div>

                <div id="socValue">
                    -- %
                </div>

            </div>

        </div>

    </div>

</div>


<script>


/* =========================================================
   RESPONSIVE KACHELGRÖSSE
   ========================================================= */

function updateLayout()
{
    const viewport =
        document.getElementById(
            "energyViewport"
        );


    if (!viewport) {
        return;
    }


    const width =
        viewport.clientWidth;


    /*
     * Nicht "Handy erkennen",
     * sondern die echte Kachelbreite auswerten.
     *
     * So funktioniert es auch:
     * - PC kleine Kachel
     * - PC große Kachel
     * - Tablet
     * - Natel
     */

    if (width <= 350) {

        viewport.dataset.layout =
            "small";

    } else if (width <= 520) {

        viewport.dataset.layout =
            "mobile";

    } else {

        viewport.dataset.layout =
            "desktop";
    }
}


const layoutObserver =
    new ResizeObserver(
        function ()
        {
            updateLayout();
        }
    );


/* =========================================================
   HELFER
   ========================================================= */

function kw(value)
{
    return (
        Number(
            value || 0
        ).toFixed(1)
        +
        " kW"
    );
}


/* =========================================================
   LIVE DATEN
   ========================================================= */

function handleMessage(data)
{
    if (!data) {
        return;
    }


    if (
        typeof data === "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            console.error(
                "EnergyFlowLive JSON Fehler:",
                error,
                data
            );

            return;
        }
    }


    const pv =
        Number(data.pv || 0);

    const house =
        Number(data.house || 0);

    const gridImport =
        Number(data.gridImport || 0);

    const gridExport =
        Number(data.gridExport || 0);

    const batteryCharge =
        Number(data.batteryCharge || 0);

    const batteryDischarge =
        Number(data.batteryDischarge || 0);

    const soc =
        Number(data.soc || 0);


    document
        .getElementById(
            "pvValue"
        )
        .textContent =
            kw(pv);


    document
        .getElementById(
            "houseValue"
        )
        .textContent =
            kw(house);


    document
        .getElementById(
            "socValue"
        )
        .textContent =
            soc.toFixed(0)
            +
            " %";


    document
        .getElementById(
            "batteryFill"
        )
        .style.width =
            Math.max(
                0,
                Math.min(
                    100,
                    soc
                )
            )
            +
            "%";


    /* =====================================================
       PV
       ===================================================== */

    const dotPV =
        document.getElementById(
            "dotPV"
        );


    const pvStatus =
        document.getElementById(
            "pvStatus"
        );


    if (pv > 0.05) {

        dotPV.style.background =
            "var(--pv)";


        dotPV.style.color =
            "var(--pv)";


        dotPV.className =
            "flowDot active";


        pvStatus.textContent =
            "Produktion";


        pvStatus.className =
            "nodeStatus statusPV";

    } else {

        dotPV.className =
            "flowDot";


        pvStatus.textContent =
            "kein Ertrag";


        pvStatus.className =
            "nodeStatus";
    }


    /* =====================================================
       NETZ
       ===================================================== */

    const dotGrid =
        document.getElementById(
            "dotGrid"
        );


    const gridValue =
        document.getElementById(
            "gridValue"
        );


    const gridMode =
        document.getElementById(
            "gridMode"
        );


    if (gridImport > 0.05) {

        gridValue.textContent =
            kw(gridImport);


        gridMode.textContent =
            "Netzbezug";


        gridMode.className =
            "nodeStatus statusGrid";


        dotGrid.style.background =
            "var(--grid)";


        dotGrid.style.color =
            "var(--grid)";


        dotGrid.className =
            "flowDot active import";

    }

    else if (gridExport > 0.05) {

        gridValue.textContent =
            kw(gridExport);


        gridMode.textContent =
            "Einspeisung";


        gridMode.className =
            "nodeStatus statusPV";


        dotGrid.style.background =
            "var(--pv)";


        dotGrid.style.color =
            "var(--pv)";


        dotGrid.className =
            "flowDot active export";

    }

    else {

        gridValue.textContent =
            "0.0 kW";


        gridMode.textContent =
            "kein Austausch";


        gridMode.className =
            "nodeStatus";


        dotGrid.className =
            "flowDot";
    }


    /* =====================================================
       BATTERIE
       ===================================================== */

    const dotBattery =
        document.getElementById(
            "dotBattery"
        );


    const batteryValue =
        document.getElementById(
            "batteryValue"
        );


    const batteryMode =
        document.getElementById(
            "batteryMode"
        );


    if (batteryCharge > 0.05) {

        batteryValue.textContent =
            kw(batteryCharge);


        batteryMode.textContent =
            "Laden";


        batteryMode.className =
            "nodeStatus statusPV";


        dotBattery.style.background =
            "var(--pv)";


        dotBattery.style.color =
            "var(--pv)";


        dotBattery.className =
            "flowDot active charge";

    }

    else if (batteryDischarge > 0.05) {

        batteryValue.textContent =
            kw(batteryDischarge);


        batteryMode.textContent =
            "Entladen";


        batteryMode.className =
            "nodeStatus statusBattery";


        dotBattery.style.background =
            "var(--battery)";


        dotBattery.style.color =
            "var(--battery)";


        dotBattery.className =
            "flowDot active discharge";

    }

    else {

        batteryValue.textContent =
            "0.0 kW";


        batteryMode.textContent =
            "Standby";


        batteryMode.className =
            "nodeStatus";


        dotBattery.className =
            "flowDot";
    }
}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
    "load",
    function ()
    {
        const viewport =
            document.getElementById(
                "energyViewport"
            );


        updateLayout();


        if (viewport) {

            layoutObserver.observe(
                viewport
            );
        }


        requestAction(
            "Refresh",
            true
        );
