<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

:root {
    --pv: #35b657;
    --grid: #f29a38;
    --battery: #23b8c7;

    --text: #202020;
    --text-muted: rgba(32, 32, 32, 0.62);

    --line: rgba(110, 110, 110, 0.30);
    --circle: rgba(110, 110, 110, 0.46);
    --halo: rgba(110, 110, 110, 0.04);

    /*
     * Gemeinsame Geometrie
     */
    --icon-size: 64px;
    --house-size: 70px;

    /*
     * Gesamtes Diagramm weiter nach unten
     */
    --diagram-top: 65px;

    /*
     * Horizontale Hauptachse
     */
    --main-y: 205px;

    /*
     * Horizontale Positionen
     */
    --grid-x: 17%;
    --house-x: 50%;
    --battery-x: 83%;
}


/* =========================================================
   DARK MODE
   ========================================================= */

@media (prefers-color-scheme: dark) {

    :root {
        --text: #f2f2f2;
        --text-muted: rgba(242, 242, 242, 0.68);

        --line: rgba(220, 220, 220, 0.28);
        --circle: rgba(220, 220, 220, 0.48);
        --halo: rgba(255, 255, 255, 0.04);
    }
}


/* =========================================================
   BASIS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


.energy {
    position: relative;

    width: 100%;
    height: 100%;

    min-height: 330px;

    overflow: hidden;

    color: var(--text);
}


/* =========================================================
   NORMALE KNOTEN
   ========================================================= */

.node {
    position: absolute;

    width: 120px;

    transform: translate(-50%, 0);

    text-align: center;

    z-index: 10;
}


/* =========================================================
   PV
   ========================================================= */

/*
 * PV ist speziell aufgebaut:
 *
 * Text
 * Leistung
 * Status
 * Kreis
 * Leitung
 */

#pv {
    left: var(--house-x);

    top: calc(
        var(--diagram-top)
        -
        53px
    );
}


.pvTextBlock {
    margin-bottom: 7px;

    text-align: center;
}


/* =========================================================
   NETZ / HAUS / BATTERIE
   ========================================================= */

#grid {
    left: var(--grid-x);

    top: calc(
        var(--diagram-top)
        +
        var(--main-y)
        -
        (var(--icon-size) / 2)
    );
}


#house {
    left: var(--house-x);

    top: calc(
        var(--diagram-top)
        +
        var(--main-y)
        -
        (var(--house-size) / 2)
    );
}


#battery {
    left: var(--battery-x);

    top: calc(
        var(--diagram-top)
        +
        var(--main-y)
        -
        (var(--icon-size) / 2)
    );
}


/* =========================================================
   ICON-KREISE
   ========================================================= */

.iconCircle {
    width: var(--icon-size);
    height: var(--icon-size);

    margin: 0 auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 2px solid var(--circle);

    background: var(--halo);
}


.iconCircle svg {
    width: 28px;
    height: 28px;

    stroke: currentColor;

    stroke-width: 1.8;

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;
}


.iconPV {
    color: var(--pv);

    border-color: var(--pv);
}


.iconGrid {
    color: var(--grid);

    border-color: var(--grid);
}


.iconBattery {
    color: var(--battery);

    border-color: var(--battery);
}


.iconHouse {
    width: var(--house-size);
    height: var(--house-size);

    color: var(--text);

    border-color: var(--circle);

    background: var(--halo);
}


/* =========================================================
   TEXTE
   ========================================================= */

.nodeTitle {
    margin-top: 6px;

    font-size: 11px;
    font-weight: 500;

    color: var(--text-muted);
}


.nodeValue {
    margin-top: 1px;

    font-size: 19px;

    line-height: 1.15;

    font-weight: 650;

    white-space: nowrap;

    color: var(--text);
}


.nodeStatus {
    min-height: 14px;

    margin-top: 3px;

    font-size: 9px;

    line-height: 1.15;

    color: var(--text-muted);
}


/*
 * Beim PV-Block liegen die Texte VOR dem Kreis.
 * Deshalb dort kein zusätzlicher oberer Abstand.
 */

.pvTextBlock .nodeTitle {
    margin-top: 0;
}


.pvTextBlock .nodeStatus {
    margin-bottom: 0;
}


/* =========================================================
   HAUS HALO
   ========================================================= */

.houseHalo {
    position: absolute;

    left: var(--house-x);

    top: calc(
        var(--diagram-top)
        +
        var(--main-y)
    );

    width: 88px;
    height: 88px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: var(--halo);

    z-index: 0;
}


/* =========================================================
   GRAUE VERBINDUNGSLINIEN
   ========================================================= */

.flowLine {
    position: absolute;

    z-index: 1;

    border-radius: 20px;

    background: var(--line);
}


/* =========================================================
   PV -> HAUS
   ========================================================= */

/*
 * Start direkt unterhalb PV-Kreis.
 * Ende exakt an Oberkante Haus-Kreis.
 */

#linePV {
    width: 4px;

    left: var(--house-x);

    top: calc(
        var(--diagram-top)
        +
        41px
    );

    height: calc(
        var(--main-y)
        -
        41px
        -
        (var(--house-size) / 2)
    );

    transform: translateX(-50%);
}


/* =========================================================
   NETZ -> HAUS
   ========================================================= */

/*
 * Linie exakt auf Kreismitte.
 */

#lineGrid {
    height: 4px;

    top: calc(
        var(--diagram-top)
        +
        var(--main-y)
        -
        2px
    );

    left: calc(
        var(--grid-x)
        +
        (var(--icon-size) / 2)
    );

    right: calc(
        50%
        +
        (var(--house-size) / 2)
    );
}


/* =========================================================
   HAUS -> BATTERIE
   ========================================================= */

#lineBattery {
    height: 4px;

    top: calc(
        var(--diagram-top)
        +
        var(--main-y)
        -
        2px
    );

    left: calc(
        50%
        +
        (var(--house-size) / 2)
    );

    right: calc(
        100%
        -
        var(--battery-x)
        +
        (var(--icon-size) / 2)
    );
}


/* =========================================================
   ENERGIEPUNKTE
   ========================================================= */

.flowDot {
    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    opacity: 0;

    z-index: 4;

    pointer-events: none;

    box-shadow:
        0 0 6px currentColor,
        0 0 12px currentColor;
}


.flowDot.active {
    opacity: 1;
}


/* =========================================================
   PV-PUNKT
   ========================================================= */

#dotPV {
    left: calc(
        50%
        -
        5px
    );

    top: calc(
        var(--diagram-top)
        +
        41px
        -
        5px
    );

    color: var(--pv);

    background: var(--pv);
}


#dotPV.active {
    animation:
        pvFlow
        1.7s
        linear
        infinite;
}


@keyframes pvFlow {

    from {
        top: calc(
            var(--diagram-top)
            +
            41px
            -
            5px
        );
    }

    to {
        top: calc(
            var(--diagram-top)
            +
            var(--main-y)
            -
            (var(--house-size) / 2)
            -
            5px
        );
    }
}


/* =========================================================
   NETZ-PUNKT
   ========================================================= */

#dotGrid {
    top: calc(
        var(--diagram-top)
        +
        var(--main-y)
        -
        5px
    );
}


#dotGrid.import {
    animation:
        gridImport
        1.7s
        linear
        infinite;
}


#dotGrid.export {
    animation:
        gridExport
        1.7s
        linear
        infinite;
}


@keyframes gridImport {

    from {
        left: calc(
            var(--grid-x)
            +
            (var(--icon-size) / 2)
            -
            5px
        );
    }

    to {
        left: calc(
            50%
            -
            (var(--house-size) / 2)
            -
            5px
        );
    }
}


@keyframes gridExport {

    from {
        left: calc(
            50%
            -
            (var(--house-size) / 2)
            -
            5px
        );
    }

    to {
        left: calc(
            var(--grid-x)
            +
            (var(--icon-size) / 2)
            -
            5px
        );
    }
}


/* =========================================================
   BATTERIE-PUNKT
   ========================================================= */

#dotBattery {
    top: calc(
        var(--diagram-top)
        +
        var(--main-y)
        -
        5px
    );
}


#dotBattery.charge {
    animation:
        batteryCharge
        1.7s
        linear
        infinite;
}


#dotBattery.discharge {
    animation:
        batteryDischarge
        1.7s
        linear
        infinite;
}


@keyframes batteryCharge {

    from {
        left: calc(
            50%
            +
            (var(--house-size) / 2)
            -
            5px
        );
    }

    to {
        left: calc(
            var(--battery-x)
            -
            (var(--icon-size) / 2)
            -
            5px
        );
    }
}


@keyframes batteryDischarge {

    from {
        left: calc(
            var(--battery-x)
            -
            (var(--icon-size) / 2)
            -
            5px
        );
    }

    to {
        left: calc(
            50%
            +
            (var(--house-size) / 2)
            -
            5px
        );
    }
}


/* =========================================================
   BATTERIE SOC
   ========================================================= */

.socRow {
    width: 78px;

    margin: 5px auto 0;
}


.socTrack {
    width: 100%;
    height: 6px;

    overflow: hidden;

    border-radius: 20px;

    background: var(--line);
}


#batteryFill {
    width: 0;
    height: 100%;

    border-radius: 20px;

    background: var(--battery);

    transition: width 0.4s ease;
}


#socValue {
    margin-top: 3px;

    font-size: 9px;

    color: var(--text-muted);
}


/* =========================================================
   STATUSFARBEN
   ========================================================= */

.statusPV {
    color: var(--pv) !important;
}


.statusGrid {
    color: var(--grid) !important;
}


.statusBattery {
    color: var(--battery) !important;
}


/* =========================================================
   MITTLERE KACHELN
   ========================================================= */

@media (max-width: 700px) {

    :root {
        --diagram-top: 60px;

        --icon-size: 58px;
        --house-size: 64px;

        --main-y: 185px;

        --grid-x: 17%;
        --battery-x: 83%;
    }


    .energy {
        min-height: 300px;
    }


    .node {
        width: 105px;
    }


    .iconCircle svg {
        width: 25px;
        height: 25px;
    }


    .nodeValue {
        font-size: 17px;
    }


    .nodeTitle {
        font-size: 10px;
    }


    .nodeStatus {
        font-size: 8px;
    }


    .houseHalo {
        width: 80px;
        height: 80px;
    }


    #linePV {
        top: calc(
            var(--diagram-top)
            +
            38px
        );

        height: calc(
            var(--main-y)
            -
            38px
            -
            (var(--house-size) / 2)
        );
    }


    #dotPV {
        top: calc(
            var(--diagram-top)
            +
            38px
            -
            5px
        );
    }


    @keyframes pvFlow {

        from {
            top: calc(
                var(--diagram-top)
                +
                38px
                -
                5px
            );
        }

        to {
            top: calc(
                var(--diagram-top)
                +
                var(--main-y)
                -
                (var(--house-size) / 2)
                -
                5px
            );
        }
    }
}


/* =========================================================
   NATEL
   ========================================================= */

@media (max-width: 430px) {

    :root {
        --diagram-top: 54px;

        --icon-size: 50px;
        --house-size: 56px;

        --main-y: 165px;

        --grid-x: 17%;
        --battery-x: 83%;
    }


    .energy {
        min-height: 275px;
    }


    .node {
        width: 88px;
    }


    .iconCircle svg {
        width: 22px;
        height: 22px;
    }


    .nodeTitle {
        margin-top: 4px;

        font-size: 9px;
    }


    .nodeValue {
        font-size: 15px;
    }


    .nodeStatus {
        font-size: 8px;
    }


    .socRow {
        width: 58px;

        margin-top: 4px;
    }


    .houseHalo {
        width: 70px;
        height: 70px;
    }


    #linePV {
        top: calc(
            var(--diagram-top)
            +
            34px
        );

        height: calc(
            var(--main-y)
            -
            34px
            -
            (var(--house-size) / 2)
        );
    }


    #dotPV {
        top: calc(
            var(--diagram-top)
            +
            34px
            -
            5px
        );
    }


    @keyframes pvFlow {

        from {
            top: calc(
                var(--diagram-top)
                +
                34px
                -
                5px
            );
        }

        to {
            top: calc(
                var(--diagram-top)
                +
                var(--main-y)
                -
                (var(--house-size) / 2)
                -
                5px
            );
        }
    }
}


/* =========================================================
   SEHR SCHMALES NATEL
   ========================================================= */

@media (max-width: 350px) {

    :root {
        --diagram-top: 50px;

        --icon-size: 46px;
        --house-size: 52px;

        --main-y: 155px;

        --grid-x: 18%;
        --battery-x: 82%;
    }


    .node {
        width: 76px;
    }


    .nodeValue {
        font-size: 14px;
    }


    .nodeTitle {
        font-size: 8px;
    }


    .nodeStatus {
        font-size: 7px;
    }


    .iconCircle svg {
        width: 20px;
        height: 20px;
    }
}

</style>
</head>


<body>

<div class="energy">


    <!-- GRAUE ENERGIEWEGE -->

    <div
        class="flowLine"
        id="linePV"
    ></div>

    <div
        class="flowLine"
        id="lineGrid"
    ></div>

    <div
        class="flowLine"
        id="lineBattery"
    ></div>


    <!-- FARBIGE ENERGIEPUNKTE -->

    <div
        class="flowDot"
        id="dotPV"
    ></div>

    <div
        class="flowDot"
        id="dotGrid"
    ></div>

    <div
        class="flowDot"
        id="dotBattery"
    ></div>


    <div class="houseHalo"></div>


    <!-- =====================================================
         PV
         ===================================================== -->

    <div
        class="node"
        id="pv"
    >

        <!-- Text bewusst OBERHALB des PV-Kreises -->

        <div class="pvTextBlock">

            <div class="nodeTitle">
                PV-Anlage
            </div>

            <div
                class="nodeValue"
                id="pvValue"
            >
                -- kW
            </div>

            <div
                class="nodeStatus"
                id="pvStatus"
            >
                -
            </div>

        </div>


        <div class="iconCircle iconPV">

            <svg viewBox="0 0 24 24">

                <circle
                    cx="12"
                    cy="12"
                    r="4"
                ></circle>

                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>

                <path d="M4.93 4.93l1.41 1.41"></path>
                <path d="M17.66 17.66l1.41 1.41"></path>

                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>

                <path d="M4.93 19.07l1.41-1.41"></path>
                <path d="M17.66 6.34l1.41-1.41"></path>

            </svg>

        </div>

    </div>


    <!-- =====================================================
         NETZ
         ===================================================== -->

    <div
        class="node"
        id="grid"
    >

        <div class="iconCircle iconGrid">

            <svg viewBox="0 0 24 24">

                <path d="M4 9h16"></path>
                <path d="M4 15h16"></path>

                <path d="M7 6l-3 3 3 3"></path>
                <path d="M17 12l3 3-3 3"></path>

            </svg>

        </div>


        <div class="nodeTitle">
            Stromnetz
        </div>


        <div
            class="nodeValue"
            id="gridValue"
        >
            -- kW
        </div>


        <div
            class="nodeStatus"
            id="gridMode"
        >
            -
        </div>

    </div>


    <!-- =====================================================
         HAUS
         ===================================================== -->

    <div
        class="node"
        id="house"
    >

        <div class="iconCircle iconHouse">

            <svg viewBox="0 0 24 24">

                <path d="M3 11.5L12 4l9 7.5"></path>

                <path d="M5.5 10v9h13v-9"></path>

                <path d="M9.5 19v-5h5v5"></path>

            </svg>

        </div>


        <div class="nodeTitle">
            Haus
        </div>


        <div
            class="nodeValue"
            id="houseValue"
        >
            -- kW
        </div>


        <div class="nodeStatus">
            Verbrauch
        </div>

    </div>


    <!-- =====================================================
         BATTERIE
         ===================================================== -->

    <div
        class="node"
        id="battery"
    >

        <div class="iconCircle iconBattery">

            <svg viewBox="0 0 24 24">

                <rect
                    x="4"
                    y="7"
                    width="15"
                    height="10"
                    rx="2"
                ></rect>

                <path d="M19 10h2v4h-2"></path>

                <path d="M8 12h7"></path>

            </svg>

        </div>


        <div class="nodeTitle">
            Batterie
        </div>


        <div
            class="nodeValue"
            id="batteryValue"
        >
            -- kW
        </div>


        <div
            class="nodeStatus"
            id="batteryMode"
        >
            -
        </div>


        <div class="socRow">

            <div class="socTrack">

                <div
                    id="batteryFill"
                ></div>

            </div>


            <div id="socValue">
                -- %
            </div>

        </div>

    </div>

</div>


<script>


function kw(value)
{
    return (
        Number(
            value || 0
        ).toFixed(1)
        +
        " kW"
    );
}


function handleMessage(data)
{
    if (!data) {
        return;
    }


    if (
        typeof data === "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            console.error(
                "EnergyFlowLive JSON Fehler:",
                error,
                data
            );

            return;
        }
    }


    const pv =
        Number(
            data.pv || 0
        );


    const house =
        Number(
            data.house || 0
        );


    const gridImport =
        Number(
            data.gridImport || 0
        );


    const gridExport =
        Number(
            data.gridExport || 0
        );


    const batteryCharge =
        Number(
            data.batteryCharge || 0
        );


    const batteryDischarge =
        Number(
            data.batteryDischarge || 0
        );


    const soc =
        Number(
            data.soc || 0
        );


    /* =====================================================
       WERTE
       ===================================================== */

    document
        .getElementById(
            "pvValue"
        )
        .textContent =
            kw(
                pv
            );


    document
        .getElementById(
            "houseValue"
        )
        .textContent =
            kw(
                house
            );


    document
        .getElementById(
            "socValue"
        )
        .textContent =
            soc.toFixed(0)
            +
            " %";


    document
        .getElementById(
            "batteryFill"
        )
        .style.width =
            Math.max(
                0,
                Math.min(
                    100,
                    soc
                )
            )
            +
            "%";


    /* =====================================================
       PV
       ===================================================== */

    const dotPV =
        document.getElementById(
            "dotPV"
        );


    const pvStatus =
        document.getElementById(
            "pvStatus"
        );


    if (
        pv > 0.05
    ) {

        dotPV.style.background =
            "var(--pv)";


        dotPV.style.color =
            "var(--pv)";


        dotPV.className =
            "flowDot active";


        pvStatus.textContent =
            "Produktion";


        pvStatus.className =
            "nodeStatus statusPV";

    } else {

        dotPV.className =
            "flowDot";


        pvStatus.textContent =
            "kein Ertrag";


        pvStatus.className =
            "nodeStatus";
    }


    /* =====================================================
       NETZ
       ===================================================== */

    const dotGrid =
        document.getElementById(
            "dotGrid"
        );


    const gridValue =
        document.getElementById(
            "gridValue"
        );


    const gridMode =
        document.getElementById(
            "gridMode"
        );


    if (
        gridImport > 0.05
    ) {

        gridValue.textContent =
            kw(
                gridImport
            );


        gridMode.textContent =
            "Netzbezug";


        gridMode.className =
            "nodeStatus statusGrid";


        dotGrid.style.background =
            "var(--grid)";


        dotGrid.style.color =
            "var(--grid)";


        dotGrid.className =
            "flowDot active import";

    }

    else if (
        gridExport > 0.05
    ) {

        gridValue.textContent =
            kw(
                gridExport
            );


        gridMode.textContent =
            "Einspeisung";


        gridMode.className =
            "nodeStatus statusPV";


        dotGrid.style.background =
            "var(--pv)";


        dotGrid.style.color =
            "var(--pv)";


        dotGrid.className =
            "flowDot active export";

    }

    else {

        gridValue.textContent =
            "0.0 kW";


        gridMode.textContent =
            "kein Austausch";


        gridMode.className =
            "nodeStatus";


        dotGrid.className =
            "flowDot";
    }


    /* =====================================================
       BATTERIE
       ===================================================== */

    const dotBattery =
        document.getElementById(
            "dotBattery"
        );


    const batteryValue =
        document.getElementById(
            "batteryValue"
        );


    const batteryMode =
        document.getElementById(
            "batteryMode"
        );


    if (
        batteryCharge > 0.05
    ) {

        batteryValue.textContent =
            kw(
                batteryCharge
            );


        batteryMode.textContent =
            "Laden";


        batteryMode.className =
            "nodeStatus statusPV";


        dotBattery.style.background =
            "var(--pv)";


        dotBattery.style.color =
            "var(--pv)";


        dotBattery.className =
            "flowDot active charge";

    }

    else if (
        batteryDischarge > 0.05
    ) {

        batteryValue.textContent =
            kw(
                batteryDischarge
            );


        batteryMode.textContent =
            "Entladen";


        batteryMode.className =
            "nodeStatus statusBattery";


        dotBattery.style.background =
            "var(--battery)";


        dotBattery.style.color =
            "var(--battery)";


        dotBattery.className =
            "flowDot active discharge";

    }

    else {

        batteryValue.textContent =
            "0.0 kW";


        batteryMode.textContent =
            "Standby";


        batteryMode.className =
            "nodeStatus";


        dotBattery.className =
            "flowDot";
    }
}


/* =========================================================
   INITIALWERTE
   ========================================================= */

window.addEventListener(
    "load",
    function ()
    {
        requestAction(
            "Refresh",
            true
        );
    }
);

</script>

</body>
</html>
