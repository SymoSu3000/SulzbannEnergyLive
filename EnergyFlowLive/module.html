<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

:root {
    --pv: #35b657;
    --grid: #f29a38;
    --battery: #23b8c7;

    --text: #202020;
    --text-muted: rgba(32, 32, 32, 0.72);

    --line: rgba(110, 110, 110, 0.30);
    --circle: rgba(110, 110, 110, 0.46);
    --halo: rgba(110, 110, 110, 0.04);
}


/* =========================================================
   DARK MODE
   ========================================================= */

@media (prefers-color-scheme: dark) {

    :root {
        --text: #f2f2f2;
        --text-muted: rgba(242, 242, 242, 0.78);

        --line: rgba(220, 220, 220, 0.30);
        --circle: rgba(220, 220, 220, 0.50);
        --halo: rgba(255, 255, 255, 0.045);
    }
}


/* =========================================================
   BASIS
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


/* =========================================================
   VIEWPORT
   ========================================================= */

/*
 * Diese Fläche entspricht immer der tatsächlich verfügbaren
 * Fläche innerhalb der Symcon-Kachel.
 */

#energyViewport {
    position: relative;

    width: 100%;
    height: 100%;

    min-height: 250px;

    overflow: hidden;
}


/* =========================================================
   FESTES KOORDINATENSYSTEM
   ========================================================= */

/*
 * Die komplette Energie-Grafik wird in einem festen
 * 600 x 340 Koordinatensystem gezeichnet.
 *
 * JavaScript skaliert anschließend die GANZE Grafik
 * automatisch passend zur Kachel.
 *
 * Dadurch bleiben:
 *
 * - Kreise
 * - Linien
 * - Punkte
 * - Texte
 *
 * immer exakt zueinander ausgerichtet.
 */

#energyStage {
    position: absolute;

    width: 600px;
    height: 340px;

    left: 50%;
    top: 50%;

    transform-origin: center center;

    color: var(--text);
}


/* =========================================================
   KREISPOSITIONEN
   ========================================================= */

.circleNode {
    position: absolute;

    transform: translate(-50%, -50%);

    z-index: 10;
}


/*
 * PV
 */

#pvCircleNode {
    left: 300px;
    top: 105px;
}


/*
 * Stromnetz
 */

#gridCircleNode {
    left: 120px;
    top: 235px;
}


/*
 * Haus
 */

#houseCircleNode {
    left: 300px;
    top: 235px;
}


/*
 * Batterie
 */

#batteryCircleNode {
    left: 480px;
    top: 235px;
}


/* =========================================================
   ICON-KREISE
   ========================================================= */

.iconCircle {
    width: 66px;
    height: 66px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border:
        2px solid
        var(--circle);

    background:
        var(--halo);
}


.iconCircle svg {
    width: 30px;
    height: 30px;

    stroke: currentColor;

    stroke-width: 1.8;

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;
}


.iconPV {
    color: var(--pv);

    border-color:
        var(--pv);
}


.iconGrid {
    color: var(--grid);

    border-color:
        var(--grid);
}


.iconBattery {
    color: var(--battery);

    border-color:
        var(--battery);
}


.iconHouse {
    width: 72px;
    height: 72px;

    color: var(--text);

    border-color:
        var(--circle);

    background:
        var(--halo);
}


/* =========================================================
   HAUS HALO
   ========================================================= */

.houseHalo {
    position: absolute;

    left: 300px;
    top: 235px;

    width: 92px;
    height: 92px;

    transform:
        translate(
            -50%,
            -50%
        );

    border-radius: 50%;

    background:
        var(--halo);

    z-index: 0;
}


/* =========================================================
   BESCHRIFTUNGEN
   ========================================================= */

.labelBlock {
    position: absolute;

    width: 150px;

    transform:
        translateX(
            -50%
        );

    text-align: center;

    z-index: 20;
}


/*
 * PV-Beschriftung
 */

#pvText {
    left: 300px;
    top: 18px;
}


/*
 * Untere Beschriftungen
 */

#gridText {
    left: 120px;
    top: 276px;
}


#houseText {
    left: 300px;
    top: 279px;
}


#batteryText {
    left: 480px;
    top: 276px;
}


/* =========================================================
   TEXTGRÖSSEN
   ========================================================= */

/*
 * Bewusst größer als bisher.
 */

.nodeTitle {
    margin: 0;

    font-size: 14px;
    line-height: 1.2;

    font-weight: 500;

    color:
        var(--text-muted);
}


.nodeValue {
    margin-top: 2px;

    font-size: 22px;
    line-height: 1.1;

    font-weight: 650;

    white-space: nowrap;

    color:
        var(--text);
}


.nodeStatus {
    min-height: 16px;

    margin-top: 4px;

    font-size: 12px;
    line-height: 1.15;

    color:
        var(--text-muted);
}


/* =========================================================
   STATUSFARBEN
   ========================================================= */

.statusPV {
    color:
        var(--pv)
        !important;
}


.statusGrid {
    color:
        var(--grid)
        !important;
}


.statusBattery {
    color:
        var(--battery)
        !important;
}


/* =========================================================
   BATTERIE SOC
   ========================================================= */

.socRow {
    width: 86px;

    margin:
        7px auto 0;
}


.socTrack {
    width: 100%;
    height: 7px;

    overflow: hidden;

    border-radius: 20px;

    background:
        var(--line);
}


#batteryFill {
    width: 0;
    height: 100%;

    border-radius: 20px;

    background:
        var(--battery);

    transition:
        width
        0.4s
        ease;
}


#socValue {
    margin-top: 4px;

    font-size: 11px;

    color:
        var(--text-muted);
}


/* =========================================================
   GRAUE LINIEN
   ========================================================= */

.flowLine {
    position: absolute;

    z-index: 1;

    border-radius: 20px;

    background:
        var(--line);
}


/*
 * PV -> Haus
 *
 * PV-Kreis:
 * Mittelpunkt y = 105
 * Radius = 33
 *
 * Start = 138
 *
 * Haus-Kreis:
 * Mittelpunkt y = 235
 * Radius = 36
 *
 * Ende = 199
 */

#linePV {
    left: 298px;
    top: 138px;

    width: 4px;
    height: 61px;
}


/*
 * Stromnetz -> Haus
 *
 * Netz rechts:
 * 120 + 33 = 153
 *
 * Haus links:
 * 300 - 36 = 264
 */

#lineGrid {
    left: 153px;
    top: 233px;

    width: 111px;
    height: 4px;
}


/*
 * Haus -> Batterie
 *
 * Haus rechts:
 * 300 + 36 = 336
 *
 * Batterie links:
 * 480 - 33 = 447
 */

#lineBattery {
    left: 336px;
    top: 233px;

    width: 111px;
    height: 4px;
}


/* =========================================================
   ENERGIEPUNKTE
   ========================================================= */

.flowDot {
    position: absolute;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    opacity: 0;

    z-index: 5;

    pointer-events: none;

    box-shadow:
        0 0 7px currentColor,
        0 0 14px currentColor;
}


.flowDot.active {
    opacity: 1;
}


/* =========================================================
   PV-PUNKT
   ========================================================= */

#dotPV {
    left: 294.5px;
    top: 133px;

    color: var(--pv);
    background: var(--pv);
}


#dotPV.active {
    animation:
        pvFlow
        1.7s
        linear
        infinite;
}


@keyframes pvFlow {

    from {
        top: 133px;
    }

    to {
        top: 194px;
    }
}


/* =========================================================
   NETZ-PUNKT
   ========================================================= */

#dotGrid {
    top: 229.5px;
}


#dotGrid.import {
    animation:
        gridImport
        1.7s
        linear
        infinite;
}


#dotGrid.export {
    animation:
        gridExport
        1.7s
        linear
        infinite;
}


@keyframes gridImport {

    from {
        left: 148px;
    }

    to {
        left: 259px;
    }
}


@keyframes gridExport {

    from {
        left: 259px;
    }

    to {
        left: 148px;
    }
}


/* =========================================================
   BATTERIE-PUNKT
   ========================================================= */

#dotBattery {
    top: 229.5px;
}


#dotBattery.charge {
    animation:
        batteryCharge
        1.7s
        linear
        infinite;
}


#dotBattery.discharge {
    animation:
        batteryDischarge
        1.7s
        linear
        infinite;
}


@keyframes batteryCharge {

    from {
        left: 331px;
    }

    to {
        left: 442px;
    }
}


@keyframes batteryDischarge {

    from {
        left: 442px;
    }

    to {
        left: 331px;
    }
}

</style>
</head>


<body>

<div id="energyViewport">

    <div id="energyStage">


        <!-- =================================================
             GRAUE ENERGIEWEGE
             ================================================= -->

        <div
            class="flowLine"
            id="linePV"
        ></div>

        <div
            class="flowLine"
            id="lineGrid"
        ></div>

        <div
            class="flowLine"
            id="lineBattery"
        ></div>


        <!-- =================================================
             FARBIGE ENERGIEPUNKTE
             ================================================= -->

        <div
            class="flowDot"
            id="dotPV"
        ></div>

        <div
            class="flowDot"
            id="dotGrid"
        ></div>

        <div
            class="flowDot"
            id="dotBattery"
        ></div>


        <!-- HALO -->

        <div class="houseHalo"></div>


        <!-- =================================================
             PV TEXT
             ================================================= -->

        <div
            class="labelBlock"
            id="pvText"
        >

            <div class="nodeTitle">
                PV-Anlage
            </div>

            <div
                class="nodeValue"
                id="pvValue"
            >
                -- kW
            </div>

            <div
                class="nodeStatus"
                id="pvStatus"
            >
                -
            </div>

        </div>


        <!-- =================================================
             PV KREIS
             ================================================= -->

        <div
            class="circleNode"
            id="pvCircleNode"
        >

            <div class="iconCircle iconPV">

                <svg viewBox="0 0 24 24">

                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                    ></circle>

                    <path d="M12 2v2"></path>
                    <path d="M12 20v2"></path>

                    <path d="M4.93 4.93l1.41 1.41"></path>
                    <path d="M17.66 17.66l1.41 1.41"></path>

                    <path d="M2 12h2"></path>
                    <path d="M20 12h2"></path>

                    <path d="M4.93 19.07l1.41-1.41"></path>
                    <path d="M17.66 6.34l1.41-1.41"></path>

                </svg>

            </div>

        </div>


        <!-- =================================================
             NETZ KREIS
             ================================================= -->

        <div
            class="circleNode"
            id="gridCircleNode"
        >

            <div class="iconCircle iconGrid">

                <svg viewBox="0 0 24 24">

                    <path d="M4 9h16"></path>
                    <path d="M4 15h16"></path>

                    <path d="M7 6l-3 3 3 3"></path>
                    <path d="M17 12l3 3-3 3"></path>

                </svg>

            </div>

        </div>


        <!-- NETZ TEXT -->

        <div
            class="labelBlock"
            id="gridText"
        >

            <div class="nodeTitle">
                Stromnetz
            </div>

            <div
                class="nodeValue"
                id="gridValue"
            >
                -- kW
            </div>

            <div
                class="nodeStatus"
                id="gridMode"
            >
                -
            </div>

        </div>


        <!-- =================================================
             HAUS KREIS
             ================================================= -->

        <div
            class="circleNode"
            id="houseCircleNode"
        >

            <div class="iconCircle iconHouse">

                <svg viewBox="0 0 24 24">

                    <path d="M3 11.5L12 4l9 7.5"></path>

                    <path d="M5.5 10v9h13v-9"></path>

                    <path d="M9.5 19v-5h5v5"></path>

                </svg>

            </div>

        </div>


        <!-- HAUS TEXT -->

        <div
            class="labelBlock"
            id="houseText"
        >

            <div class="nodeTitle">
                Haus
            </div>

            <div
                class="nodeValue"
                id="houseValue"
            >
                -- kW
            </div>

            <div class="nodeStatus">
                Verbrauch
            </div>

        </div>


        <!-- =================================================
             BATTERIE KREIS
             ================================================= -->

        <div
            class="circleNode"
            id="batteryCircleNode"
        >

            <div class="iconCircle iconBattery">

                <svg viewBox="0 0 24 24">

                    <rect
                        x="4"
                        y="7"
                        width="15"
                        height="10"
                        rx="2"
                    ></rect>

                    <path d="M19 10h2v4h-2"></path>

                    <path d="M8 12h7"></path>

                </svg>

            </div>

        </div>


        <!-- BATTERIE TEXT -->

        <div
            class="labelBlock"
            id="batteryText"
        >

            <div class="nodeTitle">
                Batterie
            </div>

            <div
                class="nodeValue"
                id="batteryValue"
            >
                -- kW
            </div>

            <div
                class="nodeStatus"
                id="batteryMode"
            >
                -
            </div>


            <div class="socRow">

                <div class="socTrack">

                    <div
                        id="batteryFill"
                    ></div>

                </div>

                <div id="socValue">
                    -- %
                </div>

            </div>

        </div>

    </div>

</div>


<script>


/* =========================================================
   DYNAMISCHE SKALIERUNG
   ========================================================= */

function resizeEnergyStage()
{
    const viewport =
        document.getElementById(
            "energyViewport"
        );


    const stage =
        document.getElementById(
            "energyStage"
        );


    if (
        !viewport ||
        !stage
    ) {
        return;
    }


    const availableWidth =
        viewport.clientWidth;


    const availableHeight =
        viewport.clientHeight;


    /*
     * Kleine Sicherheitsabstände:
     *
     * horizontal 12 px
     * vertikal   10 px
     */

    const scaleX =
        Math.max(
            0.1,
            (
                availableWidth
                -
                12
            )
            /
            600
        );


    const scaleY =
        Math.max(
            0.1,
            (
                availableHeight
                -
                10
            )
            /
            340
        );


    /*
     * Ganze Grafik proportional skalieren.
     */

    let scale =
        Math.min(
            scaleX,
            scaleY
        );


    /*
     * Auf großen Kacheln nicht extrem aufblasen.
     */

    scale =
        Math.min(
            scale,
            1.20
        );


    stage.style.transform =
        "translate(-50%, -50%) scale("
        +
        scale
        +
        ")";
}


/*
 * Reagiert automatisch auf Größenänderungen
 * der Symcon-Kachel.
 */

const resizeObserver =
    new ResizeObserver(
        function ()
        {
            resizeEnergyStage();
        }
    );


window.addEventListener(
    "load",
    function ()
    {
        const viewport =
            document.getElementById(
                "energyViewport"
            );


        if (viewport) {
            resizeObserver.observe(
                viewport
            );
        }


        resizeEnergyStage();


        requestAction(
            "Refresh",
            true
        );
    }
);


/* =========================================================
   HELFER
   ========================================================= */

function kw(value)
{
    return (
        Number(
            value || 0
        ).toFixed(1)
        +
        " kW"
    );
}


/* =========================================================
   LIVE-WERTE
   ========================================================= */

function handleMessage(data)
{
    if (!data) {
        return;
    }


    if (
        typeof data === "string"
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            console.error(
                "EnergyFlowLive JSON Fehler:",
                error,
                data
            );

            return;
        }
    }


    const pv =
        Number(
            data.pv || 0
        );


    const house =
        Number(
            data.house || 0
        );


    const gridImport =
        Number(
            data.gridImport || 0
        );


    const gridExport =
        Number(
            data.gridExport || 0
        );


    const batteryCharge =
        Number(
            data.batteryCharge || 0
        );


    const batteryDischarge =
        Number(
            data.batteryDischarge || 0
        );


    const soc =
        Number(
            data.soc || 0
        );


    /* =====================================================
       HAUPTWERTE
       ===================================================== */

    document
        .getElementById(
            "pvValue"
        )
        .textContent =
            kw(
                pv
            );


    document
        .getElementById(
            "houseValue"
        )
        .textContent =
            kw(
                house
            );


    document
        .getElementById(
            "socValue"
        )
        .textContent =
            soc.toFixed(0)
            +
            " %";


    document
        .getElementById(
            "batteryFill"
        )
        .style.width =
            Math.max(
                0,
                Math.min(
                    100,
                    soc
                )
            )
            +
            "%";


    /* =====================================================
       PV
       ===================================================== */

    const dotPV =
        document.getElementById(
            "dotPV"
        );


    const pvStatus =
        document.getElementById(
            "pvStatus"
        );


    if (
        pv > 0.05
    ) {

        dotPV.style.background =
            "var(--pv)";


        dotPV.style.color =
            "var(--pv)";


        dotPV.className =
            "flowDot active";


        pvStatus.textContent =
            "Produktion";


        pvStatus.className =
            "nodeStatus statusPV";

    } else {

        dotPV.className =
            "flowDot";


        pvStatus.textContent =
            "kein Ertrag";


        pvStatus.className =
            "nodeStatus";
    }


    /* =====================================================
       NETZ
       ===================================================== */

    const dotGrid =
        document.getElementById(
            "dotGrid"
        );


    const gridValue =
        document.getElementById(
            "gridValue"
        );


    const gridMode =
        document.getElementById(
            "gridMode"
        );


    if (
        gridImport > 0.05
    ) {

        gridValue.textContent =
            kw(
                gridImport
            );


        gridMode.textContent =
            "Netzbezug";


        gridMode.className =
            "nodeStatus statusGrid";


        dotGrid.style.background =
            "var(--grid)";


        dotGrid.style.color =
            "var(--grid)";


        dotGrid.className =
            "flowDot active import";

    }

    else if (
        gridExport > 0.05
    ) {

        gridValue.textContent =
            kw(
                gridExport
            );


        gridMode.textContent =
            "Einspeisung";


        gridMode.className =
            "nodeStatus statusPV";


        dotGrid.style.background =
            "var(--pv)";


        dotGrid.style.color =
            "var(--pv)";


        dotGrid.className =
            "flowDot active export";

    }

    else {

        gridValue.textContent =
            "0.0 kW";


        gridMode.textContent =
            "kein Austausch";


        gridMode.className =
            "nodeStatus";


        dotGrid.className =
            "flowDot";
    }


    /* =====================================================
       BATTERIE
       ===================================================== */

    const dotBattery =
        document.getElementById(
            "dotBattery"
        );


    const batteryValue =
        document.getElementById(
            "batteryValue"
        );


    const batteryMode =
        document.getElementById(
            "batteryMode"
        );


    if (
        batteryCharge > 0.05
    ) {

        batteryValue.textContent =
            kw(
                batteryCharge
            );


        batteryMode.textContent =
            "Laden";


        batteryMode.className =
            "nodeStatus statusPV";


        dotBattery.style.background =
            "var(--pv)";


        dotBattery.style.color =
            "var(--pv)";


        dotBattery.className =
            "flowDot active charge";

    }

    else if (
        batteryDischarge > 0.05
    ) {

        batteryValue.textContent =
            kw(
                batteryDischarge
            );


        batteryMode.textContent =
            "Entladen";


        batteryMode.className =
            "nodeStatus statusBattery";


        dotBattery.style.background =
            "var(--battery)";


        dotBattery.style.color =
            "var(--battery)";


        dotBattery.className =
            "flowDot active discharge";

    }

    else {

        batteryValue.textContent =
            "0.0 kW";


        batteryMode.textContent =
            "Standby";


        batteryMode.className =
            "nodeStatus";


        dotBattery.className =
            "flowDot";
    }
}

</script>

</body>
</html>
