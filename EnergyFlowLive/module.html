<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<style>

    :root {

        color-scheme: light dark;

        --pv: #42cf63;
        --grid: #f5aa2a;
        --battery: #36a7ff;
        --house: #18c3c8;
        --neutral: #8b949e;

        --foreground:
            var(
                --content-color,
                #202020
            );

        --base-line:
            rgba(
                175,
                181,
                188,
                .62
            );
    }


    * {
        box-sizing: border-box;
    }


    html,
    body {

        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: transparent;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Arial,
            sans-serif;

        color:
            var(--foreground);
    }


    #energyWrap {

        width: 100%;
        height: 100%;

        color:
            var(--foreground);
    }


    svg {

        display: block;

        width: 100%;
        height: 100%;

        color:
            var(--foreground);
    }


    /* ================================================================ */
    /* Verbindungslinien                                                */
    /* ================================================================ */

    .base-line {

        fill: none;

        stroke:
            var(--base-line);

        stroke-width:
            3.0;

        stroke-linecap:
            round;

        opacity:
            1;
    }


    /* ================================================================ */
    /* Kreise                                                           */
    /* ================================================================ */

    .node-base {

        fill:
            rgba(
                128,
                128,
                128,
                .025
            );

        stroke:
            var(--neutral);

        stroke-width:
            3;
    }


    .ring {

        fill:
            none;

        stroke-width:
            4;

        stroke-linecap:
            butt;

        transform-box:
            fill-box;

        transform-origin:
            center;

        transform:
            rotate(-90deg);
    }


    .ring-pv {
        stroke: var(--pv);
    }


    .ring-grid {
        stroke: var(--grid);
    }


    .ring-battery {
        stroke: var(--battery);
    }


    .ring-neutral {
        stroke: var(--neutral);
    }


    /* ================================================================ */
    /* Beschriftungen                                                   */
    /* ================================================================ */

    .node-title {

        font-size:
            26px;

        font-weight:
            650;

        fill:
            var(--foreground);
    }


    .node-value {

        font-size:
            27px;

        font-weight:
            760;

        fill:
            var(--foreground);
    }


    .pv-value {
        fill: var(--pv);
    }


    .grid-value {
        fill: var(--grid);
    }


    .battery-value {
        fill: var(--battery);
    }


    .node-sub {

        font-size:
            20px;

        fill:
            var(--foreground);

        opacity:
            .76;
    }


    .node-sub-small {

        font-size:
            17px;

        fill:
            var(--foreground);

        opacity:
            .70;
    }


    .weather-text {

        font-size:
            18px;

        fill:
            var(--foreground);

        opacity:
            .76;
    }


    /* ================================================================ */
    /* Icons                                                            */
    /* ================================================================ */

    .icon-line {

        fill:
            none;

        stroke:
            var(--foreground);

        stroke-width:
            5;

        stroke-linecap:
            round;

        stroke-linejoin:
            round;
    }


    .house-icon {

        stroke:
            var(--house);

        stroke-width:
            8;
    }


    .weather-main {

        font-size:
            44px;

        text-anchor:
            middle;

        dominant-baseline:
            middle;
    }


    .weather-main.moon {

        font-size:
            52px;
    }


    /* ================================================================ */
    /* Punkte                                                           */
    /* ================================================================ */

    .flow-dot {

        r:
            6;

        pointer-events:
            none;
    }


    /* ================================================================ */
    /* Batterie                                                         */
    /* ================================================================ */

    .battery-fill-bg {

        fill:
            rgba(
                128,
                128,
                128,
                .18
            );
    }


    .battery-fill {

        fill:
            var(--battery);
    }


    /* ================================================================ */
    /* Dark                                                             */
    /* ================================================================ */

    @media (prefers-color-scheme: dark) {

        :root {

            --foreground:
                var(
                    --content-color,
                    #f3f5f7
                );

            --base-line:
                rgba(
                    205,
                    211,
                    217,
                    .58
                );
        }
    }


    /* ================================================================ */
    /* Light                                                            */
    /* ================================================================ */

    @media (prefers-color-scheme: light) {

        :root {

            --foreground:
                var(
                    --content-color,
                    #202124
                );

            --base-line:
                rgba(
                    75,
                    80,
                    86,
                    .55
                );
        }
    }


    /* ================================================================ */
    /* Mobile                                                           */
    /* ================================================================ */

    @media (max-width: 700px) {

        .node-value {

            font-size:
                30px;
        }


        .node-sub {

            font-size:
                24px;

            font-weight:
                500;

            opacity:
                .86;
        }


        .node-sub-small {

            font-size:
                21px;

            font-weight:
                500;

            opacity:
                .82;
        }


        .weather-text {

            font-size:
                22px;

            font-weight:
                500;

            opacity:
                .86;
        }


        .weather-main {

            font-size:
                46px;
        }


        .weather-main.moon {

            font-size:
                55px;
        }
    }


    /* ================================================================ */
    /* Sehr schmales Mobile                                             */
    /* ================================================================ */

    @media (max-width: 430px) {

        .node-sub {

            font-size:
                23px;
        }


        .node-sub-small {

            font-size:
                20px;
        }


        .weather-text {

            font-size:
                21px;
        }


        .weather-main.moon {

            font-size:
                54px;
        }
    }


    @media (prefers-reduced-motion: reduce) {

        .flow-dot {

            display:
                none !important;
        }
    }

</style>

</head>

<script>

'use strict';


// ============================================================================
// Farben
// ============================================================================

const COLORS = {

    pv:
        '#42cf63',

    grid:
        '#f5aa2a',

    battery:
        '#36a7ff',

    neutral:
        '#8b949e'
};


// ============================================================================
// Zustand
// ============================================================================

const state = {

    values: {

        pv: 0,

        gridImport: 0,
        gridExport: 0,
        gridState: 'idle',

        batteryCharge: 0,
        batteryDischarge: 0,
        batteryState: 'idle',

        house: 0,

        houseFromPV: 0,
        houseFromBattery: 0,
        houseFromGrid: 0,

        pvToHouse: 0,
        pvToBattery: 0,
        pvToGrid: 0,

        soc: 0,

        tempWR: 0,
        tempBattery: 0,

        voltage: 0,
        frequency: 0,

        weatherID: 0,
        weatherIcon: '',

        clouds: 0,

        rain: false
    }
};


// ============================================================================
// Flüsse
// ============================================================================

const flows = {

    pv: {

        path: null,
        dots: [],
        phase: 0,
        power: 0,
        direction: 1,

        colors: [
            COLORS.pv
        ]
    },


    grid: {

        path: null,
        dots: [],
        phase: 0,
        power: 0,
        direction: 1,

        colors: [
            COLORS.grid
        ]
    },


    consumer: {

        path: null,
        dots: [],
        phase: 0,
        power: 0,
        direction: 1,

        colors: [
            COLORS.pv
        ]
    },


    battery: {

        path: null,
        dots: [],
        phase: 0,
        power: 0,
        direction: 1,

        colors: [
            COLORS.pv
        ]
    }
};


const MAX_DOTS =
    6;


let lastFrameTime =
    performance.now();


// ============================================================================
// Initialisierung
// ============================================================================

function init()
{
    flows.pv.path =
        document.getElementById(
            'pathPV'
        );


    flows.grid.path =
        document.getElementById(
            'pathGrid'
        );


    flows.consumer.path =
        document.getElementById(
            'pathConsumer'
        );


    flows.battery.path =
        document.getElementById(
            'pathBattery'
        );


    createDotPool(
        'pv',
        'pvDots'
    );


    createDotPool(
        'grid',
        'gridDots'
    );


    createDotPool(
        'consumer',
        'consumerDots'
    );


    createDotPool(
        'battery',
        'batteryDots'
    );


    try {

        requestAction(
            'Refresh',
            true
        );

    } catch (e) {

    }


    requestAnimationFrame(
        animate
    );
}


// ============================================================================
// Punkt-Pool
// ============================================================================

function createDotPool(
    flowName,
    containerID
)
{
    const ns =
        'http://www.w3.org/2000/svg';


    const container =
        document.getElementById(
            containerID
        );


    for (
        let i = 0;
        i < MAX_DOTS;
        i++
    ) {

        const dot =
            document.createElementNS(
                ns,
                'circle'
            );


        dot.setAttribute(
            'class',
            'flow-dot'
        );


        dot.style.display =
            'none';


        container.appendChild(
            dot
        );


        flows[
            flowName
        ].dots.push(
            dot
        );
    }
}


// ============================================================================
// Nachricht von Symcon
// ============================================================================

function handleMessage(
    message
)
{
    let data =
        message;


    if (
        typeof data
        ===
        'string'
    ) {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (e) {

            return;
        }
    }


    if (
        !data
        ||
        data.type !== 'energy'
    ) {

        return;
    }


    Object.assign(
        state.values,
        data
    );


    updateTexts();

    updateRings();

    updateFlowTargets();
}


// ============================================================================
// Texte
// ============================================================================

function updateTexts()
{
    const v =
        state.values;


    setText(
        'pvValue',
        formatPower(
            v.pv
        )
    );


    setText(
        'pvTemp',

        '('
        +
        Number(
            v.tempWR
        ).toFixed(1)
        +
        ' °C)'
    );


    const weather =
        getWeather(
            v.weatherID,
            v.weatherIcon,
            v.rain,
            v.clouds
        );


    updateWeatherSymbol(
        weather.symbol
    );


    setText(
        'weatherText',
        weather.text
    );


    let gridPower =
        0;


    if (
        v.gridState === 'import'
    ) {

        gridPower =
            v.gridImport;

    } else if (
        v.gridState === 'export'
    ) {

        gridPower =
            v.gridExport;
    }


    setText(
        'gridValue',
        formatPower(
            gridPower
        )
    );


    const gridValueElement =
        document.getElementById(
            'gridValue'
        );


    if (
        gridValueElement
    ) {

        gridValueElement.style.fill =

            v.gridState === 'export'
                ?
                COLORS.pv
                :
                (
                    v.gridState === 'import'
                        ?
                        COLORS.grid
                        :
                        COLORS.neutral
                );
    }


    setText(
        'gridMode',

        v.gridState === 'import'
            ?
            'Netzbezug'
            :
            (
                v.gridState === 'export'
                    ?
                    'Einspeisung'
                    :
                    'Ruhe'
            )
    );


    setText(
        'gridInfo',
        formatGridInfo(
            v.voltage,
            v.frequency
        )
    );


    setText(
        'consumerValue',
        formatPower(
            v.house
        )
    );


    const dominantHouseColor =
        getDominantColor(
            v.houseFromPV,
            v.houseFromBattery,
            v.houseFromGrid
        );


    const consumerValue =
        document.getElementById(
            'consumerValue'
        );


    if (
        consumerValue
    ) {

        consumerValue.style.fill =
            dominantHouseColor;
    }


    let batteryPower =
        0;


    if (
        v.batteryState === 'charge'
    ) {

        batteryPower =
            v.batteryCharge;

    } else if (
        v.batteryState === 'discharge'
    ) {

        batteryPower =
            v.batteryDischarge;
    }


    setText(
        'batteryPower',
        formatPower(
            batteryPower
        )
    );


    setText(
        'batteryMode',

        v.batteryState === 'charge'
            ?
            'Laden'
            :
            (
                v.batteryState === 'discharge'
                    ?
                    'Entladen'
                    :
                    'Ruhe'
            )
    );


    setText(
        'batteryInfo',

        'SOC: '
        +
        Math.round(
            v.soc
        )
        +
        ' %'
        +
        ' · '
        +
        Number(
            v.tempBattery
        ).toFixed(1)
        +
        ' °C'
    );


    updateBatteryFill();
}


// ============================================================================
// Wettersymbol setzen
// ============================================================================

function updateWeatherSymbol(
    symbol
)
{
    const element =
        document.getElementById(
            'weatherSymbol'
        );


    if (
        !element
    ) {

        return;
    }


    element.textContent =
        symbol;


    if (
        symbol === '🌙'
    ) {

        element.classList.add(
            'moon'
        );

    } else {

        element.classList.remove(
            'moon'
        );
    }
}


// ============================================================================
// Ringfarben
// ============================================================================

function updateRings()
{
    const v =
        state.values;


    const gridRing =
        document.getElementById(
            'gridRing'
        );


    if (
        gridRing
    ) {

        if (
            v.gridState === 'export'
        ) {

            gridRing.style.stroke =
                COLORS.pv;

        } else if (
            v.gridState === 'import'
        ) {

            gridRing.style.stroke =
                COLORS.grid;

        } else {

            gridRing.style.stroke =
                COLORS.neutral;
        }
    }


    const batteryRing =
        document.getElementById(
            'batteryRing'
        );


    if (
        batteryRing
    ) {

        if (
            v.batteryState === 'charge'
        ) {

            batteryRing.style.stroke =
                COLORS.pv;

        } else if (
            v.batteryState === 'discharge'
        ) {

            batteryRing.style.stroke =
                COLORS.battery;

        } else {

            batteryRing.style.stroke =
                COLORS.neutral;
        }
    }


    drawSegmentedRing(
        'consumerRing',
        285,
        500,
        60,
        [
            {
                value:
                    v.houseFromPV,

                color:
                    COLORS.pv
            },

            {
                value:
                    v.houseFromBattery,

                color:
                    COLORS.battery
            },

            {
                value:
                    v.houseFromGrid,

                color:
                    COLORS.grid
            }
        ]
    );


    drawSegmentedRing(
        'houseRing',
        500,
        335,
        74,
        [
            {
                value:
                    v.houseFromPV,

                color:
                    COLORS.pv
            },

            {
                value:
                    v.houseFromBattery,

                color:
                    COLORS.battery
            },

            {
                value:
                    v.houseFromGrid,

                color:
                    COLORS.grid
            }
        ]
    );
}


// ============================================================================
// Segmentierter Kreis
// ============================================================================

function drawSegmentedRing(
    containerID,
    cx,
    cy,
    radius,
    segments
)
{
    const container =
        document.getElementById(
            containerID
        );


    if (
        !container
    ) {

        return;
    }


    while (
        container.firstChild
    ) {

        container.removeChild(
            container.firstChild
        );
    }


    const total =
        segments.reduce(
            (
                sum,
                segment
            ) =>
                sum
                +
                Math.max(
                    0,
                    Number(
                        segment.value
                    )
                    ||
                    0
                ),
            0
        );


    if (
        total <= 0
    ) {

        createRingSegment(
            container,
            cx,
            cy,
            radius,
            0,
            1,
            COLORS.neutral
        );

        return;
    }


    let start =
        0;


    for (
        const segment
        of
        segments
    ) {

        const value =
            Math.max(
                0,
                Number(
                    segment.value
                )
                ||
                0
            );


        if (
            value <= 0
        ) {

            continue;
        }


        const fraction =
            value
            /
            total;


        createRingSegment(
            container,
            cx,
            cy,
            radius,
            start,
            fraction,
            segment.color
        );


        start +=
            fraction;
    }
}


// ============================================================================
// Ringsegment
// ============================================================================

function createRingSegment(
    container,
    cx,
    cy,
    radius,
    startFraction,
    fraction,
    color
)
{
    const ns =
        'http://www.w3.org/2000/svg';


    const circle =
        document.createElementNS(
            ns,
            'circle'
        );


    const circumference =
        2
        *
        Math.PI
        *
        radius;


    circle.setAttribute(
        'cx',
        cx
    );


    circle.setAttribute(
        'cy',
        cy
    );


    circle.setAttribute(
        'r',
        radius
    );


    circle.setAttribute(
        'fill',
        'none'
    );


    circle.setAttribute(
        'stroke',
        color
    );


    circle.setAttribute(
        'stroke-width',
        '4'
    );


    circle.setAttribute(
        'stroke-dasharray',
        (
            circumference
            *
            fraction
        )
        +
        ' '
        +
        circumference
    );


    circle.setAttribute(
        'stroke-dashoffset',
        -(
            circumference
            *
            startFraction
        )
    );


    circle.setAttribute(
        'transform',
        'rotate(-90 '
        +
        cx
        +
        ' '
        +
        cy
        +
        ')'
    );


    container.appendChild(
        circle
    );
}


// ============================================================================
// Flüsse
// ============================================================================

function updateFlowTargets()
{
    const v =
        state.values;


    flows.pv.power =
        Math.max(
            0,
            Number(
                v.pv
            )
            ||
            0
        );


    flows.pv.direction =
        1;


    flows.pv.colors =
        [
            COLORS.pv
        ];


    if (
        v.gridState === 'import'
    ) {

        flows.grid.power =
            v.gridImport;


        flows.grid.direction =
            1;


        flows.grid.colors =
            [
                COLORS.grid
            ];

    } else if (
        v.gridState === 'export'
    ) {

        flows.grid.power =
            v.gridExport;


        flows.grid.direction =
            -1;


        flows.grid.colors =
            [
                COLORS.pv
            ];

    } else {

        flows.grid.power =
            0;
    }


    flows.consumer.power =
        Math.max(
            0,
            Number(
                v.house
            )
            ||
            0
        );


    flows.consumer.direction =
        1;


    flows.consumer.colors =
        createColorSequence(
            [
                {
                    value:
                        v.houseFromPV,

                    color:
                        COLORS.pv
                },

                {
                    value:
                        v.houseFromBattery,

                    color:
                        COLORS.battery
                },

                {
                    value:
                        v.houseFromGrid,

                    color:
                        COLORS.grid
                }
            ]
        );


    if (
        v.batteryState === 'charge'
    ) {

        flows.battery.power =
            v.batteryCharge;


        flows.battery.direction =
            1;


        flows.battery.colors =
            [
                COLORS.pv
            ];

    } else if (
        v.batteryState === 'discharge'
    ) {

        flows.battery.power =
            v.batteryDischarge;


        flows.battery.direction =
            -1;


        flows.battery.colors =
            [
                COLORS.battery
            ];

    } else {

        flows.battery.power =
            0;
    }
}


// ============================================================================
// Gemischte Quellenfarben
// ============================================================================

function createColorSequence(
    parts
)
{
    const valid =
        parts.filter(
            part =>
                Number(
                    part.value
                )
                >
                0
        );


    if (
        valid.length === 0
    ) {

        return [
            COLORS.neutral
        ];
    }


    const total =
        valid.reduce(
            (
                sum,
                part
            ) =>
                sum
                +
                Number(
                    part.value
                ),
            0
        );


    const slots =
        12;


    const sequence =
        [];


    const counters =
        valid.map(
            part => ({

                color:
                    part.color,

                target:
                    (
                        Number(
                            part.value
                        )
                        /
                        total
                    )
                    *
                    slots,

                used:
                    0
            })
        );


    for (
        let i = 0;
        i < slots;
        i++
    ) {

        let selected =
            counters[0];


        let bestScore =
            -Infinity;


        for (
            const counter
            of
            counters
        ) {

            const score =
                counter.target
                -
                counter.used;


            if (
                score
                >
                bestScore
            ) {

                bestScore =
                    score;


                selected =
                    counter;
            }
        }


        sequence.push(
            selected.color
        );


        selected.used++;
    }


    return sequence;
}


// ============================================================================
// Permanente Animation
// ============================================================================

function animate(
    now
)
{
    let delta =
        (
            now
            -
            lastFrameTime
        )
        /
        1000;


    lastFrameTime =
        now;


    delta =
        Math.min(
            delta,
            0.1
        );


    animateFlow(
        flows.pv,
        delta
    );


    animateFlow(
        flows.grid,
        delta
    );


    animateFlow(
        flows.consumer,
        delta
    );


    animateFlow(
        flows.battery,
        delta
    );


    requestAnimationFrame(
        animate
    );
}


// ============================================================================
// Einzelner Energiefluss
// ============================================================================

function animateFlow(
    flow,
    delta
)
{
    if (
        !flow.path
    ) {

        return;
    }


    const power =
        Math.abs(
            Number(
                flow.power
            )
            ||
            0
        );


    const dotCount =
        getDotCount(
            power
        );


    if (
        dotCount === 0
    ) {

        for (
            const dot
            of
            flow.dots
        ) {

            dot.style.display =
                'none';
        }


        return;
    }


    const secondsPerPath =
        getSecondsPerPath(
            power
        );


    flow.phase +=
        (
            delta
            /
            secondsPerPath
        )
        *
        flow.direction;


    flow.phase =
        (
            (
                flow.phase
                %
                1
            )
            +
            1
        )
        %
        1;


    const pathLength =
        flow.path.getTotalLength();


    const colorSequence =
        flow.colors.length
            ?
            flow.colors
            :
            [
                COLORS.neutral
            ];


    for (
        let i = 0;
        i < flow.dots.length;
        i++
    ) {

        const dot =
            flow.dots[
                i
            ];


        if (
            i >= dotCount
        ) {

            dot.style.display =
                'none';

            continue;
        }


        dot.style.display =
            '';


        const offset =
            i
            /
            dotCount;


        let phase =
            flow.phase
            -
            offset;


        phase =
            (
                (
                    phase
                    %
                    1
                )
                +
                1
            )
            %
            1;


        const point =
            flow.path.getPointAtLength(
                pathLength
                *
                phase
            );


        dot.setAttribute(
            'cx',
            point.x.toFixed(2)
        );


        dot.setAttribute(
            'cy',
            point.y.toFixed(2)
        );


        const sequencePosition =
            Math.floor(
                phase
                *
                colorSequence.length
            )
            %
            colorSequence.length;


        dot.setAttribute(
            'fill',
            colorSequence[
                sequencePosition
            ]
        );
    }
}


// ============================================================================
// Punktanzahl
// ============================================================================

function getDotCount(
    powerW
)
{
    if (
        powerW <= 0
    ) {

        return 0;
    }


    if (
        powerW <= 150
    ) {

        return 1;
    }


    if (
        powerW <= 750
    ) {

        return 2;
    }


    if (
        powerW <= 2000
    ) {

        return 3;
    }


    if (
        powerW <= 4000
    ) {

        return 4;
    }


    if (
        powerW <= 7000
    ) {

        return 5;
    }


    return 6;
}


// ============================================================================
// Geschwindigkeit
// ============================================================================

function getSecondsPerPath(
    powerW
)
{
    if (
        powerW <= 0
    ) {

        return 999;
    }


    if (
        powerW <= 10
    ) {

        return 13.0;
    }


    if (
        powerW <= 50
    ) {

        return 10.5;
    }


    if (
        powerW <= 150
    ) {

        return 8.5;
    }


    if (
        powerW <= 300
    ) {

        return 7.0;
    }


    if (
        powerW <= 750
    ) {

        return 5.5;
    }


    if (
        powerW <= 1500
    ) {

        return 4.4;
    }


    if (
        powerW <= 3000
    ) {

        return 3.4;
    }


    if (
        powerW <= 5000
    ) {

        return 2.7;
    }


    if (
        powerW <= 8000
    ) {

        return 2.2;
    }


    return 1.9;
}


// ============================================================================
// Batteriefüllstand
// ============================================================================

function updateBatteryFill()
{
    const fill =
        document.getElementById(
            'batteryFill'
        );


    if (
        !fill
    ) {

        return;
    }


    const soc =
        Math.max(
            0,
            Math.min(
                100,

                Number(
                    state.values.soc
                )
                ||
                0
            )
        );


    fill.setAttribute(
        'width',

        (
            48
            *
            soc
            /
            100
        ).toFixed(2)
    );
}


// ============================================================================
// Dominante Quellenfarbe
// ============================================================================

function getDominantColor(
    pv,
    battery,
    grid
)
{
    const values =
        [
            {
                value:
                    Number(pv)
                    ||
                    0,

                color:
                    COLORS.pv
            },

            {
                value:
                    Number(battery)
                    ||
                    0,

                color:
                    COLORS.battery
            },

            {
                value:
                    Number(grid)
                    ||
                    0,

                color:
                    COLORS.grid
            }
        ];


    values.sort(
        (
            a,
            b
        ) =>
            b.value
            -
            a.value
    );


    return values[0].value > 0
        ?
        values[0].color
        :
        COLORS.neutral;
}


// ============================================================================
// Wetter
// ============================================================================

function getWeather(
    conditionID,
    conditionIcon,
    rain,
    clouds
)
{
    const id =
        Number(
            conditionID
        )
        ||
        0;


    const icon =
        String(
            conditionIcon
            ||
            ''
        );


    const cloudValue =
        Number(
            clouds
        )
        ||
        0;


    if (
        rain
    ) {

        return {

            symbol:
                '🌧️',

            text:
                'Regen'
        };
    }


    if (
        id >= 200
        &&
        id < 300
    ) {

        return {

            symbol:
                '⛈️',

            text:
                'Gewitter'
        };
    }


    if (
        id >= 300
        &&
        id < 600
    ) {

        return {

            symbol:
                '🌧️',

            text:
                'Regen'
        };
    }


    if (
        id >= 600
        &&
        id < 700
    ) {

        return {

            symbol:
                '🌨️',

            text:
                'Schnee'
        };
    }


    if (
        id >= 700
        &&
        id < 800
    ) {

        return {

            symbol:
                '🌫️',

            text:
                'Nebel'
        };
    }


    if (
        id === 800
    ) {

        const night =
            icon.endsWith(
                'n'
            );


        return {

            symbol:
                night
                    ?
                    '🌙'
                    :
                    '☀️',

            text:
                night
                    ?
                    'Klar'
                    :
                    'Sonnig'
        };
    }


    if (
        id === 801
        ||
        id === 802
    ) {

        return {

            symbol:
                '🌤️',

            text:
                Math.round(
                    cloudValue
                )
                +
                ' % bewölkt'
        };
    }


    if (
        id === 803
        ||
        id === 804
    ) {

        return {

            symbol:
                '☁️',

            text:
                Math.round(
                    cloudValue
                )
                +
                ' % bewölkt'
        };
    }


    return {

        symbol:
            '🌤️',

        text:
            Math.round(
                cloudValue
            )
            +
            ' % bewölkt'
    };
}


// ============================================================================
// Leistung
// ============================================================================

function formatPower(
    powerW
)
{
    const value =
        Math.abs(
            Number(
                powerW
            )
            ||
            0
        );


    if (
        value >= 1000
    ) {

        return (
            value
            /
            1000
        ).toFixed(2)
        +
        ' kW';
    }


    if (
        value >= 100
    ) {

        return Math.round(
            value
        )
        +
        ' W';
    }


    return value.toFixed(1)
        +
        ' W';
}


// ============================================================================
// Netzinfo
// ============================================================================

function formatGridInfo(
    voltage,
    frequency
)
{
    const parts =
        [];


    const v =
        Number(
            voltage
        );


    const f =
        Number(
            frequency
        );


    if (
        Number.isFinite(
            v
        )
        &&
        v > 0
    ) {

        parts.push(
            v.toFixed(0)
            +
            ' V'
        );
    }


    if (
        Number.isFinite(
            f
        )
        &&
        f > 0
    ) {

        parts.push(
            f.toFixed(1)
            +
            ' Hz'
        );
    }


    return parts.length
        ?
        parts.join(
            ' · '
        )
        :
        '-';
}


// ============================================================================
// Text setzen
// ============================================================================

function setText(
    id,
    text
)
{
    const element =
        document.getElementById(
            id
        );


    if (
        element
    ) {

        element.textContent =
            text;
    }
}


// ============================================================================
// Start
// ============================================================================

document.addEventListener(
    'DOMContentLoaded',
    init
);
