<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

:root {
    --pv: #35b657;
    --grid: #f29a38;
    --battery: #23b8c7;

    --inactive: rgba(125, 125, 125, 0.32);
    --inactive-strong: rgba(125, 125, 125, 0.46);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: transparent;
    color: inherit;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}

.energy {
    position: relative;

    width: 100%;
    height: 100%;

    min-height: 340px;

    overflow: hidden;
}


/* =========================================================
   VERBINDUNGSLINIEN
   bleiben IMMER grau
   ========================================================= */

.flowLine {
    position: absolute;

    z-index: 1;

    border-radius: 20px;

    background: var(--inactive);
}


/* PV -> Haus */

#linePV {
    width: 4px;
    height: 29%;

    left: 50%;
    top: 23%;

    transform: translateX(-50%);
}


/* Netz <-> Haus */

#lineGrid {
    width: 25%;
    height: 4px;

    left: 21%;
    top: 58%;
}


/* Haus <-> Batterie */

#lineBattery {
    width: 25%;
    height: 4px;

    left: 54%;
    top: 58%;
}


/* =========================================================
   ANIMIERTE ENERGIEPUNKTE
   ========================================================= */

.flowDot {
    position: absolute;

    width: 11px;
    height: 11px;

    border-radius: 50%;

    opacity: 0;

    z-index: 3;

    box-shadow:
        0 0 7px currentColor,
        0 0 14px currentColor;

    transition: opacity 0.2s ease;
}

.flowDot.active {
    opacity: 1;
}


/* =========================================================
   PV-PUNKT
   ========================================================= */

#dotPV {
    left: calc(50% - 5px);
    top: 25%;

    background: var(--pv);
    color: var(--pv);
}

#dotPV.active {
    animation:
        pvFlow
        1.65s
        linear
        infinite;
}

@keyframes pvFlow {
    from {
        top: 25%;
    }

    to {
        top: 51%;
    }
}


/* =========================================================
   NETZ-PUNKT
   ========================================================= */

#dotGrid {
    left: 22%;
    top: calc(58% - 4px);
}

#dotGrid.import {
    animation:
        gridImport
        1.65s
        linear
        infinite;
}

#dotGrid.export {
    animation:
        gridExport
        1.65s
        linear
        infinite;
}

@keyframes gridImport {
    from {
        left: 22%;
    }

    to {
        left: 45%;
    }
}

@keyframes gridExport {
    from {
        left: 45%;
    }

    to {
        left: 22%;
    }
}


/* =========================================================
   BATTERIE-PUNKT
   ========================================================= */

#dotBattery {
    left: 55%;
    top: calc(58% - 4px);
}

#dotBattery.charge {
    animation:
        batteryCharge
        1.65s
        linear
        infinite;
}

#dotBattery.discharge {
    animation:
        batteryDischarge
        1.65s
        linear
        infinite;
}

@keyframes batteryCharge {
    from {
        left: 55%;
    }

    to {
        left: 78%;
    }
}

@keyframes batteryDischarge {
    from {
        left: 78%;
    }

    to {
        left: 55%;
    }
}


/* =========================================================
   KNOTEN
   ========================================================= */

.node {
    position: absolute;

    transform: translate(-50%, -50%);

    width: 138px;

    text-align: center;

    z-index: 10;
}

#pv {
    left: 50%;
    top: 17%;
}

#grid {
    left: 15%;
    top: 58%;
}

#house {
    left: 50%;
    top: 58%;
}

#battery {
    left: 85%;
    top: 58%;
}


/* =========================================================
   ICON-KREISE
   ========================================================= */

.iconCircle {
    width: 72px;
    height: 72px;

    margin: 0 auto;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    border: 2px solid var(--inactive-strong);

    background: rgba(125, 125, 125, 0.035);
}

.iconCircle svg {
    width: 33px;
    height: 33px;

    stroke: currentColor;

    stroke-width: 1.8;

    fill: none;

    stroke-linecap: round;
    stroke-linejoin: round;
}

.iconPV {
    color: var(--pv);
    border-color: var(--pv);
}

.iconGrid {
    color: var(--grid);
    border-color: var(--grid);
}

.iconBattery {
    color: var(--battery);
    border-color: var(--battery);
}

.iconHouse {
    width: 78px;
    height: 78px;

    color: currentColor;

    border-color: var(--inactive-strong);

    background: rgba(125, 125, 125, 0.065);
}


/* =========================================================
   TEXTE
   ========================================================= */

.nodeTitle {
    margin-top: 7px;

    font-size: 12px;
    font-weight: 500;

    opacity: 0.62;
}

.nodeValue {
    margin-top: 1px;

    font-size: 22px;

    line-height: 1.15;

    font-weight: 650;

    letter-spacing: -0.3px;
}

.nodeStatus {
    min-height: 17px;

    margin-top: 4px;

    font-size: 11px;

    opacity: 0.58;
}


/* =========================================================
   BATTERIE SOC
   ========================================================= */

.socRow {
    width: 92px;

    margin: 7px auto 0;
}

.socTrack {
    width: 100%;
    height: 7px;

    overflow: hidden;

    border-radius: 20px;

    background: rgba(125, 125, 125, 0.20);
}

#batteryFill {
    width: 0;
    height: 100%;

    border-radius: 20px;

    background: var(--battery);

    transition: width 0.45s ease;
}

#socValue {
    margin-top: 3px;

    font-size: 11px;

    opacity: 0.58;
}


/* =========================================================
   HINTERGRUND HAUS
   ========================================================= */

.houseHalo {
    position: absolute;

    left: 50%;
    top: 58%;

    width: 102px;
    height: 102px;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(125, 125, 125, 0.035);

    z-index: 0;
}


/* =========================================================
   STATUSFARBEN
   ========================================================= */

.statusPV {
    color: var(--pv);
}

.statusGrid {
    color: var(--grid);
}

.statusBattery {
    color: var(--battery);
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 650px) {

    .energy {
        min-height: 320px;
    }

    .node {
        width: 115px;
    }

    .iconCircle {
        width: 62px;
        height: 62px;
    }

    .iconHouse {
        width: 68px;
        height: 68px;
    }

    .iconCircle svg {
        width: 28px;
        height: 28px;
    }

    .nodeValue {
        font-size: 19px;
    }

    #grid {
        left: 14%;
    }

    #battery {
        left: 86%;
    }
}

</style>
</head>


<body>

<div class="energy">


    <!-- GRAUE VERBINDUNGSLINIEN -->

    <div
        class="flowLine"
        id="linePV"
    ></div>

    <div
        class="flowLine"
        id="lineGrid"
    ></div>

    <div
        class="flowLine"
        id="lineBattery"
    ></div>


    <!-- FARBIGE FLUSSPUNKTE -->

    <div
        class="flowDot"
        id="dotPV"
    ></div>

    <div
        class="flowDot"
        id="dotGrid"
    ></div>

    <div
        class="flowDot"
        id="dotBattery"
    ></div>


    <div class="houseHalo"></div>


    <!-- =====================================================
         PV
         ===================================================== -->

    <div
        class="node"
        id="pv"
    >

        <div class="iconCircle iconPV">

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <circle
                    cx="12"
                    cy="12"
                    r="4"
                ></circle>

                <path d="M12 2v2"></path>
                <path d="M12 20v2"></path>

                <path d="M4.93 4.93l1.41 1.41"></path>
                <path d="M17.66 17.66l1.41 1.41"></path>

                <path d="M2 12h2"></path>
                <path d="M20 12h2"></path>

                <path d="M4.93 19.07l1.41-1.41"></path>
                <path d="M17.66 6.34l1.41-1.41"></path>
            </svg>

        </div>

        <div class="nodeTitle">
            PV-Anlage
        </div>

        <div
            class="nodeValue"
            id="pvValue"
        >
            -- kW
        </div>

        <div
            class="nodeStatus"
            id="pvStatus"
        >
            -
        </div>

    </div>


    <!-- =====================================================
         NETZ
         ===================================================== -->

    <div
        class="node"
        id="grid"
    >

        <div class="iconCircle iconGrid">

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M4 9h16"></path>
                <path d="M4 15h16"></path>

                <path d="M7 6l-3 3 3 3"></path>
                <path d="M17 12l3 3-3 3"></path>
            </svg>

        </div>

        <div class="nodeTitle">
            Stromnetz
        </div>

        <div
            class="nodeValue"
            id="gridValue"
        >
            -- kW
        </div>

        <div
            class="nodeStatus"
            id="gridMode"
        >
            -
        </div>

    </div>


    <!-- =====================================================
         HAUS
         ===================================================== -->

    <div
        class="node"
        id="house"
    >

        <div class="iconCircle iconHouse">

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path d="M3 11.5L12 4l9 7.5"></path>

                <path d="M5.5 10v9h13v-9"></path>

                <path d="M9.5 19v-5h5v5"></path>
            </svg>

        </div>

        <div class="nodeTitle">
            Haus
        </div>

        <div
            class="nodeValue"
            id="houseValue"
        >
            -- kW
        </div>

        <div class="nodeStatus">
            Verbrauch
        </div>

    </div>


    <!-- =====================================================
         BATTERIE
         ===================================================== -->

    <div
        class="node"
        id="battery"
    >

        <div class="iconCircle iconBattery">

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <rect
                    x="4"
                    y="7"
                    width="15"
                    height="10"
                    rx="2"
                ></rect>

                <path d="M19 10h2v4h-2"></path>

                <path d="M8 12h7"></path>
            </svg>

        </div>

        <div class="nodeTitle">
            Batterie
        </div>

        <div
            class="nodeValue"
            id="batteryValue"
        >
            -- kW
        </div>

        <div
            class="nodeStatus"
            id="batteryMode"
        >
            -
        </div>

        <div class="socRow">

            <div class="socTrack">
                <div id="batteryFill"></div>
            </div>

            <div id="socValue">
                -- %
            </div>

        </div>

    </div>

</div>


<script>


function kw(value)
{
    return Number(value || 0).toFixed(1) + " kW";
}


function handleMessage(data)
{
    if (!data) {
        return;
    }


    if (typeof data === "string") {

        try {

            data =
                JSON.parse(
                    data
                );

        } catch (error) {

            console.error(
                "EnergyFlowLive JSON Fehler:",
                error,
                data
            );

            return;
        }
    }


    const pv =
        Number(data.pv || 0);

    const house =
        Number(data.house || 0);

    const gridImport =
        Number(data.gridImport || 0);

    const gridExport =
        Number(data.gridExport || 0);

    const batteryCharge =
        Number(data.batteryCharge || 0);

    const batteryDischarge =
        Number(data.batteryDischarge || 0);

    const soc =
        Number(data.soc || 0);



    /* =====================================================
       HAUPTWERTE
       ===================================================== */

    document
        .getElementById(
            "pvValue"
        )
        .textContent =
            kw(pv);


    document
        .getElementById(
            "houseValue"
        )
        .textContent =
            kw(house);


    document
        .getElementById(
            "socValue"
        )
        .textContent =
            soc.toFixed(0) + " %";


    document
        .getElementById(
            "batteryFill"
        )
        .style.width =
            Math.max(
                0,
                Math.min(
                    100,
                    soc
                )
            ) + "%";



    /* =====================================================
       PV
       Linie bleibt grau.
       Nur der Punkt wird grün.
       ===================================================== */

    const dotPV =
        document.getElementById(
            "dotPV"
        );


    const pvStatus =
        document.getElementById(
            "pvStatus"
        );


    if (pv > 0.05) {

        dotPV.style.background =
            "var(--pv)";

        dotPV.style.color =
            "var(--pv)";

        dotPV.className =
            "flowDot active";


        pvStatus.textContent =
            "Produktion";

        pvStatus.className =
            "nodeStatus statusPV";

    } else {

        dotPV.className =
            "flowDot";

        pvStatus.textContent =
            "kein Ertrag";

        pvStatus.className =
            "nodeStatus";
    }



    /* =====================================================
       NETZ
       Linie bleibt grau.
       Bezug = orange
       Einspeisung = grün
       ===================================================== */

    const dotGrid =
        document.getElementById(
            "dotGrid"
        );


    const gridValue =
        document.getElementById(
            "gridValue"
        );


    const gridMode =
        document.getElementById(
            "gridMode"
        );


    if (gridImport > 0.05) {

        gridValue.textContent =
            kw(gridImport);


        gridMode.textContent =
            "Netzbezug";

        gridMode.className =
            "nodeStatus statusGrid";


        dotGrid.style.background =
            "var(--grid)";

        dotGrid.style.color =
            "var(--grid)";

        dotGrid.className =
            "flowDot active import";

    }

    else if (gridExport > 0.05) {

        gridValue.textContent =
            kw(gridExport);


        gridMode.textContent =
            "Einspeisung";

        gridMode.className =
            "nodeStatus statusPV";


        dotGrid.style.background =
            "var(--pv)";

        dotGrid.style.color =
            "var(--pv)";

        dotGrid.className =
            "flowDot active export";

    }

    else {

        gridValue.textContent =
            "0.0 kW";


        gridMode.textContent =
            "kein Austausch";

        gridMode.className =
            "nodeStatus";


        dotGrid.className =
            "flowDot";
    }



    /* =====================================================
       BATTERIE
       Linie bleibt grau.
       Laden = grün
       Entladen = türkis
       ===================================================== */

    const dotBattery =
        document.getElementById(
            "dotBattery"
        );


    const batteryValue =
        document.getElementById(
            "batteryValue"
        );


    const batteryMode =
        document.getElementById(
            "batteryMode"
        );


    if (batteryCharge > 0.05) {

        batteryValue.textContent =
            kw(batteryCharge);


        batteryMode.textContent =
            "Laden";

        batteryMode.className =
            "nodeStatus statusPV";


        dotBattery.style.background =
            "var(--pv)";

        dotBattery.style.color =
            "var(--pv)";

        dotBattery.className =
            "flowDot active charge";

    }

    else if (batteryDischarge > 0.05) {

        batteryValue.textContent =
            kw(batteryDischarge);


        batteryMode.textContent =
            "Entladen";

        batteryMode.className =
            "nodeStatus statusBattery";


        dotBattery.style.background =
            "var(--battery)";

        dotBattery.style.color =
            "var(--battery)";

        dotBattery.className =
            "flowDot active discharge";

    }

    else {

        batteryValue.textContent =
            "0.0 kW";


        batteryMode.textContent =
            "Standby";

        batteryMode.className =
            "nodeStatus";


        dotBattery.className =
            "flowDot";
    }
}


/* INITIALWERTE LADEN */

window.addEventListener(
    "load",
    function ()
    {
        requestAction(
            "Refresh",
            true
        );
    }
);

</script>

</body>
</html>
