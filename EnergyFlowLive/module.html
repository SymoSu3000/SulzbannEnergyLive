<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<style>

    :root {

        color-scheme: light dark;

        --pv: #42cf63;
        --grid: #f5aa2a;
        --battery: #36a7ff;
        --house: #18c3c8;

        --neutral: #8b949e;

        /*
         * Standard = Dark Mode
         */
        --foreground: #f3f5f7;
    }


    * {
        box-sizing: border-box;
    }


    html,
    body {

        margin: 0;
        padding: 0;

        width: 100%;
        height: 100%;

        overflow: hidden;

        background: transparent;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Arial,
            sans-serif;

        color: var(--foreground);
    }


    #energyWrap {

        width: 100%;
        height: 100%;

        color: var(--foreground);
    }


    svg {

        display: block;

        width: 100%;
        height: 100%;

        color: var(--foreground);
    }


    /* ================================================================ */
    /* VERBINDUNGSLINIEN                                                */
    /*
     * Bewusst DIREKTE Farbe.
     *
     * Keine Symcon-Variable.
     * Kein color-mix.
     *
     * Damit die Linie zuverlässig auf Desktop, App und Mobile
     * dargestellt wird.
     * ================================================================ */

    .base-line {

        fill: none !important;

        stroke: #a0a6ad !important;

        stroke-width: 3.2 !important;

        stroke-linecap: round;

        opacity: 0.72 !important;

        vector-effect: non-scaling-stroke;
    }


    /* ================================================================ */
    /* KREISE                                                           */
    /* ================================================================ */

    .node-base {

        fill: rgba(128,128,128,.025);

        stroke: var(--neutral);

        stroke-width: 3;
    }


    .ring {

        fill: none;

        stroke-width: 4;

        stroke-linecap: butt;

        transform-box: fill-box;
        transform-origin: center;

        transform: rotate(-90deg);
    }


    .ring-pv {
        stroke: var(--pv);
    }


    .ring-neutral {
        stroke: var(--neutral);
    }


    /* ================================================================ */
    /* SCHRIFT DESKTOP / STANDARD                                      */
    /* ================================================================ */

    .node-title {

        font-size: 26px;

        font-weight: 650;

        fill: var(--foreground);
    }


    .node-value {

        font-size: 35px;

        font-weight: 760;

        fill: var(--foreground);
    }


    .pv-value {
        fill: var(--pv);
    }


    .battery-value {
        fill: var(--battery);
    }


    .node-sub {

        font-size: 20px;

        font-weight: 400;

        fill: var(--foreground);

        opacity: .78;
    }


    .node-sub-small {

        font-size: 18px;

        font-weight: 400;

        fill: var(--foreground);

        opacity: .72;
    }


    .weather-text {

        font-size: 19px;

        font-weight: 400;

        fill: var(--foreground);

        opacity: .78;
    }


    /* ================================================================ */
    /* ICONS                                                            */
    /* ================================================================ */

    .icon-line {

        fill: none;

        stroke: var(--foreground);

        stroke-width: 5;

        stroke-linecap: round;
        stroke-linejoin: round;
    }


    .house-icon {

        stroke: var(--house);

        stroke-width: 8;
    }


    .weather-main {

        font-size: 36px;

        text-anchor: middle;

        dominant-baseline: middle;
    }


    /* ================================================================ */
    /* PUNKTE                                                           */
    /* ================================================================ */

    .flow-dot {

        r: 6;

        pointer-events: none;
    }


    /* ================================================================ */
    /* BATTERIE                                                         */
    /* ================================================================ */

    .battery-fill-bg {

        fill: rgba(128,128,128,.18);
    }


    .battery-fill {

        fill: var(--battery);
    }


    /* ================================================================ */
    /* LIGHT MODE                                                       */
    /* ================================================================ */

    @media (prefers-color-scheme: light) {

        :root {

            --foreground: #202124;
        }


        .base-line {

            stroke: #70767d !important;

            opacity: 0.68 !important;
        }
    }


    /* ================================================================ */
    /* DARK MODE                                                        */
    /* ================================================================ */

    @media (prefers-color-scheme: dark) {

        :root {

            --foreground: #f3f5f7;
        }


        .base-line {

            stroke: #aab0b7 !important;

            opacity: 0.72 !important;
        }
    }


    /* ================================================================ */
    /* MOBILE                                                           */
    /*
     * WICHTIG:
     *
     * NICHT mehr max-width alleine.
     *
     * Sonst wird eine schmale Desktop-Kachel ebenfalls als Mobile
     * erkannt.
     *
     * Mobile-Vergrösserung nur auf Geräten mit grobem Touch-Pointer.
     * ================================================================ */

    @media (pointer: coarse) {

        .node-sub {

            font-size: 29px;

            font-weight: 500;

            opacity: .90;
        }


        .node-sub-small {

            font-size: 26px;

            font-weight: 500;

            opacity: .86;
        }


        .weather-text {

            font-size: 26px;

            font-weight: 500;

            opacity: .90;
        }


        .base-line {

            stroke-width: 3.8 !important;
        }
    }


    /* ================================================================ */
    /* SEHR KLEINES TOUCH-GERÄT                                        */
    /* ================================================================ */

    @media (pointer: coarse) and (max-width: 430px) {

        .node-sub {

            font-size: 31px;
        }


        .node-sub-small {

            font-size: 28px;
        }


        .weather-text {

            font-size: 28px;
        }
    }


    /* ================================================================ */
    /* REDUZIERTE BEWEGUNG                                              */
    /* ================================================================ */

    @media (prefers-reduced-motion: reduce) {

        .flow-dot {

            display: none !important;
        }
    }

</style>

<script>

'use strict';


// ============================================================================
// FARBEN
// ============================================================================

const COLORS = {

    pv:
        '#42cf63',

    grid:
        '#f5aa2a',

    battery:
        '#36a7ff',

    neutral:
        '#8b949e'
};


// ============================================================================
// ZUSTAND
// ============================================================================

const state = {

    values: {

        pv: 0,

        gridImport: 0,
        gridExport: 0,
        gridState: 'idle',

        batteryCharge: 0,
        batteryDischarge: 0,
        batteryState: 'idle',

        house: 0,

        houseFromPV: 0,
        houseFromBattery: 0,
        houseFromGrid: 0,

        pvToHouse: 0,
        pvToBattery: 0,
        pvToGrid: 0,

        soc: 0,

        tempWR: 0,
        tempBattery: 0,

        voltage: 0,
        frequency: 0,

        weatherID: 0,
        weatherIcon: '',

        clouds: 0,

        rain: false
    }
};


// ============================================================================
// FLÜSSE
// ============================================================================

const flows = {

    pv: {

        path: null,

        dots: [],

        phase: 0,

        power: 0,

        direction: 1,

        colors: [
            COLORS.pv
        ]
    },


    grid: {

        path: null,

        dots: [],

        phase: 0,

        power: 0,

        direction: 1,

        colors: [
            COLORS.grid
        ]
    },


    consumer: {

        path: null,

        dots: [],

        phase: 0,

        power: 0,

        direction: 1,

        colors: [
            COLORS.pv
        ]
    },


    battery: {

        path: null,

        dots: [],

        phase: 0,

        power: 0,

        direction: 1,

        colors: [
            COLORS.pv
        ]
    }
};


const MAX_DOTS =
    6;


let lastFrameTime =
    performance.now();


// ============================================================================
// INITIALISIERUNG
// ============================================================================

function init()
{
    flows.pv.path =
        document.getElementById(
            'pathPV'
        );


    flows.grid.path =
        document.getElementById(
            'pathGrid'
        );


    flows.consumer.path =
        document.getElementById(
            'pathConsumer'
        );


    flows.battery.path =
        document.getElementById(
            'pathBattery'
        );


    createDotPool(
        'pv',
        'pvDots'
    );


    createDotPool(
        'grid',
        'gridDots'
    );


    createDotPool(
        'consumer',
        'consumerDots'
    );


    createDotPool(
        'battery',
        'batteryDots'
    );


    try {

        requestAction(
            'Refresh',
            true
        );

    } catch (e) {

    }


    requestAnimationFrame(
        animate
    );
}


// ============================================================================
// PUNKT-POOL
// ============================================================================

function createDotPool(
    flowName,
    containerID
)
{
    const ns =
        'http://www.w3.org/2000/svg';


    const container =
        document.getElementById(
            containerID
        );


    for (
        let i = 0;
        i < MAX_DOTS;
        i++
    ) {

        const dot =
            document.createElementNS(
                ns,
                'circle'
            );


        dot.setAttribute(
            'class',
            'flow-dot'
        );


        dot.style.display =
            'none';


        container.appendChild(
            dot
        );


        flows[
            flowName
        ].dots.push(
            dot
        );
    }
}


// ============================================================================
// NACHRICHT VON SYMCON
// ============================================================================

function handleMessage(message)
{
    let data =
        message;


    if (
        typeof message
        ===
        'string'
    ) {

        try {

            data =
                JSON.parse(
                    message
                );

        } catch (e) {

            return;
        }
    }


    if (
        !data
        ||
        data.type
        !==
        'energy'
    ) {

        return;
    }


    Object.assign(
        state.values,
        data
    );


    updateTexts();

    updateRings();

    updateFlowTargets();
}


// ============================================================================
// TEXTE
// ============================================================================

function updateTexts()
{
    const v =
        state.values;


    // PVA

    setText(
        'pvValue',
        formatPower(
            v.pv
        )
    );


    setText(
        'pvTemp',

        '('
        +
        Number(
            v.tempWR
        ).toFixed(1)
        +
        ' °C)'
    );


    const weather =
        getWeather(
            v.weatherID,
            v.weatherIcon,
            v.rain,
            v.clouds
        );


    setText(
        'weatherSymbol',
        weather.symbol
    );


    setText(
        'weatherText',
        weather.text
    );


    // Netz

    let gridPower =
        0;


    if (
        v.gridState
        ===
        'import'
    ) {

        gridPower =
            v.gridImport;

    } else if (
        v.gridState
        ===
        'export'
    ) {

        gridPower =
            v.gridExport;
    }


    setText(
        'gridValue',

        formatPower(
            gridPower
        )
    );


    const gridValueElement =
        document.getElementById(
            'gridValue'
        );


    if (
        gridValueElement
    ) {

        gridValueElement.style.fill =

            v.gridState
            ===
            'export'

                ?

                COLORS.pv

                :

                (
                    v.gridState
                    ===
                    'import'

                        ?

                        COLORS.grid

                        :

                        COLORS.neutral
                );
    }


    setText(
        'gridMode',

        v.gridState
        ===
        'import'

            ?

            'Netzbezug'

            :

            (
                v.gridState
                ===
                'export'

                    ?

                    'Einspeisung'

                    :

                    'Ruhe'
            )
    );


    setText(
        'gridInfo',

        formatGridInfo(
            v.voltage,
            v.frequency
        )
    );


    // Verbraucher

    setText(
        'consumerValue',

        formatPower(
            v.house
        )
    );


    const dominantHouseColor =
        getDominantColor(
            v.houseFromPV,
            v.houseFromBattery,
            v.houseFromGrid
        );


    const consumerValue =
        document.getElementById(
            'consumerValue'
        );


    if (
        consumerValue
    ) {

        consumerValue.style.fill =
            dominantHouseColor;
    }


    // Batterie

    let batteryPower =
        0;


    if (
        v.batteryState
        ===
        'charge'
    ) {

        batteryPower =
            v.batteryCharge;

    } else if (
        v.batteryState
        ===
        'discharge'
    ) {

        batteryPower =
            v.batteryDischarge;
    }


    setText(
        'batteryPower',

        formatPower(
            batteryPower
        )
    );


    setText(
        'batteryMode',

        v.batteryState
        ===
        'charge'

            ?

            'Laden'

            :

            (
                v.batteryState
                ===
                'discharge'

                    ?

                    'Entladen'

                    :

                    'Ruhe'
            )
    );


    setText(
        'batteryInfo',

        'SOC: '
        +
        Math.round(
            v.soc
        )
        +
        ' %'
        +
        ' · '
        +
        Number(
            v.tempBattery
        ).toFixed(1)
        +
        ' °C'
    );


    updateBatteryFill();
}


// ============================================================================
// RINGE
// ============================================================================

function updateRings()
{
    const v =
        state.values;


    // Netzring

    const gridRing =
        document.getElementById(
            'gridRing'
        );


    if (
        gridRing
    ) {

        if (
            v.gridState
            ===
            'export'
        ) {

            gridRing.style.stroke =
                COLORS.pv;

        } else if (
            v.gridState
            ===
            'import'
        ) {

            gridRing.style.stroke =
                COLORS.grid;

        } else {

            gridRing.style.stroke =
                COLORS.neutral;
        }
    }


    // Batteriering

    const batteryRing =
        document.getElementById(
            'batteryRing'
        );


    if (
        batteryRing
    ) {

        if (
            v.batteryState
            ===
            'charge'
        ) {

            batteryRing.style.stroke =
                COLORS.pv;

        } else if (
            v.batteryState
            ===
            'discharge'
        ) {

            batteryRing.style.stroke =
                COLORS.battery;

        } else {

            batteryRing.style.stroke =
                COLORS.neutral;
        }
    }


    // Verbraucherkreis proportional

    drawSegmentedRing(

        'consumerRing',

        285,
        500,
        60,

        [
            {
                value:
                    v.houseFromPV,

                color:
                    COLORS.pv
            },

            {
                value:
                    v.houseFromBattery,

                color:
                    COLORS.battery
            },

            {
                value:
                    v.houseFromGrid,

                color:
                    COLORS.grid
            }
        ]
    );


    // Hauskreis proportional

    drawSegmentedRing(

        'houseRing',

        500,
        335,
        74,

        [
            {
                value:
                    v.houseFromPV,

                color:
                    COLORS.pv
            },

            {
                value:
                    v.houseFromBattery,

                color:
                    COLORS.battery
            },

            {
                value:
                    v.houseFromGrid,

                color:
                    COLORS.grid
            }
        ]
    );
}


// ============================================================================
// SEGMENTIERTER KREIS
// ============================================================================

function drawSegmentedRing(
    containerID,
    cx,
    cy,
    radius,
    segments
)
{
    const container =
        document.getElementById(
            containerID
        );


    if (
        !container
    ) {

        return;
    }


    while (
        container.firstChild
    ) {

        container.removeChild(
            container.firstChild
        );
    }


    const total =
        segments.reduce(
            (
                sum,
                segment
            ) =>

                sum
                +
                Math.max(
                    0,
                    Number(
                        segment.value
                    )
                    ||
                    0
                ),

            0
        );


    if (
        total <= 0
    ) {

        createRingSegment(

            container,
            cx,
            cy,
            radius,

            0,
            1,

            COLORS.neutral
        );

        return;
    }


    let start =
        0;


    for (
        const segment
        of
        segments
    ) {

        const value =
            Math.max(
                0,
                Number(
                    segment.value
                )
                ||
                0
            );


        if (
            value <= 0
        ) {

            continue;
        }


        const fraction =
            value
            /
            total;


        createRingSegment(

            container,
            cx,
            cy,
            radius,

            start,
            fraction,

            segment.color
        );


        start +=
            fraction;
    }
}


// ============================================================================
// EIN RINGSEGMENT
// ============================================================================

function createRingSegment(
    container,
    cx,
    cy,
    radius,
    startFraction,
    fraction,
    color
)
{
    const ns =
        'http://www.w3.org/2000/svg';


    const circle =
        document.createElementNS(
            ns,
            'circle'
        );


    const circumference =
        2
        *
        Math.PI
        *
        radius;


    circle.setAttribute(
        'cx',
        cx
    );


    circle.setAttribute(
        'cy',
        cy
    );


    circle.setAttribute(
        'r',
        radius
    );


    circle.setAttribute(
        'fill',
        'none'
    );


    circle.setAttribute(
        'stroke',
        color
    );


    circle.setAttribute(
        'stroke-width',
        '4'
    );


    circle.setAttribute(
        'stroke-dasharray',

        (
            circumference
            *
            fraction
        )
        +
        ' '
        +
        circumference
    );


    circle.setAttribute(
        'stroke-dashoffset',

        -(
            circumference
            *
            startFraction
        )
    );


    circle.setAttribute(

        'transform',

        'rotate(-90 '
        +
        cx
        +
        ' '
        +
        cy
        +
        ')'
    );


    container.appendChild(
        circle
    );
}


// ============================================================================
// FLUSS-ZIELE
// ============================================================================

function updateFlowTargets()
{
    const v =
        state.values;


    // PVA -> Haus

    flows.pv.power =
        Math.max(
            0,
            Number(
                v.pv
            )
            ||
            0
        );


    flows.pv.direction =
        1;


    flows.pv.colors =
        [
            COLORS.pv
        ];


    // Netz

    if (
        v.gridState
        ===
        'import'
    ) {

        flows.grid.power =
            v.gridImport;


        flows.grid.direction =
            1;


        flows.grid.colors =
            [
                COLORS.grid
            ];

    } else if (
        v.gridState
        ===
        'export'
    ) {

        flows.grid.power =
            v.gridExport;


        flows.grid.direction =
            -1;


        /*
         * Bei Einspeisung kommt die Energie aus PV.
         */

        flows.grid.colors =
            [
                COLORS.pv
            ];

    } else {

        flows.grid.power =
            0;
    }


    // Verbraucher

    flows.consumer.power =
        Math.max(
            0,
            Number(
                v.house
            )
            ||
            0
        );


    flows.consumer.direction =
        1;


    flows.consumer.colors =
        createColorSequence(

            [
                {
                    value:
                        v.houseFromPV,

                    color:
                        COLORS.pv
                },

                {
                    value:
                        v.houseFromBattery,

                    color:
                        COLORS.battery
                },

                {
                    value:
                        v.houseFromGrid,

                    color:
                        COLORS.grid
                }
            ]
        );


    // Batterie

    if (
        v.batteryState
        ===
        'charge'
    ) {

        flows.battery.power =
            v.batteryCharge;


        flows.battery.direction =
            1;


        /*
         * Batterie wird aus PV geladen.
         */

        flows.battery.colors =
            [
                COLORS.pv
            ];

    } else if (
        v.batteryState
        ===
        'discharge'
    ) {

        flows.battery.power =
            v.batteryDischarge;


        flows.battery.direction =
            -1;


        flows.battery.colors =
            [
                COLORS.battery
            ];

    } else {

        flows.battery.power =
            0;
    }
}


// ============================================================================
// GEMISCHTE FARBEN
// ============================================================================

function createColorSequence(
    parts
)
{
    const valid =
        parts.filter(

            part =>

                Number(
                    part.value
                )
                >
                0
        );


    if (
        valid.length
        ===
        0
    ) {

        return [
            COLORS.neutral
        ];
    }


    const total =
        valid.reduce(

            (
                sum,
                part
            ) =>

                sum
                +
                Number(
                    part.value
                ),

            0
        );


    const slots =
        12;


    const sequence =
        [];


    const counters =
        valid.map(

            part => ({

                color:
                    part.color,

                target:
                    (
                        Number(
                            part.value
                        )
                        /
                        total
                    )
                    *
                    slots,

                used:
                    0
            })
        );


    for (
        let i = 0;
        i < slots;
        i++
    ) {

        let selected =
            counters[0];


        let bestScore =
            -Infinity;


        for (
            const counter
            of
            counters
        ) {

            const score =
                counter.target
                -
                counter.used;


            if (
                score
                >
                bestScore
            ) {

                bestScore =
                    score;


                selected =
                    counter;
            }
        }


        sequence.push(
            selected.color
        );


        selected.used++;
    }


    return sequence;
}


// ============================================================================
// PERMANENTE ANIMATION
// ============================================================================

function animate(now)
{
    let delta =
        (
            now
            -
            lastFrameTime
        )
        /
        1000;


    lastFrameTime =
        now;


    delta =
        Math.min(
            delta,
            0.1
        );


    animateFlow(
        flows.pv,
        delta
    );


    animateFlow(
        flows.grid,
        delta
    );


    animateFlow(
        flows.consumer,
        delta
    );


    animateFlow(
        flows.battery,
        delta
    );


    requestAnimationFrame(
        animate
    );
}


// ============================================================================
// EINZELNER FLUSS
// ============================================================================

function animateFlow(
    flow,
    delta
)
{
    if (
        !flow.path
    ) {

        return;
    }


    const power =
        Math.abs(
            Number(
                flow.power
            )
            ||
            0
        );


    const dotCount =
        getDotCount(
            power
        );


    if (
        dotCount
        ===
        0
    ) {

        for (
            const dot
            of
            flow.dots
        ) {

            dot.style.display =
                'none';
        }


        return;
    }


    const secondsPerPath =
        getSecondsPerPath(
            power
        );


    /*
     * Phase bleibt erhalten.
     *
     * Messwertänderung startet die Animation nicht neu.
     */

    flow.phase +=
        (
            delta
            /
            secondsPerPath
        )
        *
        flow.direction;


    flow.phase =
        (
            (
                flow.phase
                %
                1
            )
            +
            1
        )
        %
        1;


    const pathLength =
        flow.path.getTotalLength();


    const colorSequence =
        flow.colors.length

            ?

            flow.colors

            :

            [
                COLORS.neutral
            ];


    for (
        let i = 0;
        i < flow.dots.length;
        i++
    ) {

        const dot =
            flow.dots[
                i
            ];


        if (
            i >= dotCount
        ) {

            dot.style.display =
                'none';

            continue;
        }


        dot.style.display =
            '';


        const offset =
            i
            /
            dotCount;


        let phase =
            flow.phase
            -
            offset;


        phase =
            (
                (
                    phase
                    %
                    1
                )
                +
                1
            )
            %
            1;


        const point =
            flow.path.getPointAtLength(

                pathLength
                *
                phase
            );


        dot.setAttribute(
            'cx',
            point.x.toFixed(2)
        );


        dot.setAttribute(
            'cy',
            point.y.toFixed(2)
        );


        const sequencePosition =
            Math.floor(
                phase
                *
                colorSequence.length
            )
            %
            colorSequence.length;


        dot.setAttribute(

            'fill',

            colorSequence[
                sequencePosition
            ]
        );
    }
}


// ============================================================================
// PUNKTANZAHL
// ============================================================================

function getDotCount(
    powerW
)
{
    if (
        powerW <= 0
    ) {

        return 0;
    }


    if (
        powerW <= 150
    ) {

        return 1;
    }


    if (
        powerW <= 750
    ) {

        return 2;
    }


    if (
        powerW <= 2000
    ) {

        return 3;
    }


    if (
        powerW <= 4000
    ) {

        return 4;
    }


    if (
        powerW <= 7000
    ) {

        return 5;
    }


    return 6;
}


// ============================================================================
// GESCHWINDIGKEIT
// ============================================================================

function getSecondsPerPath(
    powerW
)
{
    if (
        powerW <= 0
    ) {

        return 999;
    }


    if (
        powerW <= 10
    ) {

        return 13.0;
    }


    if (
        powerW <= 50
    ) {

        return 10.5;
    }


    if (
        powerW <= 150
    ) {

        return 8.5;
    }


    if (
        powerW <= 300
    ) {

        return 7.0;
    }


    if (
        powerW <= 750
    ) {

        return 5.5;
    }


    if (
        powerW <= 1500
    ) {

        return 4.4;
    }


    if (
        powerW <= 3000
    ) {

        return 3.4;
    }


    if (
        powerW <= 5000
    ) {

        return 2.7;
    }


    if (
        powerW <= 8000
    ) {

        return 2.2;
    }


    return 1.9;
}


// ============================================================================
// BATTERIEFÜLLUNG
// ============================================================================

function updateBatteryFill()
{
    const fill =
        document.getElementById(
            'batteryFill'
        );


    if (
        !fill
    ) {

        return;
    }


    const soc =
        Math.max(
            0,
            Math.min(
                100,

                Number(
                    state.values.soc
                )
                ||
                0
            )
        );


    fill.setAttribute(

        'width',

        (
            48
            *
            soc
            /
            100
        ).toFixed(2)
    );
}


// ============================================================================
// DOMINANTE QUELLENFARBE
// ============================================================================

function getDominantColor(
    pv,
    battery,
    grid
)
{
    const values =
        [
            {
                value:
                    Number(
                        pv
                    )
                    ||
                    0,

                color:
                    COLORS.pv
            },

            {
                value:
                    Number(
                        battery
                    )
                    ||
                    0,

                color:
                    COLORS.battery
            },

            {
                value:
                    Number(
                        grid
                    )
                    ||
                    0,

                color:
                    COLORS.grid
            }
        ];


    values.sort(
        (
            a,
            b
        ) =>

            b.value
            -
            a.value
    );


    return values[0].value > 0

        ?

        values[0].color

        :

        COLORS.neutral;
}


// ============================================================================
// WETTER
// ============================================================================

function getWeather(
    conditionID,
    conditionIcon,
    rain,
    clouds
)
{
    const id =
        Number(
            conditionID
        )
        ||
        0;


    const icon =
        String(
            conditionIcon
            ||
            ''
        );


    const cloudValue =
        Number(
            clouds
        )
        ||
        0;


    if (
        rain
    ) {

        return {

            symbol:
                '🌧️',

            text:
                'Regen'
        };
    }


    if (
        id >= 200
        &&
        id < 300
    ) {

        return {

            symbol:
                '⛈️',

            text:
                'Gewitter'
        };
    }


    if (
        id >= 300
        &&
        id < 600
    ) {

        return {

            symbol:
                '🌧️',

            text:
                'Regen'
        };
    }


    if (
        id >= 600
        &&
        id < 700
    ) {

        return {

            symbol:
                '🌨️',

            text:
                'Schnee'
        };
    }


    if (
        id >= 700
        &&
        id < 800
    ) {

        return {

            symbol:
                '🌫️',

            text:
                'Nebel'
        };
    }


    if (
        id === 800
    ) {

        const night =
            icon.endsWith(
                'n'
            );


        return {

            symbol:

                night
                    ?
                    '🌙'
                    :
                    '☀️',

            text:

                night
                    ?
                    'Klar'
                    :
                    'Sonnig'
        };
    }


    if (
        id === 801
        ||
        id === 802
    ) {

        return {

            symbol:
                '🌤️',

            text:
                Math.round(
                    cloudValue
                )
                +
                ' % bewölkt'
        };
    }


    if (
        id === 803
        ||
        id === 804
    ) {

        return {

            symbol:
                '☁️',

            text:
                Math.round(
                    cloudValue
                )
                +
                ' % bewölkt'
        };
    }


    return {

        symbol:
            '🌤️',

        text:
            Math.round(
                cloudValue
            )
            +
            ' % bewölkt'
    };
}


// ============================================================================
// LEISTUNG FORMATIEREN
// ============================================================================

function formatPower(
    powerW
)
{
    const value =
        Math.abs(
            Number(
                powerW
            )
            ||
            0
        );


    if (
        value >= 1000
    ) {

        return (
            value
            /
            1000
        ).toFixed(2)
        +
        ' kW';
    }


    if (
        value >= 100
    ) {

        return Math.round(
            value
        )
        +
        ' W';
    }


    return value.toFixed(1)
        +
        ' W';
}


// ============================================================================
// NETZINFO
// ============================================================================

function formatGridInfo(
    voltage,
    frequency
)
{
    const parts =
        [];


    const v =
        Number(
            voltage
        );


    const f =
        Number(
            frequency
        );


    if (
        Number.isFinite(
            v
        )
        &&
        v > 0
    ) {

        parts.push(
            v.toFixed(0)
            +
            ' V'
        );
    }


    if (
        Number.isFinite(
            f
        )
        &&
        f > 0
    ) {

        parts.push(
            f.toFixed(1)
            +
            ' Hz'
        );
    }


    return parts.length

        ?

        parts.join(
            ' · '
        )

        :

        '-';
}


// ============================================================================
// TEXT SETZEN
// ============================================================================

function setText(
    id,
    text
)
{
    const element =
        document.getElementById(
            id
        );


    if (
        element
    ) {

        element.textContent =
            text;
    }
}

document.addEventListener(
    'DOMContentLoaded',
    init
);
